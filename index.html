                onChange={(v) => setVerificaPortiereScelto((s) => ({ ...s, [ver.id]: v }))}
              />
            </div>

            <div className="no-print" style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
              <button
                onClick={() => verificaPortiereScelto[ver.id] && approvaVerifica(ver, Number(verificaPortiereScelto[ver.id]))}
                disabled={!verificaPortiereScelto[ver.id]}
                style={{ ...primaryBtn, fontSize: 13, padding: "8px 14px", opacity: verificaPortiereScelto[ver.id] ? 1 : 0.5, cursor: verificaPortiereScelto[ver.id] ? "pointer" : "not-allowed" }}
              >
                ✅ Aggiungi alla scheda
              </button>
              <button onClick={() => scartaVerifica(ver)} style={{ background: "none", border: `1px solid ${coral}`, color: coral, borderRadius: 9, padding: "8px 14px", fontSize: 13, cursor: "pointer" }}>
                Scarta
              </button>
            </div>
          </div>
        ))}
      </div>
    );
  }

  if (view.page === "note") {
    return (
      <div style={{ padding: 20, maxWidth: 640, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Note veloci" />
        <div style={{ height: 18 }} />

        <div className="no-print" style={{ ...cardStyle, marginBottom: 16 }}>
          <label style={labelStyle}>Nuova nota</label>
          <textarea
            id="nuova-nota-campo"
            style={{ ...inputStyle, minHeight: 80, resize: "vertical" }}
            placeholder="Es. Chiamare il genitore di Rossi per il pacchetto, portare guanti taglia 7 domani, idea per l'allenamento di gruppo..."
            onKeyDown={(e) => {
              if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
                aggiungiNota(e.target.value);
                e.target.value = "";
              }
            }}
          />
          <button
            onClick={() => {
              const campo = document.getElementById("nuova-nota-campo");
              aggiungiNota(campo.value);
              campo.value = "";
            }}
            style={{ ...primaryBtn, marginTop: 10, width: "100%" }}
          >
            + Aggiungi nota
          </button>
        </div>

        {noteVeloci.length === 0 && (
          <p style={{ fontSize: 14, color: textMuted, textAlign: "center", marginTop: 30 }}>Nessuna nota ancora. Scrivine una qui sopra — resta sempre a portata di mano.</p>
        )}

        {noteVeloci.map((n) => (
          <div key={n.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
            <div>
              <p style={{ margin: 0, fontSize: 14, color: textPrimary, whiteSpace: "pre-wrap" }}>{n.testo}</p>
              <p style={{ margin: "6px 0 0", fontSize: 11, color: textMuted }}>
                {new Date(n.creato_il).toLocaleDateString("it-IT")} · {new Date(n.creato_il).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })}
              </p>
            </div>
            <button
              className="no-print"
              onClick={() => confirmAction("Eliminare questa nota?", () => rimuoviNota(n.id))}
              style={{ background: "none", border: "none", color: coral, fontSize: 16, cursor: "pointer", flexShrink: 0 }}
            >
              🗑️
            </button>
          </div>
        ))}
      </div>
    );
  }

  if (view.page === "documenti") {
    const TIPI_DOC = ["Relazione", "Analisi gara", "Appunto", "Lettera", "Segnalazione", "Altro"];
    return (
      <div style={{ padding: 20, maxWidth: 640, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Documenti" />
        <div style={{ height: 18 }} />

        <button
          className="no-print"
          onClick={() => {
            const id = aggiungiDocumento({ tipo: "Relazione", titolo: "Nuovo documento", contenuto: "" });
            setView({ page: "documento-dettaglio", id });
          }}
          style={{ ...primaryBtn, width: "100%", marginBottom: 16 }}
        >
          + Nuovo documento
        </button>

        {documenti.length === 0 && (
          <p style={{ fontSize: 14, color: textMuted, textAlign: "center", marginTop: 30 }}>
            Nessun documento ancora. Crea relazioni, analisi gara, lettere o appunti che poi puoi stampare o esportare in PDF con intestazione.
          </p>
        )}

        {documenti.map((d) => (
          <button
            key={d.id}
            onClick={() => setView({ page: "documento-dettaglio", id: d.id })}
            style={{ ...cardStyle, display: "block", width: "100%", textAlign: "left", cursor: "pointer" }}
          >
            <p style={{ margin: 0, fontSize: 11, fontWeight: 700, color: coral, textTransform: "uppercase", letterSpacing: "0.04em" }}>{d.tipo}</p>
            <p style={{ margin: "3px 0 0", fontSize: 16, fontWeight: 700, color: textPrimary }}>{d.titolo}</p>
            <p style={{ margin: "4px 0 0", fontSize: 12, color: textMuted }}>
              {d.contenuto ? d.contenuto.slice(0, 90) + (d.contenuto.length > 90 ? "…" : "") : "Vuoto"}
            </p>
            <p style={{ margin: "6px 0 0", fontSize: 11, color: textMuted }}>Modificato il {formatData((d.modificato_il || d.creato_il).slice(0, 10))}</p>
          </button>
        ))}
      </div>
    );
  }

  if (view.page === "documento-dettaglio") {
    const d = documenti.find((x) => x.id === view.id);
    if (!d) {
      setView({ page: "documenti" });
      return null;
    }
    const TIPI_DOC = ["Relazione", "Analisi gara", "Appunto", "Lettera", "Segnalazione", "Altro"];
    return (
      <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
        {printStyle}
        <Menu />
        <div className="no-print" style={{ maxWidth: 700, margin: "0 auto", padding: "14px 40px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <button onClick={() => setView({ page: "lista" })} title="Torna alla home" style={{ background: surface2, color: textPrimary, border: `1px solid ${border}`, borderRadius: 10, width: 36, height: 36, fontSize: 16, cursor: "pointer" }}>🏠</button>
            <button onClick={() => setView({ page: "documenti" })} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: textPrimary, fontSize: 15, fontWeight: 600, cursor: "pointer", padding: 0 }}>
              <span style={{ fontSize: 18, lineHeight: 1 }}>←</span> Documenti
            </button>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={handlePrint} style={primaryBtn}>🖨️ Stampa / Esporta PDF</button>
            <button onClick={() => handleShare(d.titolo, `${d.tipo} — ${d.titolo}`)} style={ghostBtn}>📤 Condividi</button>
            <button
              onClick={() => confirmAction("Eliminare questo documento?", () => { rimuoviDocumento(d.id); setView({ page: "documenti" }); })}
              style={{ background: "none", border: `1px solid ${coral}`, color: coral, borderRadius: 9, padding: "8px 12px", fontSize: 13, cursor: "pointer" }}
            >
              Elimina
            </button>
          </div>
        </div>

        <div className="no-print" style={{ maxWidth: 700, margin: "0 auto 10px", padding: "0 40px" }}>
          <div style={cardStyle}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 10, marginBottom: 10 }}>
              <div>
                <label style={labelStyle}>Tipo</label>
                <select style={inputStyle} value={d.tipo} onChange={(e) => modificaDocumento(d.id, { tipo: e.target.value })}>
                  {TIPI_DOC.map((t) => (
                    <option key={t} value={t}>{t}</option>
                  ))}
                </select>
              </div>
              <div>
                <label style={labelStyle}>Titolo</label>
                <input style={inputStyle} type="text" value={d.titolo} onChange={(e) => modificaDocumento(d.id, { titolo: e.target.value })} />
              </div>
            </div>
            <label style={labelStyle}>Contenuto</label>
            <textarea
              style={{ ...inputStyle, minHeight: 260, resize: "vertical", lineHeight: 1.5 }}
              value={d.contenuto}
              placeholder="Scrivi qui la relazione, l'analisi, la lettera, l'appunto..."
              onChange={(e) => modificaDocumento(d.id, { contenuto: e.target.value })}
            />
          </div>
        </div>

        <div id="print-area" style={{ maxWidth: 700, margin: "0 auto", padding: "30px 40px 60px", background: "#fff", color: "#1a1a1a" }}>
          <div style={{ textAlign: "center", marginBottom: 10 }}>
            <LogoDocumento custom={settings.logoCustom} w={90} />
            <p style={{ margin: 0, fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, color: "#333" }}>{settings.academyName || "MB Goalkeeper Academy Gest"}</p>
            {(settings.coachName || settings.mittenteTelefono || settings.mittenteEmail) && (
              <p style={{ margin: "4px 0 0", fontSize: 12, color: "#777" }}>
                {settings.coachName}
                {settings.coachName && (settings.mittenteTelefono || settings.mittenteEmail) ? " · " : ""}
                {settings.mittenteTelefono}
                {settings.mittenteTelefono && settings.mittenteEmail ? " · " : ""}
                {settings.mittenteEmail}
              </p>
            )}
          </div>
          <div style={{ borderTop: "2px solid #333", margin: "18px 0 24px" }} />
          <p style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em", color: "#999", margin: "0 0 4px", fontWeight: 700 }}>{d.tipo}</p>
          <h1 style={{ fontSize: 22, margin: "0 0 6px" }}>{d.titolo}</h1>
          <p style={{ fontSize: 12, color: "#999", margin: "0 0 24px" }}>{formatData(oggiISO())}</p>
          <p style={{ fontSize: 15, color: "#222", whiteSpace: "pre-wrap", lineHeight: 1.7, margin: 0 }}>{d.contenuto || "—"}</p>
        </div>
      </div>
    );
  }


  // ---- Insoluti e Prossimi incassi: modifica / elimina / segna pagato ----
  const chiaveVoce = (i) => `${i.tipo}-${i.id}`;
  const iniziaModificaVoce = (i) => {
    if (i.tipo === "pacchetto") {
      const pk = pacchetti.find((x) => x.id === i.id);
      if (!pk) return;
      setFormVoce({ importo: pk.importoTotale != null ? String(pk.importoTotale) : "", data: pk.dataScadenzaSaldo || pk.dataInizio || "" });
    } else {
      const e = entrate.find((x) => x.id === i.id);
      if (!e) return;
      setFormVoce({ importo: e.importo != null ? String(e.importo) : "", data: e.data || "" });
    }
    setVoceInModifica(chiaveVoce(i));
  };
  const salvaModificaVoce = (i) => {
    const imp = Number(formVoce.importo) || 0;
    if (i.tipo === "pacchetto") modificaPacchetto(i.id, { importoTotale: imp, dataScadenzaSaldo: formVoce.data || null });
    else modificaEntrata(i.id, { importo: imp, data: formVoce.data });
    setVoceInModifica(null);
  };
  const segnaPagatoVoce = (i) => {
    if (i.tipo === "pacchetto") modificaPacchetto(i.id, { pagato: true, dataPagamento: oggiISO() });
    else modificaEntrata(i.id, { pagato: true });
  };
  const eliminaVoce = (i) => {
    const rec = i.tipo === "pacchetto" ? pacchetti.find((x) => x.id === i.id) : entrate.find((x) => x.id === i.id);
    if (!rec) return;
    const acconto = Number(rec.acconto) || 0;
    if (acconto > 0) {
      confirmAction(
        `Togliere il residuo di €${i.importo.toFixed(2)} per ${i.nome}? L'acconto di €${acconto.toFixed(2)} già incassato resta registrato.`,
        () => {
          if (i.tipo === "pacchetto") modificaPacchetto(i.id, { importoTotale: acconto, pagato: true, dataPagamento: rec.dataAcconto || oggiISO() });
          else modificaEntrata(i.id, { importo: acconto, pagato: true });
        }
      );
    } else if (i.tipo === "pacchetto") {
      confirmAction(`Eliminare l'incasso previsto di €${i.importo.toFixed(2)} per ${i.nome}? Il pacchetto resta, viene tolto solo l'importo.`, () => modificaPacchetto(i.id, { importoTotale: null }));
    } else {
      confirmAction(`Eliminare questa seduta non pagata di €${i.importo.toFixed(2)} per ${i.nome}?`, () => rimuoviEntrata(i.id));
    }
  };
  const renderVoceDaIncassare = (i, colore, conWhatsapp) => {
    const key = chiaveVoce(i);
    const inModifica = voceInModifica === key;
    const pp = portieri.find((p) => String(p.id) === String(i.portiereId));
    const messaggio = `Ciao! Ti scrivo per ricordarti un pagamento in sospeso di €${i.importo.toFixed(2)} (${i.dettaglio}) per ${i.nome}. Grazie! 🙂`;
    const btnPiccolo = { background: "none", border: `1px solid ${border}`, borderRadius: 8, padding: "6px 10px", fontSize: 12, color: textSecondary, cursor: "pointer" };
    return (
      <div key={key} style={{ ...cardStyle }}>
        {inModifica ? (
          <div>
            <p style={{ margin: "0 0 10px", fontSize: 15, fontWeight: 700, color: textPrimary }}>{i.nome} · {i.dettaglio}</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
              <div>
                <label style={labelStyle}>{i.tipo === "pacchetto" ? "Importo totale (€)" : "Importo (€)"}</label>
                <input style={inputStyle} type="number" step="0.01" value={formVoce.importo} onChange={(e) => setFormVoce((f) => ({ ...f, importo: e.target.value }))} />
              </div>
              <div>
                <label style={labelStyle}>{i.tipo === "pacchetto" ? "Scadenza del saldo" : "Data"}</label>
                <input style={inputStyle} type="date" value={formVoce.data} onChange={(e) => setFormVoce((f) => ({ ...f, data: e.target.value }))} />
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => salvaModificaVoce(i)} style={{ ...primaryBtn, padding: "8px 16px", fontSize: 13 }}>Salva</button>
              <button onClick={() => setVoceInModifica(null)} style={{ ...ghostBtn, padding: "8px 16px", fontSize: 13 }}>Annulla</button>
            </div>
          </div>
        ) : (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
              <div style={{ minWidth: 0 }}>
                <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: textPrimary }}>{i.nome}</p>
                <p style={{ margin: "3px 0 0", fontSize: 13, color: textMuted }}>
                  {i.dettaglio} · {formatData(i.data)} · <span style={{ color: colore, fontWeight: 700 }}>€{i.importo.toFixed(2)}</span>
                </p>
              </div>
              <button
                onClick={() => segnaPagatoVoce(i)}
                style={{ background: "rgba(31,157,85,0.12)", color: "#1f9d55", border: "1px solid #1f9d55", borderRadius: 9, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}
              >
                ✅ Segna pagato
              </button>
            </div>
            <div className="no-print" style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
              {conWhatsapp && pp && pp.telefono && (
                <a
                  href={`https://wa.me/${pp.telefono.replace(/[^\d]/g, "")}?text=${encodeURIComponent(messaggio)}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Promemoria WhatsApp"
                  style={{ ...btnPiccolo, color: whatsapp, border: `1px solid ${whatsapp}`, textDecoration: "none" }}
                >
                  💬 Promemoria
                </a>
              )}
              <button onClick={() => iniziaModificaVoce(i)} style={btnPiccolo}>✎ Modifica</button>
              <button onClick={() => eliminaVoce(i)} style={{ ...btnPiccolo, color: coral, border: `1px solid ${coral}` }}>🗑 Elimina</button>
            </div>
          </>
        )}
      </div>
    );
  };

  if (view.page === "insoluti") {
    return (
      <div style={{ padding: 20, maxWidth: 640, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Insoluti" />
        <div style={{ height: 18 }} />
        <p style={{ fontSize: 14, color: textSecondary, marginBottom: 16 }}>
          {insolutiList.length} voce/i non ancora saldate · totale €{insolutiTotale.toFixed(2)}
        </p>
        {insolutiList.length === 0 && <p style={{ fontSize: 14, color: textMuted }}>Nessun insoluto al momento 🎉</p>}
        {insolutiList.map((i) => renderVoceDaIncassare(i, coral, true))}
      </div>
    );
  }

  if (view.page === "prossimi-incassi") {
    const prossimiTotale = prossimiIncassiList.reduce((s, i) => s + i.importo, 0);
    return (
      <div style={{ padding: 20, maxWidth: 640, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Prossimi incassi" />
        <div style={{ height: 18 }} />
        <p style={{ fontSize: 14, color: textSecondary, marginBottom: 6 }}>
          {prossimiIncassiList.length} voce/i non ancora saldate · totale €{prossimiTotale.toFixed(2)}
        </p>
        <p style={{ fontSize: 13, color: textMuted, marginBottom: 16 }}>
          Pacchetti e sedute che hai già preparato in anticipo, con data di oggi o futura. Quello che è di oggi e non ancora pagato compare anche tra gli Insoluti. Appena li segni come pagati, spariscono automaticamente da qui.
        </p>
        {prossimiIncassiList.length === 0 && <p style={{ fontSize: 14, color: textMuted }}>Nessun incasso futuro in programma al momento.</p>}
        {prossimiIncassiList.map((i) => renderVoceDaIncassare(i, sky, false))}
      </div>
    );
  }

  if (view.page === "appuntamenti-pacchetti") {
    const oggiP = oggiISO();
    const giornoLungo = (iso) => {
      const nome = new Date(iso + "T12:00:00").toLocaleDateString("it-IT", { weekday: "long" });
      return `${nome} ${formatData(iso)}`;
    };
    const righe = pacchetti.map((pk) => {
      const speciale = pk.tipo === "speciale";
      const fatteSet = new Set(pk.sedute || []);
      const fatte = fatteSet.size;
      const totale = Number(pk.numeroSedute) || 0;
      const mancanti = Math.max(0, totale - fatte);
      const programma = speciale
        ? (pk.pianificazione || []).filter((x) => x.data).map((x) => ({ data: x.data, orario: null, durata: x.durata }))
        : (pk.datePrestabilite || []).map((d) => ({ data: d, orario: pk.orario, durata: null }));
      const daFare = programma.filter((x) => !fatteSet.has(x.data)).sort((x, y) => x.data.localeCompare(y.data));
      const scadute = daFare.filter((x) => x.data < oggiP);
      const recuperiDaFissare = (pk.assenze || []).filter((x) => x.tipo === "recuperata" && !x.dataRecupero).length;
      const finito = mancanti === 0;
      return { pk, speciale, fatte, totale, mancanti, daFare, scadute, recuperiDaFissare, finito };
    }).filter((r) => !(r.finito && r.pk.rinnovato) && r.totale > 0);

    const perPortiere = {};
    righe.forEach((r) => {
      const k = String(r.pk.portiereId);
      if (!perPortiere[k]) perPortiere[k] = { nome: (portieri.find((p) => String(p.id) === k) || {}).nome || r.pk.nome || "—", righe: [] };
      perPortiere[k].righe.push(r);
    });
    const elenco = Object.values(perPortiere).sort((x, y) => x.nome.localeCompare(y.nome));
    elenco.forEach((g) => g.righe.sort((x, y) => (x.pk.dataInizio || "").localeCompare(y.pk.dataInizio || "")));
    const nAttivi = righe.filter((r) => !r.finito).length;
    const nDaRinnovare = righe.filter((r) => r.finito).length;

    return (
      <div style={{ padding: 20, maxWidth: 700, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="A che punto sono i pacchetti" />
        <div style={{ height: 18 }} />

        <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
          <button onClick={() => handleShare("A che punto sono i pacchetti", "")} style={primaryBtn}>📤 Condividi / Salva immagine</button>
          <button onClick={handlePrint} style={ghostBtn}>🖨️ Stampa / Esporta PDF</button>
        </div>

        <div id="print-area">
        <h1 style={{ fontSize: 20, margin: "0 0 4px" }}>A che punto sono i pacchetti</h1>
        <p style={{ fontSize: 13, color: textMuted, marginBottom: 18 }}>
          Aggiornato al {formatData(oggiP)} · {nAttivi} pacchetto/i in corso{nDaRinnovare > 0 ? ` · ${nDaRinnovare} finito/i da rinnovare` : ""}
        </p>

        {elenco.length === 0 && (
          <p style={{ fontSize: 14, color: textMuted, textAlign: "center", marginTop: 30 }}>Nessun pacchetto in corso al momento.</p>
        )}

        {elenco.map((g) => (
          <div key={g.nome} style={{ ...cardStyle, marginBottom: 14 }}>
            <p style={{ margin: "0 0 10px", fontSize: 16, fontWeight: 700, color: sky }}>🧤 {g.nome}</p>
            {g.righe.map((r, i) => (
              <div key={r.pk.id} style={{ borderTop: i > 0 ? `1px solid ${border}` : "none", paddingTop: i > 0 ? 10 : 0, marginTop: i > 0 ? 10 : 0 }}>
                <p style={{ margin: "0 0 6px", fontSize: 12, color: textMuted }}>
                  {r.speciale ? "Pacchetto speciale" : `Pacchetto da ${r.totale} sedute`}{r.pk.dataInizio ? ` · iniziato il ${formatData(r.pk.dataInizio)}` : ""}
                </p>
                <p style={{ margin: "3px 0", fontSize: 15, color: textPrimary }}>
                  ✅ Sedute svolte: <b>{r.fatte}</b> su {r.totale}
                </p>
                {r.finito ? (
                  <p style={{ margin: "3px 0", fontSize: 15, fontWeight: 700, color: coral }}>
                    🔔 Pacchetto finito: sono state fatte tutte le sedute. Da rinnovare.
                  </p>
                ) : (
                  <>
                    <p style={{ margin: "3px 0", fontSize: 15, color: textPrimary }}>
                      ⏳ Sedute mancanti: <b>{r.mancanti}</b>
                    </p>
                    {Array.from({ length: r.mancanti }).map((_, j) => {
                      const slot = r.daFare[j];
                      const numero = r.fatte + j + 1;
                      return (
                        <p key={j} style={{ margin: "3px 0 3px 18px", fontSize: 14, color: textPrimary }}>
                          ➡️ La {numero}ª seduta{j === 0 ? " è la prossima da svolgere" : ""}:{" "}
                          {slot ? (
                            <b>{giornoLungo(slot.data)}{slot.orario ? ` alle ${slot.orario}` : ""}{slot.durata ? ` (${slot.durata} ${slot.durata === 1 ? "ora" : "ore"})` : ""}</b>
                          ) : (

        <div style={{ ...cardStyle, border: `1px solid #1f9d55` }}>
          <p style={{ ...sectionLabelStyle, color: "#1f9d55" }}>💾 Backup locale</p>
          <div style={{ fontSize: 12, color: textMuted, marginBottom: 12 }}>
            Scarica una copia completa di tutti i dati (portieri, pacchetti, spese, sedute, eventi,
            certificati, sponsor, inventario) in un file sul tuo Mac/telefono. Indipendente da
            Supabase, Netlify o Claude — tienilo come "assicurazione" extra, magari anche su iCloud
            o Google Drive. Consigliato farlo ogni tanto, specialmente dopo aver inserito molti dati nuovi.
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>

              onClick={scaricaBackup}
              style={{ ...primaryBtn, flex: "1 1 200px" }}

            <button
              onClick={() => backupFileInputRef.current && backupFileInputRef.current.click()}
              style={{ ...ghostBtn, flex: "1 1 200px" }}
            >
              📤 Ripristina da un backup
            </button>
            <input
              ref={backupFileInputRef}
              type="file"
              accept=".json,application/json"
              style={{ display: "none" }}
              onChange={(e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  try {
                    const dati = JSON.parse(reader.result);
                    if (!dati || dati.versione !== 1) {
                      window.alert("File non riconosciuto: non sembra un backup valido di questo gestionale.");
                      return;
                    }
                    const riepilogo = [
                      dati.portieri ? `${dati.portieri.length} portieri` : null,
                      dati.pacchetti ? `${dati.pacchetti.length} pacchetti` : null,
                      dati.spese ? `${dati.spese.length} spese` : null,
                      dati.entrate ? `${dati.entrate.length} sedute/entrate` : null,
                    ].filter(Boolean).join(", ");
                    confirmAction(
                      `Ripristinare questo backup (del ${dati.esportatoIl ? formatData(dati.esportatoIl.slice(0, 10)) : "—"}, con ${riepilogo})? SOSTITUIRÀ TUTTI i dati attuali con quelli del backup. Non si può annullare.`,
                      () => {
                        const opz = { saltaFusione: true };
                        if (dati.portieri) persist(PORTIERI_KEY, dati.portieri, setPortieri, opz);
                        if (dati.guanti) persist(GUANTI_KEY, dati.guanti, setGuanti, opz);
                        if (dati.pacchetti) persist(PACCHETTI_KEY, dati.pacchetti, setPacchetti, opz);
                        if (dati.spese) persist(SPESE_KEY, dati.spese, setSpese, opz);
                        if (dati.entrate) persist(ENTRATE_KEY, dati.entrate, setEntrate, opz);
                        if (dati.eventi) persist(EVENTI_KEY, dati.eventi, setEventi, opz);
                        if (dati.certificati) persist(CERTIFICATI_KEY, dati.certificati, setCertificati, opz);
                        if (dati.sponsorComm) persist(SPONSOR_COMM_KEY, dati.sponsorComm, setSponsorComm, opz);
                        if (dati.sponsorTech) persist(SPONSOR_TECH_KEY, dati.sponsorTech, setSponsorTech, opz);
                        if (dati.inventario) persist(INVENTARIO_KEY, dati.inventario, setInventario, opz);
                        if (dati.noteVeloci) persist(NOTE_VELOCI_KEY, dati.noteVeloci, setNoteVeloci, opz);
                        if (dati.documenti) persist(DOCUMENTI_KEY, dati.documenti, setDocumenti, opz);
                        if (dati.settings) persist(SETTINGS_KEY, dati.settings, setSettings, opz);
                      }
                    );
                  } catch (err) {
                    window.alert("Impossibile leggere il file: " + err.message);
                  }
                };
                reader.readAsText(file);
              }}
            />
          </div>
        </div>

        <div style={{ ...cardStyle, border: `1px solid rgba(201,82,47,0.35)` }}>

          <div style={{ height: 18 }} />
          <div style={{ fontSize: 12, color: textMuted, marginBottom: 12 }}>
            Controlla se nei dati salvati ci sono ID duplicati (un bug corretto in questa versione, che poteva
            capitare con elementi creati in sessioni diverse). Il controllo è di sola lettura: non modifica nulla.
          </div>
          <button onClick={() => setMostraControlloId((v) => !v)} style={ghostBtn}>
            {mostraControlloId ? "Nascondi controllo" : "Verifica integrità dati"}
          </button>
          {mostraControlloId && (() => {
            const collezioniSicure = {
              "Materiale": { key: GUANTI_KEY, data: guanti, setter: setGuanti },
              "Pacchetti": { key: PACCHETTI_KEY, data: pacchetti, setter: setPacchetti },
              "Spese": { key: SPESE_KEY, data: spese, setter: setSpese },
              "Sedute/Entrate": { key: ENTRATE_KEY, data: entrate, setter: setEntrate },
              "Eventi": { key: EVENTI_KEY, data: eventi, setter: setEventi },
              "Certificati": { key: CERTIFICATI_KEY, data: certificati, setter: setCertificati },
              "Sponsor commerciali": { key: SPONSOR_COMM_KEY, data: sponsorComm, setter: setSponsorComm },
              "Sponsor tecnici": { key: SPONSOR_TECH_KEY, data: sponsorTech, setter: setSponsorTech },
              "Inventario": { key: INVENTARIO_KEY, data: inventario, setter: setInventario },
              "Note veloci": { key: NOTE_VELOCI_KEY, data: noteVeloci, setter: setNoteVeloci },
              "Documenti": { key: DOCUMENTI_KEY, data: documenti, setter: setDocumenti },
            };
            const correggiDuplicati = (nome) => {
              const c = collezioniSicure[nome];
              if (!c) return;
              const visti = new Set();
              const nuovi = c.data.map((x) => {
                if (visti.has(x.id)) return { ...x, id: generaId() };
                visti.add(x.id);
                return x;
              });
              persist(c.key, nuovi, c.setter);
            };
            const collezioni = [
              ["Portieri", portieri],
              ["Materiale", guanti],
              ["Pacchetti", pacchetti],
              ["Spese", spese],
              ["Sedute/Entrate", entrate],
              ["Eventi", eventi],
              ["Certificati", certificati],
              ["Sponsor commerciali", sponsorComm],
              ["Sponsor tecnici", sponsorTech],
              ["Inventario", inventario],
            ];
            const risultati = collezioni.map(([nome, arr]) => {
              const conteggio = {};
              (arr || []).forEach((x) => { conteggio[x.id] = (conteggio[x.id] || 0) + 1; });
              const duplicati = Object.entries(conteggio).filter(([, n]) => n > 1);
              return { nome, duplicati };
            });
            const totaleProblemi = risultati.reduce((s, r) => s + r.duplicati.length, 0);
            return (
              <div style={{ marginTop: 14 }}>
                {totaleProblemi === 0 ? (
                  <p style={{ fontSize: 13, color: "#1f9d55", fontWeight: 600 }}>✅ Nessun ID duplicato trovato.</p>
                ) : (
                  <div>
                    <p style={{ fontSize: 13, color: coral, fontWeight: 700, marginBottom: 8 }}>
                      ⚠️ Trovati ID duplicati — può causare confusione tra elementi (es. righe che si sovrappongono o si modificano a coppie).
                    </p>
                    {risultati.filter((r) => r.duplicati.length > 0).map((r) => (
                      <div key={r.nome} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, margin: "6px 0" }}>
                        <p style={{ fontSize: 13, color: textSecondary, margin: 0 }}>
                          {r.nome}: {r.duplicati.length} ID duplicato/i (usati {r.duplicati.map(([id, n]) => `${n}×`).join(", ")} volte)
                        </p>
                        {collezioniSicure[r.nome] && (
                          <button
                            onClick={() => confirmAction(`Correggere gli ID duplicati in "${r.nome}"? Ogni elemento in più riceverà un nuovo ID univoco; i dati non vengono toccati.`, () => correggiDuplicati(r.nome))}
                            style={{ ...ghostBtn, padding: "5px 10px", fontSize: 12, flexShrink: 0 }}
                          >
                            Correggi automaticamente
                          </button>
                        )}
                      </div>
                    ))}
                    {risultati.some((r) => r.nome === "Portieri" && r.duplicati.length > 0) && (
                      <p style={{ fontSize: 12, color: coral, marginTop: 10 }}>
                        I Portieri non hanno correzione automatica (il loro ID è collegato a sedute, pacchetti e certificati):
                        se compaiono qui, dimmelo in chat e li sistemiamo insieme con calma.
                      </p>
                    )}
                    <p style={{ fontSize: 12, color: textMuted, marginTop: 10 }}>
                      Dopo la correzione automatica, ricontrolla premendo di nuovo "Verifica integrità dati".
                    </p>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      </div>
    );
  }

  if (view.page === "pacchetto-dettaglio") {
    const pk = pacchetti.find((x) => x.id === view.id);
    if (!pk) {
      setView({ page: "pacchetti" });
      return null;
    }
    return (
      <PaginaPacchettoDettaglio
        pk={pk}
        pacchetti={pacchetti}
        portieri={portieri}
        aggiungiSeduta={aggiungiSeduta}
        rimuoviSeduta={rimuoviSeduta}
        rimuoviPacchetto={rimuoviPacchetto}
        modificaPacchetto={modificaPacchetto}
        setView={setView}
        goBack={goBack}
        confirmAction={confirmAction}
        printStyle={printStyle}
        Menu={Menu}
        handlePrint={handlePrint}
        handleShare={handleShare}
        settings={settings}
      />
    );
  }

  const totalWA = portieri.filter((p) => p.wa).length;
  const pacchettiAttivi = pacchetti.filter((pk) => new Set(pk.sedute).size < pk.numeroSedute).length;
  const oggiRecap = oggiISO();
  const transazioniOggi = (() => {
    const nomeP = (id) => {
      const pp = id != null && id !== "" ? portieri.find((x) => String(x.id) === String(id)) : null;
      return pp ? " — " + pp.nome : "";
    };
    // Acconto e saldo dello stesso pacchetto/seduta incassati nello stesso giorno: una riga sola, col totale.
    const gruppiOggi = {};
    ricavaIncassi(guanti, pacchetti, entrate, eventi, sponsorComm)
      .filter((v) => v.data === oggiRecap)
      .forEach((v) => {
        const k = `${v.sourceType}-${v.sourceId}`;
        if (!gruppiOggi[k]) gruppiOggi[k] = [];
        gruppiOggi[k].push(v);
      });
    const incassiOggi = Object.values(gruppiOggi).map((gr) => {
      const v = gr[0];
      const parte = gr.length > 1 ? " (acconto + saldo)" : v.parte ? ` (${v.parte})` : "";
      let causale;
      if (v.sourceType === "manuale") causale = `${v.fonte || "Seduta"}${nomeP(v.portiereId)}${parte}`;
      else if (v.sourceType === "pacchetto") causale = `Pacchetto${nomeP(v.portiereId)}${parte}`;
      else causale = `${v.fonte} — ${v.dettaglio}`;
      return { causale, importo: gr.reduce((sum, x) => sum + (Number(x.importo) || 0), 0), movimento: "incasso" };
    });
    // Righe identiche (stesso nome e stesso importo) da registrazioni diverse: segnalo il sospetto doppione
    const viste = {};
    incassiOggi.forEach((t) => {
      const k = `${t.causale}|${t.importo.toFixed(2)}`;
      if (viste[k]) t.doppione = true;
      viste[k] = true;
    });
    const speseOggi = spese
      .filter((s) => s.data === oggiRecap)
      .map((s) => ({ causale: cap(s.categoria || "Spesa"), importo: Number(s.importo) || 0, movimento: "spesa" }));
    return [...incassiOggi, ...speseOggi];
  })();
  const incassatoOggi = transazioniOggi.filter((t) => t.movimento === "incasso").reduce((s, t) => s + t.importo, 0);
  const spesoOggi = transazioniOggi.filter((t) => t.movimento === "spesa").reduce((s, t) => s + t.importo, 0);
  const speseTotale = spese.reduce((s, sp) => s + (Number(sp.importo) || 0), 0);
  const meseCorrente = oggiISO().slice(0, 7);
  const incassiMeseCorrente = ricavaIncassi(guanti, pacchetti, entrate, eventi, sponsorComm)
    .filter((v) => v.data && v.data.slice(0, 7) === meseCorrente)
    .reduce((s, v) => s + v.importo, 0);

  // Avvisi: calcolati dal vivo in base alle impostazioni, mostrati come banner in home.
  const oggiTs = new Date(oggiISO()).getTime();
  const giorniDa = (dataStr) => {
    if (!dataStr) return null;
    return Math.round((new Date(dataStr).getTime() - oggiTs) / 86400000);
  };
  const giorniAlProssimoCompleanno = (dataNascita) => {
    if (!dataNascita) return null;
    const nascita = new Date(dataNascita);
    const oggiData = new Date(oggiTs);
    let prossimo = new Date(oggiData.getFullYear(), nascita.getMonth(), nascita.getDate());
    prossimo.setHours(0, 0, 0, 0);
    const oggiSenzaOra = new Date(oggiData.getFullYear(), oggiData.getMonth(), oggiData.getDate());
    if (prossimo < oggiSenzaOra) prossimo = new Date(oggiData.getFullYear() + 1, nascita.getMonth(), nascita.getDate());
    return Math.round((prossimo.getTime() - oggiSenzaOra.getTime()) / 86400000);
  };
  const certificatiInScadenza = settings.notifCertificatiScadenza
    ? certificati.filter((c) => {
        const g = giorniDa(c.dataScadenza);
        return g !== null && g <= settings.notifCertificatiGiorni;
      })
    : [];
  const pacchettiInEsaurimento = settings.notifPacchettiEsauriti
    ? pacchetti.filter((pk) => {
        const fatteDelPacchetto = pk.sedute ? new Set(pk.sedute).size : 0;
        const rimanenti = (pk.numeroSedute || 0) - fatteDelPacchetto;
        // "In scadenza" solo se il pacchetto è già iniziato: uno appena creato non è in scadenza
        return fatteDelPacchetto > 0 && rimanenti > 0 && rimanenti <= settings.notifPacchettiSoglia;
      })
    : [];
  const eventiImminenti = settings.notifEventiImminenti
    ? eventi.filter((ev) => {
        const g = giorniDa(ev.dataInizio);
        return g !== null && g >= 0 && g <= settings.notifEventiGiorni;
      })
    : [];
  const insolutiSegnalati = settings.notifInsoluti ? insolutiList : [];
  const compleanniImminenti = settings.notifCompleanni !== false
    ? portieri
        .map((p) => ({ portiere: p, giorni: giorniAlProssimoCompleanno(p.dataNascita) }))
        .filter((c) => c.giorni !== null && c.giorni <= (settings.notifCompleanniGiorni ?? 7))
        .sort((a, b) => a.giorni - b.giorni)
    : [];
  const hasAvvisi = insolutiList.length > 0 || certificatiInScadenza.length > 0 || pacchettiInEsaurimento.length > 0 || eventiImminenti.length > 0 || compleanniImminenti.length > 0;

  // Stato di ogni portiere per la schermata elenco: pacchetto, ultima seduta, avvisi
  const oggiPortieri = oggiISO();
  const idInsoluti = new Set(insolutiList.map((i) => String(i.portiereId)));
  const idCertScad = new Set(certificatiInScadenza.map((c) => String(c.portiereId)));
  const statoPortieri = {};
  portieri.forEach((p) => {
    const pid = String(p.id);
    const suoiPk = pacchetti
      .filter((pk) => String(pk.portiereId) === pid)
      .map((pk) => ({ pk, fatte: new Set(pk.sedute || []).size }));
    const perData = (a, b) => (b.pk.dataInizio || "").localeCompare(a.pk.dataInizio || "");
    const attivi = suoiPk.filter((x) => x.fatte < (x.pk.numeroSedute || 0)).sort(perData);
    const daRinn = suoiPk.filter((x) => x.pk.numeroSedute && x.fatte >= x.pk.numeroSedute && !x.pk.rinnovato).sort(perData);
    const scelto = attivi[0] || daRinn[0] || null;
    const date = [
      ...entrate.filter((e) => String(e.portiereId) === pid).map((e) => e.data),
      ...suoiPk.flatMap((x) => x.pk.sedute || []),
    ].filter((d) => d && d <= oggiPortieri).sort();
    const ultima = date.length ? date[date.length - 1] : null;
    const giorni = ultima ? Math.floor((new Date(oggiPortieri) - new Date(ultima)) / 86400000) : null;
    statoPortieri[pid] = {
      conPacchetto: attivi.length > 0,
      daRinnovare: attivi.length === 0 && daRinn.length > 0,
      fatte: scelto ? scelto.fatte : 0,
      tot: scelto ? scelto.pk.numeroSedute : 0,
      inChiusura: attivi.length > 0 && attivi[0].pk.numeroSedute - attivi[0].fatte === 1,
      insoluto: idInsoluti.has(pid),
      certScad: idCertScad.has(pid),
      ultima,
      giorni,
      inattivo: giorni === null || giorni > 30,
    };
  });
  const tuttiStati = Object.values(statoPortieri);
  const riepilogoPortieri = {
    totale: portieri.length,
    conPacchetto: tuttiStati.filter((s) => s.conPacchetto).length,
    inChiusura: tuttiStati.filter((s) => s.inChiusura).length,
    inattivi: tuttiStati.filter((s) => s.inattivo).length,
    daRinnovare: tuttiStati.filter((s) => s.daRinnovare).length,
    insoluti: tuttiStati.filter((s) => s.insoluto).length,
    certScad: tuttiStati.filter((s) => s.certScad).length,
  };
  // Scelta rapida dalla striscia: mostra solo i portieri con quella caratteristica.
  const groupedVisibili = filtroRapido
    ? grouped
        .map((g) => ({ ...g, items: g.items.filter((p) => (statoPortieri[String(p.id)] || {})[filtroRapido]) }))
        .filter((g) => g.items.length > 0)
    : grouped;

  const renderRigaPortiere = (p) => {
    const st = statoPortieri[String(p.id)] || {};
    const avc = avatarColor(p.nome);
    const fc = p.frequenza ? FREQ_COLOR[p.frequenza] : null;
    const chips = [];
    if (st.insoluto) chips.push({ t: "Insoluto", fg: coral, bg: coralDim });
    if (st.inChiusura) chips.push({ t: "In chiusura", fg: "#f59e0b", bg: "rgba(245,158,11,0.14)" });
    else if (st.daRinnovare) chips.push({ t: "Da rinnovare", fg: coral, bg: coralDim });
    if (st.certScad) chips.push({ t: "Certificato", fg: "#f59e0b", bg: "rgba(245,158,11,0.14)" });
    if (chips.length === 0) chips.push(st.inattivo ? { t: "Inattivo", fg: textMuted, bg: "rgba(172,169,152,0.14)" } : { t: "Attivo", fg: "#1f9d55", bg: "rgba(31,157,85,0.12)" });
    const perc = st.tot ? Math.min(100, Math.round((st.fatte / st.tot) * 100)) : 0;
    const coloreBarra = st.inChiusura || st.daRinnovare ? "#f59e0b" : "#1f9d55";
    const testoUltima = st.ultima == null ? "nessuna seduta" : st.giorni === 0 ? "oggi" : st.giorni === 1 ? "ieri" : st.giorni <= 60 ? `${st.giorni} giorni fa` : formatData(st.ultima);
    return (
      <button
        key={p.id}
        onClick={() => setView({ page: "dettaglio", id: p.id })}
        style={{ width: "100%", display: "flex", alignItems: "center", flexWrap: "wrap", gap: "8px 12px", padding: "12px 18px", border: "none", borderTop: `1px solid ${border}`, background: surface, textAlign: "left", cursor: "pointer" }}
      >
        <div style={{ width: 34, height: 34, borderRadius: 10, background: avc.bg, color: avc.fg, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 13, flexShrink: 0 }}>
          {initials(p.nome)}
        </div>
        <div style={{ minWidth: 0, flex: "1 1 150px" }}>
          <p style={{ fontSize: 15, color: textPrimary, margin: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.nome}</p>
          <p style={{ fontSize: 13, color: textMuted, margin: "2px 0 0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.squadra || "squadra non indicata"}</p>
        </div>
        <div style={{ flex: "0 0 96px" }}>
          {st.tot ? (
            <>
              <p style={{ margin: 0, fontSize: 13, color: textPrimary, fontWeight: 600 }}>{st.fatte} di {st.tot}</p>
              <div style={{ height: 4, borderRadius: 2, background: surface2, marginTop: 4 }}>
                <div style={{ width: `${perc}%`, height: 4, borderRadius: 2, background: coloreBarra }} />
              </div>
            </>
          ) : (
            <p style={{ margin: 0, fontSize: 12, color: textMuted }}>nessun pacchetto</p>
          )}
        </div>
        <div style={{ flex: "0 0 110px" }}>
          <p style={{ margin: 0, fontSize: 12, color: textMuted }}>ultima: {testoUltima}</p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
          {chips.slice(0, 2).map((c) => (
            <span key={c.t} style={{ fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 100, color: c.fg, background: c.bg }}>{c.t}</span>
          ))}
          {p.frequenza && fc && (
            <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 100, textTransform: "capitalize", color: fc.fg, background: fc.bg }}>{p.frequenza}</span>
          )}
          {p.wa && (
            <span style={{ fontSize: 11, fontWeight: 700, color: whatsapp, background: whatsappDim, padding: "3px 8px", borderRadius: 6 }}>WA</span>
          )}
        </div>
      </button>
    );
  };

  const OverviewCard = ({ icon, label, value, fg, bgc, onClick, masked, style }) => {
    const [revealed, setRevealed] = useState(false);
    const showMasked = masked && !revealed;
    return (
      <button
        onClick={() => (showMasked ? setRevealed(true) : onClick && onClick())}
        style={{
          flex: "1 1 45%",
          minWidth: 140,
          textAlign: "left",
          background: bgc,
          border: `1px solid ${fg}`,
          borderRadius: 12,
          padding: "12px 16px",
          cursor: "pointer",
          ...style,
        }}
      >
        <p style={{ margin: 0, fontSize: 20, fontWeight: 700, color: fg }}>
          {showMasked ? "••••" : value}
        </p>
        <p style={{ margin: "2px 0 0", fontSize: 12, color: fg, fontWeight: 600 }}>{icon} {label}</p>
      </button>
    );
  };

  if (view.page === "recap-giorno") {
    return (
      <div style={{ padding: 20, maxWidth: 600, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Recap di oggi" />
        <div style={{ height: 18 }} />

        <p style={{ fontSize: 13, color: textMuted, marginBottom: 16 }}>
          {formatData(oggiRecap)} — si aggiorna da solo ogni giorno, non serve azzerarlo a mano.
        </p>

        <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
          <div style={{ ...cardStyle, flex: 1, margin: 0, textAlign: "center" }}>
            <p style={{ margin: 0, fontSize: 22, fontWeight: 800, color: "#1f9d55" }}>€{incassatoOggi.toFixed(2)}</p>
            <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted }}>Incassato oggi</p>
          </div>
          <div style={{ ...cardStyle, flex: 1, margin: 0, textAlign: "center" }}>
            <p style={{ margin: 0, fontSize: 22, fontWeight: 800, color: coral }}>€{spesoOggi.toFixed(2)}</p>
            <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted }}>Speso oggi</p>
          </div>
        </div>

        {transazioniOggi.length === 0 ? (
          <p style={{ fontSize: 14, color: textMuted, textAlign: "center", marginTop: 30 }}>Nessun movimento registrato oggi.</p>
        ) : (
          transazioniOggi.map((t, i) => (
            <div key={i} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <p style={{ margin: 0, fontSize: 14, color: textPrimary }}>{t.causale}{t.doppione && <span style={{ marginLeft: 8, fontSize: 12, color: "#f59e0b", fontWeight: 600 }}>⚠️ stessa riga ripetuta: doppione?</span>}</p>
              <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: t.movimento === "spesa" ? coral : "#1f9d55" }}>
                {t.movimento === "spesa" ? "-" : "+"}€{t.importo.toFixed(2)}
              </p>
            </div>
          ))
        )}
      </div>
    );
  }

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Portieri" />

        <div className="no-print" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, margin: "10px 0 16px", flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            {(iscrizioniPending.length > 0 || verifichePending.length > 0 || garePending.length > 0 || richiestePending.some((r) => r.stato === "in_attesa")) && (
              <button
                onClick={() => setView({ page: iscrizioniPending.length > 0 ? "iscrizioni" : verifichePending.length > 0 ? "verifiche" : garePending.length > 0 ? "gare" : "richieste" })}
                style={{
                  display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", fontSize: 12, fontWeight: 700,
                  borderRadius: 100, border: `1px solid ${sky}`, background: skyDim, color: sky, cursor: "pointer",
                }}
              >
                📬 {iscrizioniPending.length + verifichePending.length + garePending.length + richiestePending.filter((r) => r.stato === "in_attesa").length} nuovo/i
              </button>
            )}
            {(() => {
              const giorniDaBackup = settings.ultimoBackup
                ? Math.floor((Date.now() - new Date(settings.ultimoBackup).getTime()) / (1000 * 60 * 60 * 24))
                : null;
              return (
                <button
                  onClick={scaricaBackup}
                  style={{
                    display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", fontSize: 12, fontWeight: 700,
                    borderRadius: 100, border: `1px solid ${border}`, background: surface2, color: textMuted, cursor: "pointer",
                  }}
                >
                  💾 {giorniDaBackup === null ? "Backup mai fatto" : giorniDaBackup === 0 ? "Backup fatto oggi" : `${giorniDaBackup}g fa`}
                </button>
              );
            })()}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button
              onClick={() => updateSettings({ nascondiImportiHome: !settings.nascondiImportiHome })}
              style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", fontSize: 12 }}
            >
              {settings.nascondiImportiHome ? "👁️ Mostra importi" : "🙈 Nascondi importi"}
            </button>
            <ExportMenuCompatto onPrint={handlePrint} onShare={() => handleShare("Portieri", `${portieri.length} portieri in rosa`)} />
          </div>
        </div>

        <div className="no-print" style={{ ...cardStyle, border: `1px solid ${goldSoft}` }}>
          {!showQuickSeduta ? (
            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={() => { setShowQuickSeduta(true); setQuickForm((f) => ({ ...f, importo: f.importo || settings.prezzoDefaultSeduta || "" })); }}
                style={{ ...primaryBtn, flex: 1, minWidth: 0, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "12px 6px", fontSize: 14, textAlign: "center", lineHeight: 1.2 }}
              >
                ⚡ Seduta veloce
              </button>
              <button
                onClick={() => setView({ page: "pacchetti", apriForm: true })}
                style={{ ...primaryBtn, flex: 1, minWidth: 0, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "12px 6px", fontSize: 14, textAlign: "center", lineHeight: 1.2 }}
              >
                📦 Pacchetto veloce
              </button>
            </div>
          ) : (
            <div>
              <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>⚡ Registra seduta veloce</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                <div>
                  <label style={labelStyle}>Portiere</label>
                  <select
                    style={inputStyle}
                    value={quickForm.portiereId}
                    onChange={(e) => setQuickForm((f) => ({ ...f, portiereId: e.target.value }))}
                  >
                    <option value="">Seleziona...</option>
                    {portieri.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map((p) => (
                      <option key={p.id} value={p.id}>{p.nome}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label style={labelStyle}>Importo (€)</label>
                  <input
                    style={inputStyle}
                    type="number"
                    step="0.01"
                    value={quickForm.importo}
                    onChange={(e) => setQuickForm((f) => ({ ...f, importo: e.target.value }))}
                  />
                </div>
                <div>
                  <label style={labelStyle}>Tipo di seduta</label>
                  <select
                    style={inputStyle}
                    value={quickForm.tipoSeduta}
                    onChange={(e) => setQuickForm((f) => ({ ...f, tipoSeduta: e.target.value }))}
                  >
                    {TIPI_SEDUTA.map((t) => (
                      <option key={t} value={t}>{t}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label style={labelStyle}>Data</label>
                  <input
                    style={inputStyle}
                    type="date"
                    value={quickForm.data}
                    onChange={(e) => setQuickForm((f) => ({ ...f, data: e.target.value }))}
                  />
                </div>
                <div>
                  <label style={labelStyle}>Note (facoltativo)</label>
                  <input
                    style={inputStyle}
                    type="text"
                    placeholder="es. seduta individuale"
                    value={quickForm.note}
                    onChange={(e) => setQuickForm((f) => ({ ...f, note: e.target.value }))}
                  />
                </div>
                <div>
                  <label style={labelStyle}>Metodo di pagamento</label>
                  <select
                    style={inputStyle}
                    value={quickForm.metodoPagamento}
                    onChange={(e) => setQuickForm((f) => ({ ...f, metodoPagamento: e.target.value }))}
                  >
                    <option value="">— non specificato —</option>
                    {OPTS.metodoPagamento.map((m) => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>
              </div>
              <label style={{ ...labelStyle, display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: 12 }}>
                <input type="checkbox" checked={quickForm.pagato} onChange={(e) => setQuickForm((f) => ({ ...f, pagato: e.target.checked }))} style={{ width: 16, height: 16, accentColor: "var(--accent-color)" }} />
                Pagata (se disattivi, resta tra gli insoluti)
              </label>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button
                  onClick={registraSedutaVeloce}
                  disabled={!quickForm.portiereId || !quickForm.importo}
                  style={{ ...primaryBtn, opacity: !quickForm.portiereId || !quickForm.importo ? 0.5 : 1, cursor: !quickForm.portiereId || !quickForm.importo ? "not-allowed" : "pointer" }}
                >
                  Registra
                </button>
                <button onClick={() => setShowQuickSeduta(false)} style={ghostBtn}>Chiudi</button>
                {quickJustSaved && <span style={{ fontSize: 13, color: "#1f9d55", fontWeight: 700 }}>✅ Registrata!</span>}
              </div>
            </div>
          )}
        </div>

        <div className="no-print" style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
          {hasAvvisi && (
            <div
              className="no-print"

  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({});

  const disponibili = (inventario || []).filter((i) => i.quantita > 0);
  const totaleVendite = guanti.filter((g) => g.tipo === "vendita").reduce((s, g) => s + (Number(g.importo) || 0), 0);

  const submit = () => {
    if (!form.portiereId || !form.data) return;
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    const art = form.inventarioId ? inventario.find((i) => String(i.id) === String(form.inventarioId)) : null;
    aggiungiGuanto({
      portiereId: form.portiereId,
      nome: portiere ? portiere.nome : "—",
      data: form.data,
      tipo: form.tipo,
      importo: form.tipo === "vendita" ? Number(form.importo) || 0 : 0,
      note: form.note,
      inventarioId: form.inventarioId || null,
      prodottoDettaglio: art ? [art.articolo, art.fornitore, art.modello, art.taglia ? `taglia ${art.taglia}` : ""].filter(Boolean).join(" · ") : null,
    });
    if (art) {
      modificaInventario(art.id, { quantita: Math.max(0, art.quantita - 1) });
    }
    setForm({ portiereId: "", data: "", tipo: "regalo", importo: "", note: "", inventarioId: "" });
    setShowForm(false);
  };

  const startEdit = (g) => {
    setEditId(g.id);
    setEditForm({ data: g.data, tipo: g.tipo, importo: g.importo || "", note: g.note || "" });
  };

  const salvaEdit = (id) => {
    modificaGuanto(id, { data: editForm.data, tipo: editForm.tipo, importo: editForm.tipo === "vendita" ? Number(editForm.importo) || 0 : 0, note: editForm.note });
    setEditId(null);
  };

  const ordinati = [...guanti].sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Materiale" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 0" }}>
          {guanti.length} movimenti · €{totaleVendite.toFixed(2)} da vendite
        </p>

        <div className="no-print" style={{ margin: "16px 0" }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare("Materiale", `${guanti.length} movimenti, €${totaleVendite.toFixed(2)} da vendite`)} />
        </div>

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
          <button onClick={() => setShowForm((v) => !v)} style={{ background: goldDim, color: goldSoft, border: `1px solid ${border}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            + Nuovo movimento
          </button>
        </div>

        {showForm && (
          <div style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuovo movimento guanti</p>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Portiere</label>
              <SelettorePortiere portieri={portieri} value={form.portiereId} onChange={(v) => setForm((f) => ({ ...f, portiereId: v }))} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>
              <div>
                <label style={labelStyle}>Data</label>
                <input style={inputStyle} type="date" value={form.data} onChange={(e) => setForm((f) => ({ ...f, data: e.target.value }))} />
              </div>
              <div>
                <label style={labelStyle}>Tipo</label>
                <select style={inputStyle} value={form.tipo} onChange={(e) => setForm((f) => ({ ...f, tipo: e.target.value }))}>
                  <option value="regalo">Regalo</option>
                  <option value="vendita">Vendita</option>
                </select>
              </div>
            </div>
            {disponibili.length > 0 && (
              <div style={{ marginBottom: 10 }}>
                <label style={labelStyle}>Prodotto dall'inventario (facoltativo)</label>
                <select
                  style={inputStyle}
                  value={form.inventarioId}
                  onChange={(e) => {
                    const id = e.target.value;
                    const art = disponibili.find((i) => String(i.id) === String(id));
                    setForm((f) => ({
                      ...f,
                      inventarioId: id,
                      importo: art && art.prezzo != null && f.tipo === "vendita" ? String(art.prezzo) : f.importo,
                    }));
                  }}
                >
                  <option value="">— nessuno / non tracciato —</option>
                  {disponibili.map((i) => (
                    <option key={i.id} value={i.id}>
                      {[i.articolo, i.fornitore, i.modello, i.taglia ? `taglia ${i.taglia}` : ""].filter(Boolean).join(" · ")} (disp. {i.quantita}{i.prezzo != null ? ` · €${i.prezzo}` : ""})
                    </option>
                  ))}
                </select>
              </div>
            )}
            {form.tipo === "vendita" && (
              <div style={{ marginBottom: 10 }}>
                <label style={labelStyle}>Importo (€)</label>
                <input style={inputStyle} type="number" step="0.01" value={form.importo} onChange={(e) => setForm((f) => ({ ...f, importo: e.target.value }))} />
              </div>
            )}
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Note</label>
              <input style={inputStyle} type="text" value={form.note} placeholder="Modello, taglia..." onChange={(e) => setForm((f) => ({ ...f, note: e.target.value }))} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={submit} disabled={!form.portiereId || !form.data} style={{ ...primaryBtn, flex: 1, opacity: form.portiereId && form.data ? 1 : 0.5, cursor: form.portiereId && form.data ? "pointer" : "not-allowed" }}>
                Salva
              </button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        {ordinati.map((g) => {
          if (editId === g.id) {
            return (
              <div key={g.id} style={{ ...cardStyle, marginBottom: 10, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <input style={{ ...inputStyle, width: 150 }} type="date" value={editForm.data} onChange={(e) => setEditForm((f) => ({ ...f, data: e.target.value }))} />
                <select style={{ ...inputStyle, width: 130 }} value={editForm.tipo} onChange={(e) => setEditForm((f) => ({ ...f, tipo: e.target.value }))}>
                  <option value="regalo">Regalo</option>
                  <option value="vendita">Vendita</option>
                </select>
                {editForm.tipo === "vendita" && (
                  <input style={{ ...inputStyle, width: 100 }} type="number" step="0.01" value={editForm.importo} onChange={(e) => setEditForm((f) => ({ ...f, importo: e.target.value }))} />

                <button onClick={() => setEditId(null)} style={ghostBtn}>Annulla</button>
              </div>
            );
          }
          return (
            <div key={g.id} style={{ ...cardStyle, marginBottom: 10, display: "flex", alignItems: "center", gap: 12, justifyContent: "space-between" }}>
              <div style={{ minWidth: 0, flex: 1 }}>
                <p style={{ margin: 0, fontSize: 14, color: textPrimary, fontWeight: 600 }}>
                  {g.prodottoDettaglio || g.nome}

                <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted }}>
                  {g.prodottoDettaglio ? `${g.nome} · ` : ""}{formatData(g.data)}
                  {g.tipo === "vendita" ? ` · €${Number(g.importo).toFixed(2)}` : ""}
                  {g.note ? ` · ${g.note}` : ""}
                </p>
              </div>
              <span style={{
                fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 100, textTransform: "capitalize", flexShrink: 0,

                background: g.tipo === "vendita" ? goldDim : whatsappDim,
              }}>
                {g.tipo}
              </span>
              <button onClick={() => startEdit(g)} style={{ background: "none", border: "none", color: textMuted, fontSize: 14, cursor: "pointer", flexShrink: 0 }}>✎</button>
              <button onClick={() => rimuoviGuanto(g.id)} style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer", flexShrink: 0 }}>×</button>
            </div>
          );
        })}
        {ordinati.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 15, padding: "40px 0" }}>Nessun movimento registrato.</p>}

        <div style={{ fontSize: 12, color: textSecondary, height: 18, marginTop: 8 }}>
          {saveState === "saving" && "Salvataggio..."}
          {saveState === "saved" && "Salvato"}
          {saveState === "error" && <span style={{ color: coral, fontWeight: 700 }}>⚠️ Non salvato, controlla la connessione e riprova</span>}
        </div>
      </div>
    </div>
  );
}
