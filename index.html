function initials(nome) {
  const pulito = (nome || "").trim();
  if (!pulito) return "?";
  const parts = pulito.split(" ").filter(Boolean);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function cap(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function formatData(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (DATE_FORMAT_PREF === "mm/gg/aaaa") return `${m}/${d}/${y}`;
  if (DATE_FORMAT_PREF === "aaaa-mm-gg") return `${y}-${m}-${d}`;
  return `${d}/${m}/${y}`;
}

// collidono mai tra una sessione e l'altra (il vecchio contatore ripartiva da -1 a ogni apertura
// dell'app, causando ID duplicati tra elementi creati in giorni diversi) né tra elementi creati
// nello stesso istante (es. importazione massiva da Excel).
let idProgressivo = 0;
function generaId() {
  idProgressivo += 1;
  return -(Date.now() * 100000 + (idProgressivo % 100000));
}

function applyTema(modo) {
  const risolto = modo === "sistema" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "chiaro" : "scuro") : modo;
  const t = THEMES[risolto] || THEMES.scuro;
  const root = document.documentElement;
  Object.keys(t).forEach((k) => {
    if (k !== "htmlBg") root.style.setProperty(k, t[k]);
  });
  root.style.backgroundColor = t.htmlBg;
  if (risolto === "chiaro") {
    root.style.backgroundImage = "none";
  } else {
    root.style.backgroundImage = "";
  }
}

const MESI = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

function meseLabel(key) {
  if (key === "n.d.") return "Data non indicata";
  const [y, m] = key.split("-");
  return `${MESI[Number(m) - 1]} ${y}`;
}

// Ricava gli incassi (vendite materiale + pacchetti) come voci singole con data e importo
function ricavaIncassi(guanti, pacchetti, entrate, eventi) {
  const vendite = guanti
    .filter((g) => g.tipo === "vendita")
    .map((g) => ({ data: g.data, importo: Number(g.importo) || 0, fonte: "Materiale", dettaglio: g.nome, sourceType: "materiale", sourceId: g.id, note: g.note }));
  const daPacchetti = pacchetti
    .filter((pk) => pk.importoTotale && eDavveroPagato(pk.pagato))
    .map((pk) => ({ data: pk.dataPagamento || pk.dataInizio, importo: Number(pk.importoTotale) || 0, fonte: "Pacchetto", dettaglio: pk.nome, sourceType: "pacchetto", sourceId: pk.id, metodoPagamento: pk.metodoPagamento, portiereId: pk.portiereId }));
  const manuali = (entrate || [])
    .filter((e) => eDavveroPagato(e.pagato))
    .map((e) => ({ data: e.data, importo: Number(e.importo) || 0, fonte: e.fonte || "Manuale", dettaglio: e.note || "voce importata", sourceType: "manuale", sourceId: e.id, note: e.note, portiereId: e.portiereId, metodoPagamento: e.metodoPagamento }));
  const daEventi = (eventi || [])
    .filter((ev) => ev.incassoReale)
    .map((ev) => ({ data: ev.dataInizio, importo: Number(ev.incassoReale) || 0, fonte: "Evento", dettaglio: ev.titolo, sourceType: "evento-incasso", sourceId: ev.id }));
  return [...vendite, ...daPacchetti, ...manuali, ...daEventi];
}

// Pacchetti e sedute registrati ma NON ancora pagati: non contano nel bilancio finché non vengono saldati.
// Riconosce lo stato "non pagato" in modo tollerante: sia il booleano false, sia eventuali
// varianti come la stringa "false" (può capitare a seconda di come il dato è transitato).
function eNonPagato(v) {
  return v === false || v === "false";
}
// Ridimensiona e comprime un'immagine caricata dall'utente (es. il logo), così resta leggera
// da salvare e caricare, indipendentemente da quanto è grande la foto originale.
function ridimensionaImmagine(file, maxLato) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Impossibile leggere il file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Impossibile leggere l'immagine"));
      img.onload = () => {
        const scala = Math.min(1, maxLato / Math.max(img.width, img.height));
        const w = Math.round(img.width * scala);
        const h = Math.round(img.height * scala);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Prova a indovinare a quale portiere si riferisce un testo libero (es. la nota di una vecchia
// entrata), cercando se una parola del suo nome compare nel testo. Se trova più di un candidato
// possibile, non si sbilancia e non suggerisce nulla (meglio niente che un suggerimento sbagliato).
function suggerisciPortiere(testo, portieri) {
  if (!testo) return null;
  const testoLower = testo.toLowerCase();
  const candidati = portieri.filter((p) => {
    const parole = (p.nome || "").toLowerCase().split(/\s+/).filter((w) => w.length > 2);
    return parole.some((w) => testoLower.includes(w));
  });
  return candidati.length === 1 ? candidati[0] : null;
}

function eDavveroPagato(v) {
  return !eNonPagato(v);
}

function ricavaInsoluti(pacchetti, entrate, portieri) {
  const nomePortiere = (id) => {
    const p = portieri.find((pp) => String(pp.id) === String(id));
    return p ? p.nome : "—";
  };
  const daPacchetti = (pacchetti || [])
    .filter((pk) => pk.importoTotale && eNonPagato(pk.pagato))
    .map((pk) => ({ tipo: "pacchetto", id: pk.id, portiereId: pk.portiereId, nome: nomePortiere(pk.portiereId), importo: Number(pk.importoTotale) || 0, data: pk.dataScadenzaSaldo || pk.dataInizio, dettaglio: `Pacchetto da ${pk.numeroSedute} sedute` }));
  const daSedute = (entrate || [])
    .filter((e) => eNonPagato(e.pagato))
    .map((e) => ({ tipo: "seduta", id: e.id, portiereId: e.portiereId, nome: nomePortiere(e.portiereId), importo: Number(e.importo) || 0, data: e.data, dettaglio: e.note || "Seduta singola" }));
  return [...daPacchetti, ...daSedute].sort((a, b) => (a.data || "").localeCompare(b.data || ""));
}

function raggruppaPerMese(voci, campoImporto) {
  const byMonth = {};
  for (const v of voci) {
    const key = v.data ? v.data.slice(0, 7) : "n.d.";
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(v);
  }
  const keys = Object.keys(byMonth).sort((a, b) => b.localeCompare(a));
  return keys.map((k) => ({
    key: k,
    label: meseLabel(k),
    items: byMonth[k].slice().sort((a, b) => (b.data || "").localeCompare(a.data || "")),
    totale: byMonth[k].reduce((s, v) => s + (Number(v[campoImporto || "importo"]) || 0), 0),
  }));
}

// Incassi del mese e dell'anno correnti, calcolati dal vivo da materiale + pacchetti + entrate manuali
function calcolaIncassiMeseAnno(guanti, pacchetti, entrate, eventi) {
  const oggi = new Date().toISOString();
  const meseKey = oggi.slice(0, 7);
  const annoKey = oggi.slice(0, 4);
  const voci = ricavaIncassi(guanti, pacchetti, entrate, eventi);
  const mese = voci.filter((v) => v.data && v.data.slice(0, 7) === meseKey).reduce((s, v) => s + v.importo, 0);
  const anno = voci.filter((v) => v.data && v.data.slice(0, 4) === annoKey).reduce((s, v) => s + v.importo, 0);
  return { mese, anno, etichettaMese: MESI[Number(meseKey.slice(5, 7)) - 1], annoKey };
}

function IncassiMonitor({ guanti, pacchetti, entrate, eventi, masked, onNavigate }) {
  const { mese, anno, etichettaMese, annoKey } = useMemo(
    () => calcolaIncassiMeseAnno(guanti, pacchetti, entrate, eventi),
    [guanti, pacchetti, entrate, eventi]
  );
  const [revealed, setRevealed] = useState(false);
  const showMasked = masked && !revealed;
  const handleClick = () => {
    if (showMasked) { setRevealed(true); return; }
    if (onNavigate) onNavigate();
  };
  return (
    <>
      <button
        onClick={handleClick}
        style={{ flex: "1 1 45%", minWidth: 140, textAlign: "left", cursor: "pointer", background: "rgba(31,157,85,0.12)", border: "1px solid #1f9d55", borderRadius: 12, padding: "12px 16px" }}
      >
        <p style={{ margin: 0, fontSize: 20, fontWeight: 700, color: "#1f9d55" }}>{showMasked ? "••••" : `€${mese.toFixed(2)}`}</p>
        <p style={{ margin: "2px 0 0", fontSize: 12, color: "#1f9d55", fontWeight: 600 }}>Incassi di {etichettaMese}</p>

      <button

      >

        <p style={{ margin: "2px 0 0", fontSize: 12, color: "#1f9d55", fontWeight: 600 }}>Incassi anno {annoKey}</p>
      </button>
    </>
  );
}

function ModuloVerificaPeriodica() {

  const [stato, setStato] = useState("idle");
  const [errore, setErrore] = useState("");

  const campo = (key, patch) => setForm((f) => ({ ...f, ...patch }));

  const invia = async (e) => {
    e.preventDefault();
    if (!form.nome || !form.cognome) return;
    setStato("inviando");
    setErrore("");
    try {
      const res = await fetch(`${DEFAULT_SUPABASE_CONFIG.project_url}/rest/v1/verifiche_periodiche_pending`, {
        method: "POST",
        headers: {
          apikey: DEFAULT_SUPABASE_CONFIG.anon_key,
          Authorization: `Bearer ${DEFAULT_SUPABASE_CONFIG.anon_key}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal",

          nome: form.nome, cognome: form.cognome,
          altezza: form.altezza ? Number(form.altezza) : null,
          peso: form.peso ? Number(form.peso) : null,

  const [verifichePending, setVerifichePending] = useState([]);

  const [verificaPortiereScelto, setVerificaPortiereScelto] = useState({}); // { [id]: portiereId } selezione in corso
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [showQuickSeduta, setShowQuickSeduta] = useState(false);
  const [quickForm, setQuickForm] = useState({ portiereId: "", importo: "", data: new Date().toISOString().slice(0, 10), note: "", metodoPagamento: "", pagato: true });
  const [quickJustSaved, setQuickJustSaved] = useState(false);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const confirmAction = (message, onConfirm) => {
    if (!settings.confirmBeforeDelete) {
      onConfirm();
      return;
    }
    setConfirmDialog({ message, onConfirm });
  };
  const insolutiList = (portieri && pacchetti && entrate) ? ricavaInsoluti(pacchetti, entrate, portieri) : [];
  const insolutiTotale = insolutiList.reduce((s, i) => s + i.importo, 0);
  const [showPagamentoForm, setShowPagamentoForm] = useState(false);
  const [pagamentoJustSaved, setPagamentoJustSaved] = useState(false);
  const [pagamentoForm, setPagamentoForm] = useState({ data: new Date().toISOString().slice(0, 10), importo: "", note: "", metodoPagamento: "", pagato: true });
  const printRef = useRef(null);

  const SUPABASE_TABLE = "gestionale_kv";

  // Fetch con timeout: se la rete non risponde entro il tempo indicato, l'app smette di
  // aspettare invece di restare bloccata per sempre (può succedere in Safari su iPhone
  // quando il file è aperto localmente).
  const fetchConTimeout = async (url, options, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs || 8000);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  };

  const authHeaders = (cfg, token) => ({
    apikey: cfg.anon_key,
    Authorization: `Bearer ${token || cfg.anon_key}`,
  });

  const supabaseSelect = async (cfg, key, token) => {
    const url = `${cfg.project_url}/rest/v1/${SUPABASE_TABLE}?key=eq.${encodeURIComponent(key)}&select=value`;
    const res = await fetchConTimeout(url, { headers: authHeaders(cfg, token) });
    if (!res.ok) throw new Error("Supabase select " + res.status);
    return res.json();
  };

  const supabaseUpsert = async (cfg, key, value, token) => {
    const url = `${cfg.project_url}/rest/v1/${SUPABASE_TABLE}`;
    const res = await fetchConTimeout(url, {
      method: "POST",
      headers: {
        ...authHeaders(cfg, token),
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal",
      },
      body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }]),
    });
    if (!res.ok) throw new Error("Supabase upsert " + res.status);
  };

  // --- Iscrizioni pubbliche in attesa di revisione ---

  const caricaIscrizioniPending = async (cfg, token) => {
    const url = `${cfg.project_url}/rest/v1/iscrizioni_pending?stato=eq.in_attesa&order=creato_il.desc`;
    const res = await fetchConTimeout(url, { headers: authHeaders(cfg, token) });
    if (!res.ok) throw new Error("Lettura iscrizioni " + res.status);
    return res.json();
  };

  const aggiornaStatoIscrizione = async (cfg, token, id, stato) => {
    const url = `${cfg.project_url}/rest/v1/iscrizioni_pending?id=eq.${id}`;
    const res = await fetchConTimeout(url, {
      method: "PATCH",
      headers: { ...authHeaders(cfg, token), "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ stato }),
    });
    if (!res.ok) throw new Error("Aggiornamento iscrizione " + res.status);
  };

  const caricaVerifichePending = async (cfg, token) => {
    const url = `${cfg.project_url}/rest/v1/verifiche_periodiche_pending?stato=eq.in_attesa&order=creato_il.desc`;
    const res = await fetchConTimeout(url, { headers: authHeaders(cfg, token) });
    if (!res.ok) throw new Error("Lettura verifiche " + res.status);
    return res.json();
  };

  const aggiornaStatoVerifica = async (cfg, token, id, stato) => {
    const url = `${cfg.project_url}/rest/v1/verifiche_periodiche_pending?id=eq.${id}`;
    const res = await fetchConTimeout(url, {
      method: "PATCH",
      headers: { ...authHeaders(cfg, token), "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ stato }),
    });
    if (!res.ok) throw new Error("Aggiornamento verifica " + res.status);
  };

  // --- Autenticazione (Supabase Auth: email + password) ---

  const supabaseSignUp = async (cfg, email, password) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/signup`, {
      method: "POST",
      headers: { apikey: cfg.anon_key, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || data.error || "Registrazione fallita");
    return data;
  };

  const supabaseSignIn = async (cfg, email, password) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: cfg.anon_key, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || data.error || "Accesso fallito");
    return data;
  };

  const supabaseRefresh = async (cfg, refresh_token) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: cfg.anon_key, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || data.error || "Sessione scaduta");
    return data;
  };

  // --- Verifica in due passaggi (MFA/TOTP) ---
  const mfaListFactors = async (cfg, token) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/user`, {
      headers: { apikey: cfg.anon_key, Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Errore lettura fattori");
    return data.factors || [];
  };
  const mfaEnroll = async (cfg, token) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/factors`, {
      method: "POST",
      headers: { apikey: cfg.anon_key, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ friendly_name: `mb-academy-mfa-${Date.now()}`, factor_type: "totp" }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Impossibile avviare l'attivazione");
    return data; // { id, totp: { qr_code, secret, uri } }
  };
  const mfaChallenge = async (cfg, token, factorId) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/factors/${factorId}/challenge`, {
      method: "POST",
      headers: { apikey: cfg.anon_key, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Errore richiesta codice");
    return data; // { id: challengeId }
  };
  const mfaVerify = async (cfg, token, factorId, challengeId, code) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/factors/${factorId}/verify`, {
      method: "POST",
      headers: { apikey: cfg.anon_key, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ challenge_id: challengeId, code }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Codice non valido");
    return data;

  // Salvataggio della sessione di login: usa lo storage di Claude quando disponibile (dentro
  // l'artifact), altrimenti localStorage (quando l'app gira da sola, es. su Netlify) — così il
  // login resta affidabile e prevedibile ovunque venga aperta l'app.
  const sessionStorageSet = async (value) => {
    try {
      await window.storage.set(SESSION_KEY, value, false);
      return;
    } catch (e) {}
    try { localStorage.setItem(SESSION_KEY, value); } catch (e2) {}
  };
  const sessionStorageGet = async () => {
    try {
      const res = await window.storage.get(SESSION_KEY, false);
      if (res && res.value) return res.value;
    } catch (e) {}
    try { return localStorage.getItem(SESSION_KEY); } catch (e2) { return null; }
  };
  const sessionStorageDelete = async () => {
    try {
      await window.storage.delete(SESSION_KEY, false);
    } catch (e) {}
    try { localStorage.removeItem(SESSION_KEY); } catch (e2) {}
  };

  const persistSession = async (data, email) => {
    const sess = { access_token: data.access_token, refresh_token: data.refresh_token, email: email || (data.user && data.user.email) };

    setSession(sess);
    return sess;

  const doSignUp = async (cfg, emailOverride, passwordOverride) => {

        await persistSession(data, email);

      } else {
        setAuthError("Account creato, ma manca la conferma via email. Prova a fare login qui sotto tra qualche istante, oppure controlla la posta.");
        setAuthScreen("login");

  const doLogout = async () => {

  // Lettura di una chiave: se Supabase è configurato prova lì (database vero, indipendente da
  // questa chat). Riprova fino a 3 volte in caso di problemi di rete temporanei (es. il database
  // che si sta "risvegliando" dopo una pausa). Se fallisce anche dopo i tentativi, NON sostituisce
  // mai i dati veri con quelli vecchi/di partenza — solleva un errore, così chi chiama sa che la
  // lettura non è andata a buon fine e può decidere di non toccare i dati esistenti, invece di
  // mostrarne di sbagliati come se fossero corretti.
  const readKey = async (key, fallback, cfg, token, opzioni) => {
    const permettiFallback = opzioni && opzioni.permettiFallback;
    if (cfg) {
      let ultimoErrore = null;
      for (let tentativo = 0; tentativo < 3; tentativo++) {
        try {
          const rows = await supabaseSelect(cfg, key, token);
          if (rows && rows.length > 0) return rows[0].value;
          ultimoErrore = null;
          break; // nessuna riga: è un dato genuinamente mai creato, non un errore di rete
        } catch (e) {
          ultimoErrore = e;
          if (tentativo < 2) await new Promise((r) => setTimeout(r, 900 * (tentativo + 1)));
        }
      }
      if (ultimoErrore && !permettiFallback) {
        throw ultimoErrore;
      }
    }
    try {
      const res = await window.storage.get(key, true);
      if (res && res.value != null) return JSON.parse(res.value);
    } catch (e) {}
    const migratedRaw = MIGRATION_DATA[key];
    if (migratedRaw != null) {
      try { return JSON.parse(migratedRaw); } catch (e2) { return fallback; }
    }
    return fallback;
  };

  // Fonde in modo sicuro il valore che sto per salvare con quello effettivamente presente sul
  // server in quel momento: se è un elenco di elementi con un id (tutte le nostre collezioni:
  // portieri, spese, sedute, pacchetti, ecc.), ed esiste sul server un elemento che questo
  // dispositivo non conosce (aggiunto da un altro dispositivo nel frattempo), lo tengo invece
  // di perderlo. Evita che un dispositivo con dati "vecchi" cancelli per sbaglio aggiunte più
  // recenti fatte altrove.
  const fondiConServer = async (key, value, cfg, token) => {
    if (!Array.isArray(value) || !value.every((x) => x && typeof x === "object" && "id" in x)) {
      return value;
    }
    try {
      const rows = await supabaseSelect(cfg, key, token);
      if (rows && rows.length > 0 && Array.isArray(rows[0].value)) {
        const serverArray = rows[0].value;
        const idLocali = new Set(value.map((x) => String(x.id)));
        const soloSulServer = serverArray.filter((x) => x && x.id != null && !idLocali.has(String(x.id)));
        if (soloSulServer.length > 0) {
          console.warn(`Recuperati ${soloSulServer.length} elemento/i presenti sul server ma non su questo dispositivo (chiave: ${key}) — uniti invece di essere sovrascritti.`);
          return [...value, ...soloSulServer];
        }
      }
    } catch (e) {
      // Se la rilettura fallisce, procedo comunque con il valore originale piuttosto che bloccare il salvataggio.
    }
    return value;
  };

  const writeKey = async (key, value, cfg, token, opzioni) => {
    const saltaFusione = opzioni && opzioni.saltaFusione;
    if (cfg) {
      const valoreDaSalvare = saltaFusione ? value : await fondiConServer(key, value, cfg, token);
      try {
        await supabaseUpsert(cfg, key, valoreDaSalvare, token);
        return valoreDaSalvare;
      } catch (e) {
        // Se il salvataggio fallisce e siamo loggati, potrebbe essere un token scaduto:
        // provo a rinnovarlo e a ritentare una volta prima di arrendermi.
        if (cfg.auth_enabled && session && session.refresh_token) {
          try {
            const fresh = await supabaseRefresh(cfg, session.refresh_token);
            const sess = await persistSession(fresh, session.email);
            await supabaseUpsert(cfg, key, valoreDaSalvare, sess.access_token);
            return valoreDaSalvare;
          } catch (e2) {
            // Fallito anche il tentativo con token rinnovato: proseguo con il fallback sotto,
            // ma segnalo l'errore per davvero invece di nasconderlo.
            try { localStorage.setItem(key, JSON.stringify(valoreDaSalvare)); } catch (e3) {}
            throw e2;
          }
        }
        try { localStorage.setItem(key, JSON.stringify(valoreDaSalvare)); } catch (e3) {}
        throw e;
      }
    }
    try {
      await window.storage.set(key, JSON.stringify(value), true);
      return value;
    } catch (e) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e2) {}
      throw e;
    }
  };

  const caricaDati = async (cfg, token) => {
    const [
      portieriData, guantiData, pacchettiData, speseData, entrateData, eventiData,
      certificatiData, sponsorCommData, sponsorTechData, inventarioData, noteVelociData, documentiData, settingsData,
    ] = await Promise.all([
      readKey(PORTIERI_KEY, SEED, cfg, token),
      readKey(GUANTI_KEY, [], cfg, token),
      readKey(PACCHETTI_KEY, [], cfg, token),
      readKey(SPESE_KEY, [], cfg, token),
      readKey(ENTRATE_KEY, [], cfg, token),
      readKey(EVENTI_KEY, [], cfg, token),
      readKey(CERTIFICATI_KEY, [], cfg, token),
      readKey(SPONSOR_COMM_KEY, [], cfg, token),
      readKey(SPONSOR_TECH_KEY, [], cfg, token),
      readKey(INVENTARIO_KEY, [], cfg, token),
      readKey(NOTE_VELOCI_KEY, [], cfg, token),
      readKey(DOCUMENTI_KEY, [], cfg, token),
      readKey(SETTINGS_KEY, DEFAULT_SETTINGS, cfg, token),
    ]);
    return { portieriData, guantiData, pacchettiData, speseData, entrateData, eventiData, certificatiData, sponsorCommData, sponsorTechData, inventarioData, noteVelociData, documentiData, settingsData };
  };

  useEffect(() => {
    let cancelled = false;
    let finito = false;

    // Rete di sicurezza: se il caricamento dati dovesse restare bloccato più del ragionevole
    // (es. richieste di rete che su alcune versioni di Safari iOS non rispondono al comando di
    // interruzione), dopo 45 secondi mostro un errore chiaro con un pulsante "Riprova" — MAI PIÙ
    // popolo l'app con dati vecchi/di partenza in silenzio: è esattamente quello che ha causato
    // le perdite di dati di oggi.
    const watchdog = setTimeout(() => {
      if (finito || cancelled) return;
      finito = true;
      console.warn("Caricamento dati troppo lento.");
      setLoadError("Il caricamento sta impiegando troppo tempo. Controlla la connessione e riprova.");
      setLoading(false);
    }, 45000);

    (async () => {
      let cfg = DEFAULT_SUPABASE_CONFIG;
      try {
        const res = await window.storage.get(SUPABASE_CONFIG_KEY, true);
        if (res && res.value) cfg = JSON.parse(res.value);
      } catch (e) {
        // window.storage non disponibile (es. file aperto fuori da Claude, sul Desktop):
        // resto sulla configurazione di default definita sopra.
      }
      if (!cancelled) setDbConfig(cfg);

      let token = null;
      if (cfg && cfg.auth_enabled) {
        // Login obbligatorio: provo a recuperare/rinnovare la sessione salvata su questo dispositivo
        let stored = null;
        try {
          const raw = await sessionStorageGet();
          if (raw) stored = JSON.parse(raw);
        } catch (e) {
          stored = null;
        }
        if (stored && stored.refresh_token) {
          try {
            const fresh = await supabaseRefresh(cfg, stored.refresh_token);
            const sess = await persistSession(fresh, stored.email);
            token = sess.access_token;
          } catch (e) {
            stored = null;
          }
        }
        if (!token) {
          if (!cancelled && !finito) {
            finito = true;
            clearTimeout(watchdog);
            setAuthScreen("login");
            setLoading(false);
          }
          return;
        }
      }

      // Al primissimo avvio in assoluto (nessun dato mai caricato prima in questa sessione), se
      // la lettura fallisce va bene usare i dati di partenza — non c'è nient'altro da mostrare.
      // Ma se stiamo già mostrando dati veri (un ricaricamento), un fallimento non deve MAI
      // sostituirli silenziosamente: meglio un errore chiaro che dati sbagliati che sembrano giusti.
      let d;
      try {
        d = await caricaDati(cfg, token);
      } catch (e) {
        if (!cancelled && !finito) {
          finito = true;
          clearTimeout(watchdog);
          console.error("Caricamento dati fallito:", e);
          setLoadError("Impossibile caricare i dati (problema di connessione con il database). I dati esistenti NON sono stati toccati. Controlla la connessione e riprova.");
          setLoading(false);
        }
        return;
      }

      if (cancelled || finito) return;
      finito = true;
      clearTimeout(watchdog);
      setLoadError(null);
      setPortieri(d.portieriData);
      setGuanti(d.guantiData);
      setPacchetti(d.pacchettiData);
      setSpese(d.speseData);
      setEntrate(d.entrateData);
      setEventi(d.eventiData);
      setCertificati(d.certificatiData);
      setSponsorComm(d.sponsorCommData);
      setSponsorTech(d.sponsorTechData);
      setInventario(d.inventarioData);
      setNoteVeloci(d.noteVelociData);
      setDocumenti(d.documentiData);
      const mergedSettings = { ...DEFAULT_SETTINGS, ...d.settingsData };
      setSettings(mergedSettings);
      if (mergedSettings.defaultPage && mergedSettings.defaultPage !== "lista") {
        setView({ page: mergedSettings.defaultPage });
      }
      setLoading(false);
    })();

    return () => { cancelled = true; clearTimeout(watchdog); };
  }, [tentativoCaricamento]);

  const [refreshing, setRefreshing] = useState(false);
  const aggiornaDati = async () => {
    if (refreshing) return;
    setRefreshing(true);
    try {
      const token = session && session.access_token;
      const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Aggiornamento troppo lento")), 25000));
      const d = await Promise.race([caricaDati(dbConfig, token), timeoutPromise]);
      setPortieri(d.portieriData);
      setGuanti(d.guantiData);
      setPacchetti(d.pacchettiData);
      setSpese(d.speseData);

    } catch (e) {

  // Se l'app resta in background (schermo bloccato, altra app aperta, scheda nascosta) per più
  // di 2 minuti e poi torna visibile, aggiorno automaticamente i dati prima che l'utente possa

  useEffect(() => {

      sponsorComm, sponsorTech, inventario, noteVeloci, documenti, settings,

    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dataOggi = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `backup-gestionale-${dataOggi}.json`;

  const persist = (key, value, setter, opzioni) => {
    setter(value);
    setSaveState("saving");
    writeKey(key, value, dbConfig, session && session.access_token, opzioni)
      .then((valoreEffettivo) => {
        // Se durante il salvataggio sono stati recuperati elementi presenti sul server ma non
        // qui (aggiunti da un altro dispositivo), aggiorno la vista per mostrarli davvero.
        if (Array.isArray(valoreEffettivo) && valoreEffettivo.length !== value.length) {
          setter(valoreEffettivo);
        }
        setSaveState("saved");
        setTimeout(() => setSaveState((s) => (s === "saved" ? "idle" : s)), 1500);
      })
      .catch(() => {
        setSaveState("error");
        setTimeout(() => setSaveState((s) => (s === "error" ? "idle" : s)), 8000);
      });
  };

  const enableAuth = async () => {
    setAuthSetupStatus("running");

    try {
      const prompt =
        `Ho un progetto Supabase con project_url ${dbConfig.project_url}. Fai quanto segue:\n` +
        "1. Nelle impostazioni di Auth del progetto, disabilita la richiesta di conferma email per il signup (\"Confirm email\" OFF / mailer_autoconfirm attivo), così un utente può accedere subito dopo essersi registrato.\n" +

  }

  if (view.page === "estratto-conto") {
    const tuttiIMetodi = OPTS.metodoPagamento;

    const venditePortieri = guanti
      .filter((g) => g.tipo === "vendita")
      .map((g) => {
        const pp = portieri.find((x) => String(x.id) === String(g.portiereId));
        return { data: g.data, importo: Number(g.importo) || 0, causale: `Materiale${pp ? " — " + pp.nome : ""}`, metodoPagamento: g.metodoPagamento || null, movimento: "incasso" };
      });
    const entrateManuali = entrate.map((e) => {
      const pp = e.portiereId != null ? portieri.find((x) => String(x.id) === String(e.portiereId)) : null;
      return { data: e.data, importo: Number(e.importo) || 0, causale: `${e.fonte || "Seduta"}${pp ? " — " + pp.nome : ""}${e.note ? " · " + e.note : ""}`, metodoPagamento: e.metodoPagamento || null, movimento: "incasso" };
    });
    const incassiPacchetti = pacchetti
      .filter((pk) => pk.importoTotale && eDavveroPagato(pk.pagato) && pk.dataPagamento)
      .map((pk) => ({ data: pk.dataPagamento, importo: Number(pk.importoTotale) || 0, causale: `Pacchetto — ${pk.nome}`, metodoPagamento: pk.metodoPagamento || null, movimento: "incasso" }));
    const uscite = spese.map((s) => ({ data: s.data, importo: Number(s.importo) || 0, causale: `${cap(s.categoria || "Spesa")}${s.note ? " · " + s.note : ""}`, metodoPagamento: s.metodoPagamento || null, movimento: "spesa" }));

    let movimenti = [...venditePortieri, ...entrateManuali, ...incassiPacchetti, ...uscite];

    if (estrattoDataDa) movimenti = movimenti.filter((m) => m.data >= estrattoDataDa);
    if (estrattoDataA) movimenti = movimenti.filter((m) => m.data <= estrattoDataA);
    if (estrattoMetodi.size > 0) movimenti = movimenti.filter((m) => m.metodoPagamento && estrattoMetodi.has(m.metodoPagamento));
    if (estrattoTipo !== "tutti") movimenti = movimenti.filter((m) => m.movimento === (estrattoTipo === "incassi" ? "incasso" : "spesa"));

    movimenti.sort((a, b) => a.data.localeCompare(b.data));

    const totaleIncassi = movimenti.filter((m) => m.movimento === "incasso").reduce((s, m) => s + m.importo, 0);
    const totaleSpese = movimenti.filter((m) => m.movimento === "spesa").reduce((s, m) => s + m.importo, 0);

    return (
      <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
        {printStyle}
        <Menu />

          <TopBar title="Estratto conto" />
        </div>

        <div className="no-print" style={{ maxWidth: 800, margin: "16px auto 10px", padding: "0 40px" }}>
          <div style={cardStyle}>
            <p style={{ ...sectionLabelStyle, marginBottom: 10 }}>Filtri</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>

          <div style={{ fontSize: 12, color: textMuted, marginBottom: 12 }}>
            Scarica una copia completa di tutti i dati (portieri, pacchetti, spese, sedute, eventi,
            certificati, sponsor, inventario) in un file sul tuo Mac/telefono. Indipendente da
            Supabase, Netlify o Claude — tienilo come "assicurazione" extra, magari anche su iCloud
            o Google Drive. Consigliato farlo ogni tanto, specialmente dopo aver inserito molti dati nuovi.
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button
              onClick={scaricaBackup}
              style={{ ...primaryBtn, flex: "1 1 200px" }}
            >
              ⬇️ Scarica backup completo
            </button>
            <button
              onClick={() => backupFileInputRef.current && backupFileInputRef.current.click()}
              style={{ ...ghostBtn, flex: "1 1 200px" }}
            >
              📤 Ripristina da un backup
            </button>
            <input
              ref={backupFileInputRef}
              type="file"
              accept=".json,application/json"
              style={{ display: "none" }}
              onChange={(e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  try {
                    const dati = JSON.parse(reader.result);
                    if (!dati || dati.versione !== 1) {
                      window.alert("File non riconosciuto: non sembra un backup valido di questo gestionale.");
                      return;
                    }
                    const riepilogo = [
                      dati.portieri ? `${dati.portieri.length} portieri` : null,
                      dati.pacchetti ? `${dati.pacchetti.length} pacchetti` : null,
                      dati.spese ? `${dati.spese.length} spese` : null,
                      dati.entrate ? `${dati.entrate.length} sedute/entrate` : null,
                    ].filter(Boolean).join(", ");
                    confirmAction(
                      `Ripristinare questo backup (del ${dati.esportatoIl ? formatData(dati.esportatoIl.slice(0, 10)) : "—"}, con ${riepilogo})? SOSTITUIRÀ TUTTI i dati attuali con quelli del backup. Non si può annullare.`,
                      () => {
                        const opz = { saltaFusione: true };
                        if (dati.portieri) persist(PORTIERI_KEY, dati.portieri, setPortieri, opz);
                        if (dati.guanti) persist(GUANTI_KEY, dati.guanti, setGuanti, opz);
                        if (dati.pacchetti) persist(PACCHETTI_KEY, dati.pacchetti, setPacchetti, opz);
                        if (dati.spese) persist(SPESE_KEY, dati.spese, setSpese, opz);
                        if (dati.entrate) persist(ENTRATE_KEY, dati.entrate, setEntrate, opz);
                        if (dati.eventi) persist(EVENTI_KEY, dati.eventi, setEventi, opz);
                        if (dati.certificati) persist(CERTIFICATI_KEY, dati.certificati, setCertificati, opz);
                        if (dati.sponsorComm) persist(SPONSOR_COMM_KEY, dati.sponsorComm, setSponsorComm, opz);
                        if (dati.sponsorTech) persist(SPONSOR_TECH_KEY, dati.sponsorTech, setSponsorTech, opz);
                        if (dati.inventario) persist(INVENTARIO_KEY, dati.inventario, setInventario, opz);
                        if (dati.noteVeloci) persist(NOTE_VELOCI_KEY, dati.noteVeloci, setNoteVeloci, opz);
                        if (dati.documenti) persist(DOCUMENTI_KEY, dati.documenti, setDocumenti, opz);
                        if (dati.settings) persist(SETTINGS_KEY, dati.settings, setSettings, opz);
                      }
                    );
                  } catch (err) {
                    window.alert("Impossibile leggere il file: " + err.message);
                  }
                };
                reader.readAsText(file);
              }}
            />
          </div>
        </div>

        <div style={{ ...cardStyle, border: `1px solid rgba(201,82,47,0.35)` }}>
          <p style={{ ...sectionLabelStyle, color: coral }}>Zona avanzata</p>
          <div style={{ fontSize: 12, color: textMuted, marginBottom: 12 }}>
            Riporta tutte le impostazioni sopra ai valori di default (non tocca portieri, spese o altri dati).
          </div>
          <button
            onClick={() => confirmAction("Ripristinare le impostazioni ai valori di default?", () => updateSettings(DEFAULT_SETTINGS))}
            style={ghostBtn}
          >
            Ripristina impostazioni di default
          </button>

          <div style={{ height: 18 }} />
          <div style={{ fontSize: 12, color: textMuted, marginBottom: 12 }}>
            Controlla se nei dati salvati ci sono ID duplicati (un bug corretto in questa versione, che poteva
            capitare con elementi creati in sessioni diverse). Il controllo è di sola lettura: non modifica nulla.
          </div>
          <button onClick={() => setMostraControlloId((v) => !v)} style={ghostBtn}>
            {mostraControlloId ? "Nascondi controllo" : "Verifica integrità dati"}
          </button>
          {mostraControlloId && (() => {
            const collezioniSicure = {
              "Materiale": { key: GUANTI_KEY, data: guanti, setter: setGuanti },
              "Pacchetti": { key: PACCHETTI_KEY, data: pacchetti, setter: setPacchetti },
              "Spese": { key: SPESE_KEY, data: spese, setter: setSpese },
              "Sedute/Entrate": { key: ENTRATE_KEY, data: entrate, setter: setEntrate },
              "Eventi": { key: EVENTI_KEY, data: eventi, setter: setEventi },
              "Certificati": { key: CERTIFICATI_KEY, data: certificati, setter: setCertificati },
              "Sponsor commerciali": { key: SPONSOR_COMM_KEY, data: sponsorComm, setter: setSponsorComm },
              "Sponsor tecnici": { key: SPONSOR_TECH_KEY, data: sponsorTech, setter: setSponsorTech },
              "Inventario": { key: INVENTARIO_KEY, data: inventario, setter: setInventario },
              "Note veloci": { key: NOTE_VELOCI_KEY, data: noteVeloci, setter: setNoteVeloci },
              "Documenti": { key: DOCUMENTI_KEY, data: documenti, setter: setDocumenti },
            };
            const correggiDuplicati = (nome) => {
              const c = collezioniSicure[nome];
              if (!c) return;
              const visti = new Set();
              const nuovi = c.data.map((x) => {
                if (visti.has(x.id)) return { ...x, id: generaId() };
                visti.add(x.id);
                return x;
              });
              persist(c.key, nuovi, c.setter);
            };
            const collezioni = [
              ["Portieri", portieri],
              ["Materiale", guanti],
              ["Pacchetti", pacchetti],
              ["Spese", spese],
              ["Sedute/Entrate", entrate],
              ["Eventi", eventi],
              ["Certificati", certificati],
              ["Sponsor commerciali", sponsorComm],
              ["Sponsor tecnici", sponsorTech],
              ["Inventario", inventario],
            ];
            const risultati = collezioni.map(([nome, arr]) => {
              const conteggio = {};
              (arr || []).forEach((x) => { conteggio[x.id] = (conteggio[x.id] || 0) + 1; });
              const duplicati = Object.entries(conteggio).filter(([, n]) => n > 1);
              return { nome, duplicati };
            });
            const totaleProblemi = risultati.reduce((s, r) => s + r.duplicati.length, 0);
            return (
              <div style={{ marginTop: 14 }}>
                {totaleProblemi === 0 ? (
                  <p style={{ fontSize: 13, color: "#1f9d55", fontWeight: 600 }}>✅ Nessun ID duplicato trovato.</p>
                ) : (
                  <div>
                    <p style={{ fontSize: 13, color: coral, fontWeight: 700, marginBottom: 8 }}>
                      ⚠️ Trovati ID duplicati — può causare confusione tra elementi (es. righe che si sovrappongono o si modificano a coppie).
                    </p>
                    {risultati.filter((r) => r.duplicati.length > 0).map((r) => (
                      <div key={r.nome} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, margin: "6px 0" }}>
                        <p style={{ fontSize: 13, color: textSecondary, margin: 0 }}>
                          {r.nome}: {r.duplicati.length} ID duplicato/i (usati {r.duplicati.map(([id, n]) => `${n}×`).join(", ")} volte)
                        </p>
                        {collezioniSicure[r.nome] && (
                          <button
                            onClick={() => confirmAction(`Correggere gli ID duplicati in "${r.nome}"? Ogni elemento in più riceverà un nuovo ID univoco; i dati non vengono toccati.`, () => correggiDuplicati(r.nome))}
                            style={{ ...ghostBtn, padding: "5px 10px", fontSize: 12, flexShrink: 0 }}
                          >
                            Correggi automaticamente
                          </button>
                        )}
                      </div>
                    ))}
                    {risultati.some((r) => r.nome === "Portieri" && r.duplicati.length > 0) && (
                      <p style={{ fontSize: 12, color: coral, marginTop: 10 }}>
                        I Portieri non hanno correzione automatica (il loro ID è collegato a sedute, pacchetti e certificati):
                        se compaiono qui, dimmelo in chat e li sistemiamo insieme con calma.
                      </p>
                    )}
                    <p style={{ fontSize: 12, color: textMuted, marginTop: 10 }}>
                      Dopo la correzione automatica, ricontrolla premendo di nuovo "Verifica integrità dati".
                    </p>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      </div>
    );
  }

  if (view.page === "pacchetto-dettaglio") {
    const pk = pacchetti.find((x) => x.id === view.id);
    if (!pk) {
      setView({ page: "pacchetti" });
      return null;
    }
    return (
      <PaginaPacchettoDettaglio
        pk={pk}
        portieri={portieri}
        aggiungiSeduta={aggiungiSeduta}
        rimuoviSeduta={rimuoviSeduta}
        rimuoviPacchetto={rimuoviPacchetto}
        modificaPacchetto={modificaPacchetto}
        setView={setView}
        goBack={goBack}
        confirmAction={confirmAction}
        printStyle={printStyle}
        Menu={Menu}
        handlePrint={handlePrint}
        handleShare={handleShare}
        settings={settings}
      />
    );
  }

  const totalWA = portieri.filter((p) => p.wa).length;
  const pacchettiAttivi = pacchetti.filter((pk) => pk.sedute.length < pk.numeroSedute).length;
  const oggiRecap = new Date().toISOString().slice(0, 10);
  const transazioniOggi = (() => {
    const venditeOggi = guanti
      .filter((g) => g.tipo === "vendita" && g.data === oggiRecap)
      .map((g) => {
        const pp = portieri.find((x) => String(x.id) === String(g.portiereId));
        return { causale: `Materiale${pp ? " — " + pp.nome : ""}`, importo: Number(g.importo) || 0, movimento: "incasso" };
      });
    const entrateOggi = entrate
      .filter((e) => e.data === oggiRecap)
      .map((e) => {
        const pp = e.portiereId != null ? portieri.find((x) => String(x.id) === String(e.portiereId)) : null;
        return { causale: `${e.fonte || "Seduta"}${pp ? " — " + pp.nome : ""}`, importo: Number(e.importo) || 0, movimento: "incasso" };
      });
    const pacchettiOggi = pacchetti
      .filter((pk) => pk.importoTotale && pk.dataPagamento === oggiRecap && eDavveroPagato(pk.pagato))
      .map((pk) => ({ causale: `Pacchetto — ${pk.nome}`, importo: Number(pk.importoTotale) || 0, movimento: "incasso" }));
    const speseOggi = spese
      .filter((s) => s.data === oggiRecap)
      .map((s) => ({ causale: cap(s.categoria || "Spesa"), importo: Number(s.importo) || 0, movimento: "spesa" }));
    return [...entrateOggi, ...venditeOggi, ...pacchettiOggi, ...speseOggi];
  })();
  const incassatoOggi = transazioniOggi.filter((t) => t.movimento === "incasso").reduce((s, t) => s + t.importo, 0);
  const spesoOggi = transazioniOggi.filter((t) => t.movimento === "spesa").reduce((s, t) => s + t.importo, 0);
  const speseTotale = spese.reduce((s, sp) => s + (Number(sp.importo) || 0), 0);
  const meseCorrente = new Date().toISOString().slice(0, 7);
  const incassiMeseCorrente = ricavaIncassi(guanti, pacchetti, entrate, eventi)
    .filter((v) => v.data && v.data.slice(0, 7) === meseCorrente)
    .reduce((s, v) => s + v.importo, 0);

  // Avvisi: calcolati dal vivo in base alle impostazioni, mostrati come banner in home.
  const oggiTs = new Date(new Date().toISOString().slice(0, 10)).getTime();
  const giorniDa = (dataStr) => {
    if (!dataStr) return null;
    return Math.round((new Date(dataStr).getTime() - oggiTs) / 86400000);
  };
  const giorniAlProssimoCompleanno = (dataNascita) => {
    if (!dataNascita) return null;
    const nascita = new Date(dataNascita);
    const oggiData = new Date(oggiTs);
    let prossimo = new Date(oggiData.getFullYear(), nascita.getMonth(), nascita.getDate());
    prossimo.setHours(0, 0, 0, 0);
    const oggiSenzaOra = new Date(oggiData.getFullYear(), oggiData.getMonth(), oggiData.getDate());
    if (prossimo < oggiSenzaOra) prossimo = new Date(oggiData.getFullYear() + 1, nascita.getMonth(), nascita.getDate());
    return Math.round((prossimo.getTime() - oggiSenzaOra.getTime()) / 86400000);
  };
  const certificatiInScadenza = settings.notifCertificatiScadenza
    ? certificati.filter((c) => {
        const g = giorniDa(c.dataScadenza);
        return g !== null && g <= settings.notifCertificatiGiorni;
      })
    : [];
  const pacchettiInEsaurimento = settings.notifPacchettiEsauriti
    ? pacchetti.filter((pk) => {
        const rimanenti = (pk.numeroSedute || 0) - (pk.sedute ? pk.sedute.length : 0);
        return rimanenti > 0 && rimanenti <= settings.notifPacchettiSoglia;
      })
    : [];
  const eventiImminenti = settings.notifEventiImminenti
    ? eventi.filter((ev) => {
        const g = giorniDa(ev.dataInizio);
        return g !== null && g >= 0 && g <= settings.notifEventiGiorni;
      })
    : [];
  const insolutiSegnalati = settings.notifInsoluti ? insolutiList : [];
  const compleanniImminenti = settings.notifCompleanni !== false
    ? portieri
        .map((p) => ({ portiere: p, giorni: giorniAlProssimoCompleanno(p.dataNascita) }))
        .filter((c) => c.giorni !== null && c.giorni <= (settings.notifCompleanniGiorni ?? 7))
        .sort((a, b) => a.giorni - b.giorni)
    : [];
  const hasAvvisi = insolutiList.length > 0 || certificatiInScadenza.length > 0 || pacchettiInEsaurimento.length > 0 || eventiImminenti.length > 0 || compleanniImminenti.length > 0;

  const OverviewCard = ({ icon, label, value, fg, bgc, onClick, masked, style }) => {
    const [revealed, setRevealed] = useState(false);
    const showMasked = masked && !revealed;
    return (
      <button
        onClick={() => (showMasked ? setRevealed(true) : onClick && onClick())}
        style={{
          flex: "1 1 45%",
          minWidth: 140,
          textAlign: "left",
          background: bgc,
          border: `1px solid ${fg}`,
          borderRadius: 12,
          padding: "12px 16px",
          cursor: "pointer",
          ...style,
        }}
      >
        <p style={{ margin: 0, fontSize: 20, fontWeight: 700, color: fg }}>
          {showMasked ? "••••" : value}
        </p>
        <p style={{ margin: "2px 0 0", fontSize: 12, color: fg, fontWeight: 600 }}>{icon} {label}</p>
      </button>
    );
  };

  if (view.page === "recap-giorno") {
    return (
      <div style={{ padding: 20, maxWidth: 600, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Recap di oggi" />
        <div style={{ height: 18 }} />

        <p style={{ fontSize: 13, color: textMuted, marginBottom: 16 }}>
          {formatData(oggiRecap)} — si aggiorna da solo ogni giorno, non serve azzerarlo a mano.
        </p>

        <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
          <div style={{ ...cardStyle, flex: 1, margin: 0, textAlign: "center" }}>
            <p style={{ margin: 0, fontSize: 22, fontWeight: 800, color: "#1f9d55" }}>€{incassatoOggi.toFixed(2)}</p>
            <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted }}>Incassato oggi</p>
          </div>
          <div style={{ ...cardStyle, flex: 1, margin: 0, textAlign: "center" }}>
            <p style={{ margin: 0, fontSize: 22, fontWeight: 800, color: coral }}>€{spesoOggi.toFixed(2)}</p>
            <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted }}>Speso oggi</p>
          </div>
        </div>

        {transazioniOggi.length === 0 ? (
          <p style={{ fontSize: 14, color: textMuted, textAlign: "center", marginTop: 30 }}>Nessun movimento registrato oggi.</p>
        ) : (
          transazioniOggi.map((t, i) => (
            <div key={i} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <p style={{ margin: 0, fontSize: 14, color: textPrimary }}>{t.causale}</p>
              <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: t.movimento === "spesa" ? coral : "#1f9d55" }}>
                {t.movimento === "spesa" ? "-" : "+"}€{t.importo.toFixed(2)}
              </p>
            </div>
          ))
        )}
      </div>
    );
  }

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Portieri" />

        <div className="no-print" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, margin: "10px 0 16px", flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            {(iscrizioniPending.length > 0 || verifichePending.length > 0) && (
              <button
                onClick={() => setView({ page: iscrizioniPending.length > 0 ? "iscrizioni" : "verifiche" })}
                style={{
                  display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", fontSize: 12, fontWeight: 700,
                  borderRadius: 100, border: `1px solid ${sky}`, background: skyDim, color: sky, cursor: "pointer",
                }}
              >
                📬 {iscrizioniPending.length + verifichePending.length} nuovo/i
              </button>
            )}
            {(() => {
              const giorniDaBackup = settings.ultimoBackup
                ? Math.floor((Date.now() - new Date(settings.ultimoBackup).getTime()) / (1000 * 60 * 60 * 24))
                : null;
              return (
                <button
                  onClick={scaricaBackup}
                  style={{
                    display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", fontSize: 12, fontWeight: 700,
                    borderRadius: 100, border: `1px solid ${border}`, background: surface2, color: textMuted, cursor: "pointer",
                  }}
                >
                  💾 {giorniDaBackup === null ? "Backup mai fatto" : giorniDaBackup === 0 ? "Backup fatto oggi" : `${giorniDaBackup}g fa`}
                </button>
              );
            })()}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button
              onClick={() => updateSettings({ nascondiImportiHome: !settings.nascondiImportiHome })}
              style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", fontSize: 12 }}
            >
              {settings.nascondiImportiHome ? "👁️ Mostra importi" : "🙈 Nascondi importi"}
            </button>
            <ExportMenuCompatto onPrint={handlePrint} onShare={() => handleShare("Portieri", `${portieri.length} portieri in rosa`)} />
          </div>
        </div>

        <div className="no-print" style={{ ...cardStyle, border: `1px solid ${goldSoft}` }}>
          {!showQuickSeduta ? (
            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={() => { setShowQuickSeduta(true); setQuickForm((f) => ({ ...f, importo: f.importo || settings.prezzoDefaultSeduta || "" })); }}
                style={{ ...primaryBtn, flex: 1, minWidth: 0, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "12px 6px", fontSize: 14, textAlign: "center", lineHeight: 1.2 }}
              >
                ⚡ Seduta veloce
              </button>
              <button
                onClick={() => setView({ page: "pacchetti", apriForm: true })}
                style={{ ...primaryBtn, flex: 1, minWidth: 0, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "12px 6px", fontSize: 14, textAlign: "center", lineHeight: 1.2 }}
              >
                📦 Pacchetto veloce
              </button>
            </div>
          ) : (
            <div>
              <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>⚡ Registra seduta veloce</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                <div>
                  <label style={labelStyle}>Portiere</label>
                  <select
                    style={inputStyle}
                    value={quickForm.portiereId}
                    onChange={(e) => setQuickForm((f) => ({ ...f, portiereId: e.target.value }))}
                  >
                    <option value="">Seleziona...</option>
                    {portieri.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map((p) => (
                      <option key={p.id} value={p.id}>{p.nome}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label style={labelStyle}>Importo (€)</label>
                  <input
                    style={inputStyle}
                    type="number"
                    step="0.01"
                    value={quickForm.importo}
                    onChange={(e) => setQuickForm((f) => ({ ...f, importo: e.target.value }))}
                  />
                </div>
                <div>
                  <label style={labelStyle}>Data</label>
                  <input
                    style={inputStyle}
                    type="date"
                    value={quickForm.data}
                    onChange={(e) => setQuickForm((f) => ({ ...f, data: e.target.value }))}
                  />
                </div>
                <div>
                  <label style={labelStyle}>Note (facoltativo)</label>
                  <input
                    style={inputStyle}
                    type="text"
                    placeholder="es. seduta individuale"
                    value={quickForm.note}
                    onChange={(e) => setQuickForm((f) => ({ ...f, note: e.target.value }))}
                  />
                </div>
                <div>
                  <label style={labelStyle}>Metodo di pagamento</label>
                  <select
                    style={inputStyle}
                    value={quickForm.metodoPagamento}
                    onChange={(e) => setQuickForm((f) => ({ ...f, metodoPagamento: e.target.value }))}
                  >
                    <option value="">— non specificato —</option>
                    {OPTS.metodoPagamento.map((m) => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>
              </div>
              <label style={{ ...labelStyle, display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: 12 }}>
                <input type="checkbox" checked={quickForm.pagato} onChange={(e) => setQuickForm((f) => ({ ...f, pagato: e.target.checked }))} style={{ width: 16, height: 16, accentColor: "var(--accent-color)" }} />
                Pagata (se disattivi, resta tra gli insoluti)
              </label>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button
                  onClick={registraSedutaVeloce}
                  disabled={!quickForm.portiereId || !quickForm.importo}
                  style={{ ...primaryBtn, opacity: !quickForm.portiereId || !quickForm.importo ? 0.5 : 1, cursor: !quickForm.portiereId || !quickForm.importo ? "not-allowed" : "pointer" }}
                >
                  Registra
                </button>
                <button onClick={() => setShowQuickSeduta(false)} style={ghostBtn}>Chiudi</button>
                {quickJustSaved && <span style={{ fontSize: 13, color: "#1f9d55", fontWeight: 700 }}>✅ Registrata!</span>}
              </div>
            </div>
          )}
        </div>

        <div className="no-print" style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
          {(() => {
            const oggiStr = new Date().toISOString().slice(0, 10);
            const d = new Date();
            const wd = (d.getDay() + 6) % 7; // lunedì = 0
            const lunedi = new Date(d);
            lunedi.setDate(d.getDate() - wd);
            const domenica = new Date(lunedi);
            domenica.setDate(lunedi.getDate() + 6);
            const lunediStr = lunedi.toISOString().slice(0, 10);
            const domenicaStr = domenica.toISOString().slice(0, 10);
            const seduteOggi = entrate.filter((e) => e.data === oggiStr).length;
            const seduteSettimana = entrate.filter((e) => e.data >= lunediStr && e.data <= domenicaStr).length;
            return (
              <button
                className="no-print"
                onClick={() => setView({ page: "calendario" })}
                style={{ flex: "1 1 45%", minWidth: 140, textAlign: "left", cursor: "pointer", background: surface2, border: `1px solid ${border}`, borderRadius: 12, padding: "12px 16px" }}
              >
                <p style={{ margin: 0, fontSize: 20, fontWeight: 700, color: textPrimary }}>{seduteSettimana}</p>
                <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted, fontWeight: 600 }}>📅 Sedute settimana · {seduteOggi} oggi</p>
              </button>
            );
          })()}

          {hasAvvisi && (
            <div
              className="no-print"
              style={{ flex: "1 1 45%", minWidth: 140, textAlign: "left", background: coralDim, border: `1px solid ${coral}`, borderRadius: 12, padding: "12px 16px", display: "flex", flexDirection: "column", gap: 3 }}
            >
              <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: coral }}>⚠️ Avvisi</p>
              {insolutiList.length > 0 && (
                <button onClick={() => setView({ page: "insoluti" })} style={{ background: "none", border: "none", padding: 0, textAlign: "left", cursor: "pointer" }}>
                  <p style={{ margin: 0, fontSize: 13, color: coral, fontWeight: 700 }}>€{insolutiTotale.toFixed(2)} insoluti ({insolutiList.length})</p>
                </button>

              {certificatiInScadenza.length > 0 && (

function PaginaGuanti({ portieri, guanti, aggiungiGuanto, rimuoviGuanto, modificaGuanto, setView, Menu, TopBar, saveState, printStyle, handlePrint, handleShare }) {
  const [form, setForm] = useState({ portiereId: "", data: "", tipo: "regalo", importo: "", note: "" });
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({});

  const totaleVendite = guanti.filter((g) => g.tipo === "vendita").reduce((s, g) => s + (Number(g.importo) || 0), 0);

  const submit = () => {
    if (!form.portiereId || !form.data) return;
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    aggiungiGuanto({
      portiereId: form.portiereId,
      nome: portiere ? portiere.nome : "—",
      data: form.data,
      tipo: form.tipo,
      importo: form.tipo === "vendita" ? Number(form.importo) || 0 : 0,
      note: form.note,
    });
    setForm({ portiereId: "", data: "", tipo: "regalo", importo: "", note: "" });
    setShowForm(false);
  };

  const startEdit = (g) => {
    setEditId(g.id);
    setEditForm({ data: g.data, tipo: g.tipo, importo: g.importo || "", note: g.note || "" });
  };

  const salvaEdit = (id) => {
    modificaGuanto(id, { data: editForm.data, tipo: editForm.tipo, importo: editForm.tipo === "vendita" ? Number(editForm.importo) || 0 : 0, note: editForm.note });
    setEditId(null);
  };

  const ordinati = [...guanti].sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Materiale" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 0" }}>
          {guanti.length} movimenti · €{totaleVendite.toFixed(2)} da vendite
        </p>

        <div className="no-print" style={{ margin: "16px 0" }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare("Materiale", `${guanti.length} movimenti, €${totaleVendite.toFixed(2)} da vendite`)} />
        </div>

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
          <button onClick={() => setShowForm((v) => !v)} style={{ background: goldDim, color: goldSoft, border: `1px solid ${border}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            + Nuovo movimento
          </button>
        </div>

        {showForm && (
          <div style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuovo movimento guanti</p>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Portiere</label>
              <SelettorePortiere portieri={portieri} value={form.portiereId} onChange={(v) => setForm((f) => ({ ...f, portiereId: v }))} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>
              <div>
                <label style={labelStyle}>Data</label>
                <input style={inputStyle} type="date" value={form.data} onChange={(e) => setForm((f) => ({ ...f, data: e.target.value }))} />
              </div>
              <div>
                <label style={labelStyle}>Tipo</label>
                <select style={inputStyle} value={form.tipo} onChange={(e) => setForm((f) => ({ ...f, tipo: e.target.value }))}>
                  <option value="regalo">Regalo</option>
                  <option value="vendita">Vendita</option>
                </select>
              </div>
            </div>
            {form.tipo === "vendita" && (
              <div style={{ marginBottom: 10 }}>
                <label style={labelStyle}>Importo (€)</label>
                <input style={inputStyle} type="number" step="0.01" value={form.importo} onChange={(e) => setForm((f) => ({ ...f, importo: e.target.value }))} />
              </div>
            )}
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Note</label>

            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={submit} disabled={!form.portiereId || !form.data} style={{ ...primaryBtn, flex: 1, opacity: form.portiereId && form.data ? 1 : 0.5, cursor: form.portiereId && form.data ? "pointer" : "not-allowed" }}>

              </button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        {ordinati.map((g) => {
          if (editId === g.id) {
            return (
              <div key={g.id} style={{ ...cardStyle, marginBottom: 10, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <input style={{ ...inputStyle, width: 150 }} type="date" value={editForm.data} onChange={(e) => setEditForm((f) => ({ ...f, data: e.target.value }))} />
                <select style={{ ...inputStyle, width: 130 }} value={editForm.tipo} onChange={(e) => setEditForm((f) => ({ ...f, tipo: e.target.value }))}>
                  <option value="regalo">Regalo</option>
                  <option value="vendita">Vendita</option>
                </select>
                {editForm.tipo === "vendita" && (
                  <input style={{ ...inputStyle, width: 100 }} type="number" step="0.01" value={editForm.importo} onChange={(e) => setEditForm((f) => ({ ...f, importo: e.target.value }))} />

                <input style={{ ...inputStyle, flex: 1, minWidth: 120 }} type="text" value={editForm.note} placeholder="Note" onChange={(e) => setEditForm((f) => ({ ...f, note: e.target.value }))} />

                <button onClick={() => setEditId(null)} style={ghostBtn}>Annulla</button>
              </div>

          return (
            <div key={g.id} style={{ ...cardStyle, marginBottom: 10, display: "flex", alignItems: "center", gap: 12, justifyContent: "space-between" }}>
              <div style={{ minWidth: 0, flex: 1 }}>
                <p style={{ margin: 0, fontSize: 14, color: textPrimary, fontWeight: 600 }}>{g.nome}</p>
                <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted }}>
                  {formatData(g.data)}
                  {g.tipo === "vendita" ? ` · €${Number(g.importo).toFixed(2)}` : ""}
                  {g.note ? ` · ${g.note}` : ""}
                </p>
              </div>
              <span style={{
                fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 100, textTransform: "capitalize", flexShrink: 0,
                color: g.tipo === "vendita" ? goldSoft : whatsapp,
                background: g.tipo === "vendita" ? goldDim : whatsappDim,
              }}>
                {g.tipo}
              </span>
              <button onClick={() => startEdit(g)} style={{ background: "none", border: "none", color: textMuted, fontSize: 14, cursor: "pointer", flexShrink: 0 }}>✎</button>
              <button onClick={() => rimuoviGuanto(g.id)} style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer", flexShrink: 0 }}>×</button>
            </div>
          );
        })}
        {ordinati.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 15, padding: "40px 0" }}>Nessun movimento registrato.</p>}

        <div style={{ fontSize: 12, color: textSecondary, height: 18, marginTop: 8 }}>
          {saveState === "saving" && "Salvataggio..."}
          {saveState === "saved" && "Salvato"}
          {saveState === "error" && <span style={{ color: coral, fontWeight: 700 }}>⚠️ Non salvato, controlla la connessione e riprova</span>}
        </div>
      </div>
    </div>
  );
}

function PaginaSpese({ spese, guanti, pacchetti, entrate, eventi, aggiungiSpesa, rimuoviSpesa, modificaSpesa, setView, Menu, TopBar, saveState, printStyle, handlePrint, handleShare }) {
  const [form, setForm] = useState({ categoria: "", data: "", importo: "", note: "", metodoPagamento: "" });
  const [showForm, setShowForm] = useState(false);
  const [collapsed, setCollapsed] = useState({});
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [categoriaFiltro, setCategoriaFiltro] = useState(null);

  const totale = spese.reduce((s, sp) => s + (Number(sp.importo) || 0), 0);
  const totaliPerCategoria = OPTS.categoriaSpesa.map((c) => ({
    categoria: c,
    totale: spese.filter((s) => s.categoria === c).reduce((s, sp) => s + (Number(sp.importo) || 0), 0),
  }));

  const submit = () => {
    if (!form.categoria || !form.data || !form.importo) return;
    aggiungiSpesa({ categoria: form.categoria, data: form.data, importo: Number(form.importo), note: form.note, metodoPagamento: form.metodoPagamento || null });
    setForm({ categoria: "", data: "", importo: "", note: "", metodoPagamento: "" });
    setShowForm(false);
  };

  const startEdit = (s) => {
    setEditId(s.id);
    setEditForm({ categoria: s.categoria, data: s.data, importo: s.importo, note: s.note || "", metodoPagamento: s.metodoPagamento || "" });
  };

  const salvaEdit = (id) => {
    modificaSpesa(id, { categoria: editForm.categoria, data: editForm.data, importo: Number(editForm.importo) || 0, note: editForm.note, metodoPagamento: editForm.metodoPagamento || null });
    setEditId(null);
  };

  const gruppiMensili = useMemo(() => {
    const speseFiltrate = categoriaFiltro ? spese.filter((s) => s.categoria === categoriaFiltro) : spese;
    return raggruppaPerMese(speseFiltrate, "importo").map((g) => ({
      ...g,
      items: [...g.items].sort((a, b) => (b.data || "").localeCompare(a.data || "")),
      tot: g.totale,
    }));
  }, [spese, categoriaFiltro]);

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Spese Academy" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 0" }}>
          {spese.length} spese registrate · totale €{totale.toFixed(2)}
        </p>

        <div className="no-print" style={{ marginTop: 16, display: "flex", flexWrap: "wrap", gap: 10 }}>
          <IncassiMonitor guanti={guanti} pacchetti={pacchetti} entrate={entrate} eventi={eventi} onNavigate={() => setView({ page: "contabilita" })} />
        </div>

        <div className="no-print" style={{ margin: "16px 0" }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare("Spese Academy", `${spese.length} spese registrate, totale €${totale.toFixed(2)}`)} />
        </div>

        <div className="no-print" style={{ display: "flex", flexWrap: "wrap", gap: 10, margin: "16px 0" }}>
          {totaliPerCategoria.map(({ categoria, totale }) => {
            const c = SPESA_COLOR[categoria];
            const active = categoriaFiltro === categoria;
            return (
              <button
                key={categoria}
                onClick={() => setCategoriaFiltro(active ? null : categoria)}
                style={{
                  background: c.bg,
                  color: c.fg,
                  borderRadius: 10,
                  padding: "8px 14px",
                  fontSize: 13,
                  fontWeight: 700,
                  textTransform: "capitalize",
                  cursor: "pointer",
                  border: active ? `2px solid ${c.fg}` : "1px solid transparent",
                }}
              >
                {categoria}: €{totale.toFixed(2)}
              </button>
            );
          })}
        </div>

        {categoriaFiltro && (
          <div className="no-print" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: goldDim, border: `1px solid ${gold}`, borderRadius: 10, padding: "8px 14px", marginBottom: 16 }}>
            <span style={{ fontSize: 13, color: goldSoft, fontWeight: 600, textTransform: "capitalize" }}>Filtrato per: {categoriaFiltro}</span>
            <button onClick={() => setCategoriaFiltro(null)} style={{ background: "none", border: "none", color: goldSoft, fontSize: 13, cursor: "pointer", textDecoration: "underline" }}>
              azzera filtro
            </button>
          </div>
        )}

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
          <button onClick={() => setShowForm((v) => !v)} style={{ background: coralDim, color: coral, border: `1px solid ${coral}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
            + Nuova spesa
          </button>
        </div>

        {showForm && (
          <div style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuova spesa</p>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Categoria</label>
              <select style={inputStyle} value={form.categoria} onChange={(e) => setForm((f) => ({ ...f, categoria: e.target.value }))}>
                <option value="">Seleziona...</option>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>
              <div>
                <label style={labelStyle}>Data</label>
                <input style={inputStyle} type="date" value={form.data} onChange={(e) => setForm((f) => ({ ...f, data: e.target.value }))} />
              </div>
              <div>
                <label style={labelStyle}>Importo (€)</label>
                <input style={inputStyle} type="number" step="0.01" value={form.importo} onChange={(e) => setForm((f) => ({ ...f, importo: e.target.value }))} />
              </div>
            </div>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Metodo di pagamento</label>

                <option value="">—</option>
                {OPTS.metodoPagamento.map((m) => (
                  <option key={m} value={m}>{m}</option>

            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Note</label>

            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={submit} disabled={!form.categoria || !form.data || !form.importo} style={{ ...primaryBtn, flex: 1, opacity: form.categoria && form.data && form.importo ? 1 : 0.5, cursor: form.categoria && form.data && form.importo ? "pointer" : "not-allowed" }}>
                Salva

              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>

        {gruppiMensili.map((gruppo) => {

          return (
            <div key={gruppo.key} style={{ border: `1px solid ${border}`, borderRadius: 14, overflow: "hidden", marginBottom: 14 }}>

                onClick={() => setCollapsed((c) => ({ ...c, [gruppo.key]: !c[gruppo.key] }))}
                style={{ width: "100%", display: "flex", alignItems: "baseline", justifyContent: "space-between", padding: "10px 16px", background: coral, border: "none", cursor: "pointer" }}
              >
                <span style={{ fontSize: 16, fontWeight: 700, color: "#ffffff", textTransform: "capitalize" }}>{gruppo.label}</span>
                <span style={{ fontSize: 13, color: "rgba(255,255,255,0.9)" }}>
                  €{gruppo.tot.toFixed(2)} · {isCollapsed ? "+" : "−"}
                </span>
              </button>
              {!isCollapsed &&
                gruppo.items.map((s) => {
                  const c = SPESA_COLOR[s.categoria];
                  if (editId === s.id) {
                    return (
                      <div key={s.id} style={{ padding: "10px 16px", borderTop: `1px solid ${border}`, background: surface, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                        <select style={{ ...inputStyle, width: 150 }} value={editForm.categoria} onChange={(e) => setEditForm((f) => ({ ...f, categoria: e.target.value }))}>

                            <option key={c2} value={c2}>{cap(c2)}</option>

                    <div key={s.id} style={{ padding: "10px 16px", borderTop: `1px solid ${border}`, background: surface, display: "flex", alignItems: "center", gap: 12, justifyContent: "space-between" }}>
