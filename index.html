function initials(nome) {
  const pulito = (nome || "").trim();
  if (!pulito) return "?";
  const parts = pulito.split(" ").filter(Boolean);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function cap(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function formatData(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (DATE_FORMAT_PREF === "mm/gg/aaaa") return `${m}/${d}/${y}`;
  if (DATE_FORMAT_PREF === "aaaa-mm-gg") return `${y}-${m}-${d}`;
  return `${d}/${m}/${y}`;
}

// ID univoci per i nuovi elementi: basati su data/ora + un contatore che cresce sempre, così non
// collidono mai tra una sessione e l'altra (il vecchio contatore ripartiva da -1 a ogni apertura
// dell'app, causando ID duplicati tra elementi creati in giorni diversi) né tra elementi creati
// nello stesso istante (es. importazione massiva da Excel).
let idProgressivo = 0;
function generaId() {
  idProgressivo += 1;
  return -(Date.now() * 100000 + (idProgressivo % 100000));
}

function applyTema(modo, sfondoTema) {
  const risolto = modo === "sistema" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "chiaro" : "scuro") : modo;
  const t = THEMES[risolto] || THEMES.scuro;
  const root = document.documentElement;
  root.setAttribute("data-tema", risolto);
  Object.keys(t).forEach((k) => {
    if (k !== "htmlBg") root.style.setProperty(k, t[k]);
  });
  root.style.backgroundColor = t.htmlBg;
  if (risolto === "chiaro") {
    root.style.backgroundImage = "none";
  } else {
    const sf = SFONDI[sfondoTema] || SFONDI.marchio;
    root.style.backgroundImage = sf.css;
    root.style.backgroundSize = sf.size;
    root.style.backgroundPosition = "center";
    root.style.backgroundRepeat = sf.repeat || "no-repeat";
  }
}

// Data "di oggi" nell'ora locale (non in UTC): dopo mezzanotte in Italia l'UTC è ancora indietro di un giorno.
function dataLocaleISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function oggiISO() {
  return dataLocaleISO(new Date());
}
// Assenze nei pacchetti: ogni 2 pacchetti il portiere ha 1 assenza concessa (recuperabile).
// Il 1° pacchetto la prevede, il rinnovo (2°) no se è già stata usata, il 3° la prevede di nuovo, ecc.
// Conta tutti i pacchetti normali dello stesso portiere; "usate" = assenze registrate con bonus.
function riepilogoAssenze(pacchetti, pk) {
  const chiave = pk.portiereId != null && pk.portiereId !== "" ? "id:" + String(pk.portiereId) : "nome:" + String(pk.nome || "");
  const suoi = (pacchetti || []).filter((x) => {
    if (x.tipo === "speciale") return false;
    const c = x.portiereId != null && x.portiereId !== "" ? "id:" + String(x.portiereId) : "nome:" + String(x.nome || "");
    return c === chiave;
  });
  const concesse = Math.ceil(suoi.length / 2);
  const usate = suoi.reduce((t, x) => t + (x.assenze || []).filter((a) => a.bonus).length, 0);
  const totali = suoi.reduce((t, x) => t + (x.assenze || []).length, 0);
  return { nPacchetti: suoi.length, concesse, usate, disponibili: Math.max(0, concesse - usate), totali };
}
// Aggiunge giorni a una data AAAA-MM-GG senza errori di un giorno al cambio dell'ora legale.
function aggiungiGiorni(dataISO, n) {
  const d = new Date(`${dataISO}T12:00:00Z`);
  if (isNaN(d.getTime())) return dataISO;
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}


function meseLabel(key) {
  if (key === "n.d.") return "Data non indicata";
  const [y, m] = key.split("-");
  return `${MESI[Number(m) - 1]} ${y}`;
}

// Ricava gli incassi (vendite materiale + pacchetti) come voci singole con data e importo
function ricavaIncassi(guanti, pacchetti, entrate, eventi, sponsorComm) {
  const vendite = guanti
    .filter((g) => g.tipo === "vendita")
    .map((g) => ({ data: g.data, importo: Number(g.importo) || 0, fonte: "Materiale", dettaglio: g.nome, sourceType: "materiale", sourceId: g.id, note: g.note }));
  const daPacchetti = pacchetti.flatMap((pk) => {
    const tot = Number(pk.importoTotale) || 0;
    if (!tot) return [];
    const acconto = Number(pk.acconto) || 0;
    const voci = [];
    if (acconto > 0) {
      voci.push({ data: pk.dataAcconto || pk.dataInizio, importo: Math.min(acconto, tot), fonte: "Pacchetto", dettaglio: `${pk.nome} · acconto`, sourceType: "pacchetto", sourceId: pk.id, metodoPagamento: pk.metodoPagamentoAcconto || pk.metodoPagamento, portiereId: pk.portiereId, parte: "acconto" });
    }
    if (eDavveroPagato(pk.pagato)) {
      const saldo = tot - acconto;
      if (saldo > 0.009) {
        voci.push({ data: pk.dataPagamento || pk.dataInizio, importo: saldo, fonte: "Pacchetto", dettaglio: acconto > 0 ? `${pk.nome} · saldo` : pk.nome, sourceType: "pacchetto", sourceId: pk.id, metodoPagamento: pk.metodoPagamento, portiereId: pk.portiereId, parte: acconto > 0 ? "saldo" : null });
      } else if (acconto <= 0) {
        voci.push({ data: pk.dataPagamento || pk.dataInizio, importo: tot, fonte: "Pacchetto", dettaglio: pk.nome, sourceType: "pacchetto", sourceId: pk.id, metodoPagamento: pk.metodoPagamento, portiereId: pk.portiereId, parte: null });
      }
    }
    return voci;
  });
  const manuali = (entrate || []).flatMap((e) => {
    const tot = Number(e.importo) || 0;
    if (!tot) return [];
    const acconto = Number(e.acconto) || 0;
    const dettaglioBase = [e.tipoSeduta, e.note].filter(Boolean).join(" · ") || "voce importata";
    const voci = [];
    if (acconto > 0) {
      voci.push({ data: e.dataAcconto || e.data, importo: Math.min(acconto, tot), fonte: e.fonte || "Manuale", dettaglio: `${dettaglioBase} · acconto`, sourceType: "manuale", sourceId: e.id, note: e.note, portiereId: e.portiereId, metodoPagamento: e.metodoPagamentoAcconto || e.metodoPagamento, parte: "acconto" });
    }
    if (eDavveroPagato(e.pagato)) {
      const saldo = tot - acconto;
      if (saldo > 0.009) {
        voci.push({ data: e.data, importo: saldo, fonte: e.fonte || "Manuale", dettaglio: acconto > 0 ? `${dettaglioBase} · saldo` : dettaglioBase, sourceType: "manuale", sourceId: e.id, note: e.note, portiereId: e.portiereId, metodoPagamento: e.metodoPagamento, parte: acconto > 0 ? "saldo" : null });
      } else if (acconto <= 0) {
        voci.push({ data: e.data, importo: tot, fonte: e.fonte || "Manuale", dettaglio: dettaglioBase, sourceType: "manuale", sourceId: e.id, note: e.note, portiereId: e.portiereId, metodoPagamento: e.metodoPagamento, parte: null });
      }
    }
    return voci;
  });
  const daEventi = (eventi || [])
    .filter((ev) => ev.incassoReale)
    .map((ev) => ({ data: ev.dataInizio, importo: Number(ev.incassoReale) || 0, fonte: "Evento", dettaglio: ev.titolo, sourceType: "evento-incasso", sourceId: ev.id }));
  const daSponsor = (sponsorComm || [])
    .filter((s) => s.importo)
    .map((s) => ({ data: s.data, importo: Number(s.importo) || 0, fonte: "Sponsor", dettaglio: s.nome, sourceType: "sponsor", sourceId: s.id, note: s.note }));
  return [...vendite, ...daPacchetti, ...manuali, ...daEventi, ...daSponsor];
}

// Pacchetti e sedute registrati ma NON ancora pagati: non contano nel bilancio finché non vengono saldati.
// Riconosce lo stato "non pagato" in modo tollerante: sia il booleano false, sia eventuali
// varianti come la stringa "false" (può capitare a seconda di come il dato è transitato).
function eNonPagato(v) {
  return v === false || v === "false";
}
// Ridimensiona e comprime un'immagine caricata dall'utente (es. il logo), così resta leggera
// da salvare e caricare, indipendentemente da quanto è grande la foto originale.
function ridimensionaImmagine(file, maxLato) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Impossibile leggere il file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Impossibile leggere l'immagine"));
      img.onload = () => {
        const scala = Math.min(1, maxLato / Math.max(img.width, img.height));
        const w = Math.round(img.width * scala);
        const h = Math.round(img.height * scala);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Prova a indovinare a quale portiere si riferisce un testo libero (es. la nota di una vecchia
// entrata), cercando se una parola del suo nome compare nel testo. Se trova più di un candidato
// possibile, non si sbilancia e non suggerisce nulla (meglio niente che un suggerimento sbagliato).
function suggerisciPortiere(testo, portieri) {
  if (!testo) return null;
  const testoLower = testo.toLowerCase();
  const candidati = portieri.filter((p) => {
    const parole = (p.nome || "").toLowerCase().split(/\s+/).filter((w) => w.length > 2);
    return parole.some((w) => testoLower.includes(w));
  });
  return candidati.length === 1 ? candidati[0] : null;
}

function eDavveroPagato(v) {
  return !eNonPagato(v);
}

  const daSedute = (entrate || [])

function raggruppaPerMese(voci, campoImporto) {
  const byMonth = {};
  for (const v of voci) {
    const key = v.data ? v.data.slice(0, 7) : "n.d.";
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(v);
  }
  const keys = Object.keys(byMonth).sort((a, b) => b.localeCompare(a));
  return keys.map((k) => ({
    key: k,
    label: meseLabel(k),
    items: byMonth[k].slice().sort((a, b) => (b.data || "").localeCompare(a.data || "")),
    totale: byMonth[k].reduce((s, v) => s + (Number(v[campoImporto || "importo"]) || 0), 0),
  }));
}

// Incassi del mese e dell'anno correnti, calcolati dal vivo da materiale + pacchetti + entrate manuali
function calcolaIncassiMeseAnno(guanti, pacchetti, entrate, eventi, sponsorComm) {
  const oggi = oggiISO();
  const meseKey = oggi.slice(0, 7);
  const annoKey = oggi.slice(0, 4);
  const voci = ricavaIncassi(guanti, pacchetti, entrate, eventi, sponsorComm);
  const mese = voci.filter((v) => v.data && v.data.slice(0, 7) === meseKey).reduce((s, v) => s + v.importo, 0);
  const anno = voci.filter((v) => v.data && v.data.slice(0, 4) === annoKey).reduce((s, v) => s + v.importo, 0);
  return { mese, anno, etichettaMese: MESI[Number(meseKey.slice(5, 7)) - 1], annoKey };
}

  return (

function ModuloIscrizione() {

    try {
      const res = await fetch(`${DEFAULT_SUPABASE_CONFIG.project_url}/rest/v1/iscrizioni_pending`, {
        method: "POST",

          apikey: DEFAULT_SUPABASE_CONFIG.anon_key,

          peso: form.peso ? Number(form.peso) : null,
          taglia_guanti: form.taglia_guanti || null,
          telefono_genitore: form.telefono_genitore || null,
          email_genitore: form.email_genitore || null,
          allergie: form.allergie || null,
          note_mediche: form.note_mediche || null,
          osservazioni_genitore: form.osservazioni_genitore || null,
          preparatore: form.preparatore || null,
          consenso_privacy: form.consenso_privacy,

      });
      if (!res.ok) throw new Error("Invio non riuscito (" + res.status + ")");

function mediaVotiGara(voti) {
  const v = Object.values(voti || {}).map(Number).filter((n) => n >= 1 && n <= 5);
  if (v.length === 0) return null;
  return v.reduce((a, b) => a + b, 0) / v.length;
}
function fmtMedia(m) {
  return m == null ? "–" : m.toFixed(1).replace(".", ",");
}
function ultimoSabato() {
  const d = new Date();
  const g = d.getDay();
  const indietro = g === 6 ? 0 : g === 0 ? 1 : g + 1;
  d.setDate(d.getDate() - indietro);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

const AUDIO_MAX_SEC = 120;

function AudioGara({ path, cfg, token }) {
  const [url, setUrl] = useState(null);
  const [stato, setStato] = useState("idle");
  const carica = async () => {
    setStato("carico");
    try {
      const res = await fetch(`${cfg.project_url}/storage/v1/object/authenticated/audio-gare/${path}`, {
        headers: { apikey: cfg.anon_key, Authorization: `Bearer ${token || cfg.anon_key}` },
      });
      if (!res.ok) throw new Error(String(res.status));
      const blob = await res.blob();
      setUrl(URL.createObjectURL(blob));
      setStato("ok");
    } catch (e) {
      setStato("errore");
    }
  };
  return (
    <div style={{ margin: "8px 0 0", padding: "8px 10px", borderRadius: 8, background: surface2, border: `1px solid ${border}` }}>
      <p style={{ margin: "0 0 6px", fontSize: 11, color: textMuted, fontStyle: "italic" }}>Il racconto a voce:</p>
      {url ? (
        <audio controls autoPlay src={url} style={{ width: "100%" }} />
      ) : (
        <button type="button" onClick={carica} disabled={stato === "carico"} style={{ ...ghostBtn, fontSize: 13, padding: "8px 14px" }}>
          {stato === "carico" ? "Carico l'audio..." : stato === "errore" ? "Non riesco a caricarlo, riprova" : "▶ Ascolta il racconto"}
        </button>
      )}
    </div>
  );
}

function dataBella(iso) {
  try {
    const t = new Date(iso + "T12:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  } catch (e) { return iso; }
}

function RadarGara({ voti }) {
  const W = 390, H = 330, cx = W / 2, cy = H / 2, r = 105, n = AREE_GARA.length;
  const punto = (i, val) => {
    const ang = ((-90 + (360 / n) * i) * Math.PI) / 180;
    return [cx + Math.cos(ang) * r * (val / VOTO_MAX), cy + Math.sin(ang) * r * (val / VOTO_MAX)];
  };
  const anelli = [1, 2, 3, 4].map((lv) => AREE_GARA.map((_, i) => punto(i, lv).join(",")).join(" "));
  const pts = AREE_GARA.map((a, i) => punto(i, Math.min(Number((voti || {})[a[0]]) || 0, VOTO_MAX)));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxWidth: W, display: "block", margin: "0 auto" }} role="img" aria-label="Grafico delle valutazioni per area">
      {anelli.map((a, i) => <polygon key={i} points={a} fill="none" stroke="rgba(150,150,160,0.28)" strokeWidth="1" />)}
      {AREE_GARA.map((a, i) => { const p = punto(i, VOTO_MAX); return <line key={a[0]} x1={cx} y1={cy} x2={p[0]} y2={p[1]} stroke="rgba(150,150,160,0.22)" />; })}
      <polygon points={pts.map((p) => p.join(",")).join(" ")} fill="rgba(212,175,106,0.30)" stroke="#d4af6a" strokeWidth="2" strokeLinejoin="round" />
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3.2" fill="#d4af6a" />)}
      {AREE_GARA.map((a, i) => {
        const p = punto(i, VOTO_MAX * 1.18);
        const anchor = p[0] < cx - 6 ? "end" : p[0] > cx + 6 ? "start" : "middle";
        return <text key={a[0]} x={p[0]} y={p[1] + 3} textAnchor={anchor} fontSize="10.5" style={{ fill: "var(--text-secondary, #b9b9c2)" }}>{a[3]}</text>;
      })}
    </svg>
  );
}

function ModuloValutazioneGara() {
  const params = new URLSearchParams(typeof window !== "undefined" ? window.location.search : "");
  const pId = params.get("p") || "";

  const [form, setForm] = useState({
    nome: "", cognome: "", data_gara: ultimoSabato(), tipo_gara: "Campionato", avversario: "", risultato: "",
    minuti: "", gol_subiti: "", racconto: "",
  });
  const [voti, setVoti] = useState({});
  const [lavorare] = useState([]);
  const [mig, setMig] = useState({});
  const [modo, setModo] = useState("scritto");
  const [registrando, setRegistrando] = useState(false);
  const [secondi, setSecondi] = useState(0);
  const [audioBlob, setAudioBlob] = useState(null);
  const [audioUrl, setAudioUrl] = useState("");
  const [errAudio, setErrAudio] = useState("");
  const recRef = useRef(null);
  const timerRef = useRef(null);
  const secRef = useRef(0);
  const supportaAudio = typeof window !== "undefined" && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

  const ferma = () => {
    if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
    const rec = recRef.current;
    if (rec && rec.state !== "inactive") { try { rec.stop(); } catch (e) {} }
    setRegistrando(false);
  };
  const avvia = async () => {
    setErrAudio("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const tipi = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
      const mime = tipi.find((t) => window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(t)) || "";
      const rec = mime ? new window.MediaRecorder(stream, { mimeType: mime }) : new window.MediaRecorder(stream);
      const pezzi = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) pezzi.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(pezzi, { type: (rec.mimeType || mime || "audio/mp4").split(";")[0] });
        if (blob.size > 0) { setAudioBlob(blob); setAudioUrl(URL.createObjectURL(blob)); }
      };
      rec.start();
      recRef.current = rec;
      secRef.current = 0;
      setSecondi(0);
      setAudioBlob(null);
      setAudioUrl("");
      setRegistrando(true);
      timerRef.current = setInterval(() => {
        secRef.current += 1;
        setSecondi(secRef.current);
        if (secRef.current >= AUDIO_MAX_SEC) ferma();
      }, 1000);
    } catch (e) {
      setErrAudio("Non riesco a usare il microfono. Controlla che il browser abbia il permesso, oppure scrivi il racconto.");
    }

  const rifai = () => { setAudioBlob(null); setAudioUrl(""); setSecondi(0); };

    setStato("inviando");

      let audioPath = null;

        const tipo = (audioBlob.type || "audio/mp4").split(";")[0];
        const ext = tipo.includes("mp4") ? "m4a" : tipo.includes("ogg") ? "ogg" : "webm";
        const rnd = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
        const nomeFile = rnd + "." + ext;
        const up = await fetch(`${DEFAULT_SUPABASE_CONFIG.project_url}/storage/v1/object/audio-gare/${nomeFile}`, {
          method: "POST",
          headers: { apikey: DEFAULT_SUPABASE_CONFIG.anon_key, Authorization: `Bearer ${DEFAULT_SUPABASE_CONFIG.anon_key}`, "Content-Type": tipo },
          body: audioBlob,

  );
}

function ModuloRichiesta() {
  const annoCorrente = new Date().getFullYear();
  const anni = [];
  for (let a = annoCorrente - 5; a >= annoCorrente - 30; a--) anni.push(a);
  const [form, setForm] = useState({ nome_portiere: "", anno: "", squadra: "", chi_scrive: "", telefono: "", email: "", messaggio: "", sito: "" });
  const [consenso, setConsenso] = useState(false);
  const [stato, setStato] = useState("idle");
  const [errore, setErrore] = useState("");
  const campo = (patch) => setForm((f) => ({ ...f, ...patch }));

  const cifre = form.telefono.replace(/\D/g, "");
  const mancanti = [];
  if (!form.nome_portiere.trim()) mancanti.push("nome del portiere");
  if (!form.chi_scrive.trim()) mancanti.push("chi ci scrive");
  if (cifre.length < 6) mancanti.push("un telefono");
  if (!consenso) mancanti.push("il consenso");
  const pronto = mancanti.length === 0 && stato !== "inviando";

  const invia = async (e) => {
    e.preventDefault();
    if (!pronto) return;
    if (form.sito) { setStato("inviato"); return; }
    setStato("inviando");
    setErrore("");
    try {
      const res = await fetch(`${DEFAULT_SUPABASE_CONFIG.project_url}/rest/v1/richieste_info_pending`, {
        method: "POST",
        headers: {
          apikey: DEFAULT_SUPABASE_CONFIG.anon_key,
          Authorization: `Bearer ${DEFAULT_SUPABASE_CONFIG.anon_key}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal",
        },
        body: JSON.stringify([{
          tipo: "informazioni",
          nome_portiere: form.nome_portiere.trim(),
          anno_nascita: form.anno ? Number(form.anno) : null,
          squadra: form.squadra.trim() || null,
          chi_scrive: form.chi_scrive.trim(),
          telefono: form.telefono.trim(),
          email: form.email.trim() || null,
          messaggio: form.messaggio.trim() || null,
          consenso: true,
        }]),
      });
      if (!res.ok) throw new Error(res.status === 404 ? "Il modulo non è ancora attivo: riprova tra poco." : "Invio non riuscito (" + res.status + ")");
      setStato("inviato");
    } catch (err) {
      setStato("errore");
      setErrore(err.message);
    }
  };

  const font = "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif";
  const pagina = { minHeight: "100vh", background: "#0b0b0c", backgroundImage: "radial-gradient(ellipse 900px 500px at 50% -5%, rgba(212,175,106,0.16), transparent 65%)", color: "#f5f5f7", fontFamily: font };
  const card = { background: "#18181a", border: "1px solid rgba(255,255,255,0.10)", borderRadius: 18, padding: 16, marginBottom: 14 };
  const titoletto = { margin: "26px 0 8px", fontSize: 13, letterSpacing: "0.05em", textTransform: "uppercase", color: "#a1a1aa", fontWeight: 600 };
  const campoStile = { boxSizing: "border-box", width: "100%", height: 48, borderRadius: 12, padding: "0 14px", background: "#101012", border: "1px solid rgba(255,255,255,0.16)", color: "#f5f5f7", fontSize: 16, fontFamily: font };
  const etichetta = { display: "block", fontSize: 12, color: "#a1a1aa", margin: "12px 0 4px" };
  const chip = (on) => ({ minHeight: 44, padding: "0 16px", borderRadius: 999, cursor: "pointer", fontSize: 15, fontWeight: 600, fontFamily: font, border: `1px solid ${on ? "#d4af6a" : "rgba(255,255,255,0.16)"}`, background: on ? "rgba(212,175,106,0.18)" : "#101012", color: on ? "#e9d19f" : "#d4d4d8" });

  if (stato === "inviato") {
    return (
      <div style={pagina}>
        <div style={{ maxWidth: 460, margin: "0 auto", padding: "56px 20px 60px", textAlign: "center" }}>
          <div style={{ width: 64, height: 64, borderRadius: 32, background: "rgba(63,174,106,0.18)", border: "1px solid #3fae6a", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3fae6a" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7" /></svg>
          </div>
          <h1 style={{ fontSize: 26, margin: "0 0 8px" }}>Richiesta inviata</h1>
          <p style={{ fontSize: 16, color: "#a1a1aa", margin: 0, lineHeight: 1.5 }}>Grazie! Ti ricontatto io personalmente appena possibile.</p>
          <p style={{ fontSize: 14, color: "#8a8a92", margin: "18px 0 0" }}>Matteo Blasimme · MB Goalkeeper Academy</p>
        </div>
      </div>
    );
  }

  return (
    <div style={pagina}>
      <form onSubmit={invia} style={{ maxWidth: 520, margin: "0 auto", padding: "26px 16px 0" }}>
        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <img src={LOGO_HOME} alt="MB Goalkeeper Training" style={{ width: 150, height: "auto" }} />
        </div>
        <h1 style={{ fontSize: 28, lineHeight: 1.15, textAlign: "center", margin: "6px 0 6px" }}>Modulo di informazioni</h1>
        <p style={{ fontSize: 15, textAlign: "center", color: "#a1a1aa", margin: "0 0 4px", lineHeight: 1.5 }}>
          Lasciami i tuoi dati: ti ricontatto io personalmente. Ci vuole un minuto.

        <p style={titoletto}>Il portiere</p>
        <div style={card}>
          <label style={{ ...etichetta, marginTop: 0 }} htmlFor="r-nome">Nome e cognome del portiere *</label>
          <input id="r-nome" style={campoStile} value={form.nome_portiere} onChange={(e) => campo({ nome_portiere: e.target.value })} autoComplete="off" />
          <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 2fr) minmax(0, 3fr)", gap: 10 }}>
            <div>
              <label style={etichetta} htmlFor="r-anno">Anno di nascita</label>
              <select id="r-anno" style={campoStile} value={form.anno} onChange={(e) => campo({ anno: e.target.value })}>

function SezionePartite({ gare, onElimina, cfg, token }) {
  const [vista, setVista] = useState("ultima");
  const [aperta, setAperta] = useState(null);
  const ordinate = [...(gare || [])].sort((a, b) => String(b.data || "").localeCompare(String(a.data || "")));
  if (ordinate.length === 0) {
    return (
      <div style={cardStyle}>
        <p style={{ margin: 0, fontSize: 13, color: textMuted }}>Ancora nessuna valutazione di gara. Mandala dal menu → Valutazioni gara: il portiere racconta la partita e dà un voto a ogni area.</p>
      </div>
    );
  }
  const medieArea = AREE_GARA.map((a) => {
    const v = ordinate.map((g) => Number((g.voti || {})[a[0]])).filter((n) => n >= 1);
    return { chiave: a[0], nome: a[1], corto: a[3], media: v.length ? v.reduce((x, y) => x + y, 0) / v.length : null };
  });
  const votiMedi = {};
  medieArea.forEach((m) => { if (m.media != null) votiMedi[m.chiave] = m.media; });
  const classifica = medieArea.filter((m) => m.media != null).sort((x, y) => y.media - x.media);
  const forti = classifica.slice(0, 2);
  const deboli = classifica.length > 3 ? classifica.slice(-2).reverse() : [];
  const serie = [...ordinate].reverse().map((g) => (g.media != null ? g.media : mediaVotiGara(g.voti))).filter((m) => m != null);
  const mediaGenerale = serie.length ? serie.reduce((a, b) => a + b, 0) / serie.length : null;
  const ultima = ordinate[0];

  const sparkW = 300, sparkH = 60;
  const spark = serie.length >= 2
    ? serie.map((m, i) => `${(i / (serie.length - 1)) * (sparkW - 16) + 8},${sparkH - 8 - ((m - 1) / (VOTO_MAX - 1)) * (sparkH - 16)}`).join(" ")
    : null;

  return (
    <>
      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 10, flexWrap: "wrap" }}>
          <div>
            <p style={{ margin: 0, fontSize: 12, color: textMuted }}>{ordinate.length} {ordinate.length === 1 ? "partita valutata" : "partite valutate"}</p>
            <p style={{ margin: "2px 0 0", fontSize: 30, fontWeight: 800, color: goldSoft, lineHeight: 1.1 }}>{fmtMedia(mediaGenerale)}<span style={{ fontSize: 14, fontWeight: 500, color: textMuted }}> / 4 di media</span></p>
          </div>
          {spark && (
            <svg viewBox={`0 0 ${sparkW} ${sparkH}`} width="160" height="32" role="img" aria-label="Andamento della media nel tempo">
              <polyline points={spark} fill="none" stroke="#d4af6a" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
              {serie.map((m, i) => <circle key={i} cx={(i / (serie.length - 1)) * (sparkW - 16) + 8} cy={sparkH - 8 - ((m - 1) / (VOTO_MAX - 1)) * (sparkH - 16)} r="3.5" fill="#d4af6a" />)}
            </svg>
          )}
        </div>
        <div style={{ display: "flex", gap: 8, margin: "14px 0 4px" }}>
          {[["ultima", "Ultima partita"], ["media", "Media di tutte"]].map(([k, l]) => (
            <button key={k} onClick={() => setVista(k)} style={{ ...ghostBtn, fontSize: 12, padding: "6px 12px", borderColor: vista === k ? gold : undefined, color: vista === k ? goldSoft : undefined }}>{l}</button>
          ))}
        </div>
        <RadarGara voti={vista === "ultima" ? ultima.voti : votiMedi} />
        {(forti.length > 0 || deboli.length > 0) && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12, marginTop: 8 }}>
            <div>
              <p style={{ margin: "0 0 6px", fontSize: 11, fontWeight: 700, color: "#3fae6a", textTransform: "uppercase", letterSpacing: "0.04em" }}>Punti forti</p>
              {forti.map((m) => <p key={m.chiave} style={{ margin: "2px 0", fontSize: 13, color: textPrimary }}>{m.nome} <span style={{ color: textMuted }}>· {fmtMedia(m.media)}</span></p>)}
            </div>
            {deboli.length > 0 && (
              <div>
                <p style={{ margin: "0 0 6px", fontSize: 11, fontWeight: 700, color: coral, textTransform: "uppercase", letterSpacing: "0.04em" }}>Da lavorare</p>
                {deboli.map((m) => <p key={m.chiave} style={{ margin: "2px 0", fontSize: 13, color: textPrimary }}>{m.nome} <span style={{ color: textMuted }}>· {fmtMedia(m.media)}</span></p>)}
              </div>
            )}
          </div>
        )}
      </div>

      {ordinate.map((g) => {
        const m = g.media != null ? g.media : mediaVotiGara(g.voti);
        const isAperta = aperta === g.id;
        return (
          <div key={g.id} style={cardStyle}>
            <button onClick={() => setAperta(isAperta ? null : g.id)} style={{ width: "100%", background: "none", border: "none", padding: 0, textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, color: textPrimary }}>
              <span>
                <span style={{ display: "block", fontSize: 15, fontWeight: 700 }}>{formatData(g.data)}{g.avversario ? ` · ${g.avversario}` : ""}</span>
                <span style={{ display: "block", fontSize: 12, color: textMuted, marginTop: 2 }}>{[g.tipo, g.risultato, g.minuti ? `${g.minuti} min` : null].filter(Boolean).join(" · ") || "Partita"}</span>
              </span>
              <span style={{ fontSize: 15, fontWeight: 800, padding: "6px 12px", borderRadius: 999, background: goldDim, color: goldSoft, whiteSpace: "nowrap" }}>{fmtMedia(m)}</span>
            </button>
            {isAperta && (
              <div style={{ marginTop: 12, borderTop: `1px solid ${border}`, paddingTop: 12 }}>
                {g.audioPath && <AudioGara path={g.audioPath} cfg={cfg} token={token} />}
                {g.racconto && (
                  <div style={{ marginBottom: 10 }}>
                    <p style={{ margin: 0, fontSize: 11, color: textMuted, fontStyle: "italic" }}>Il racconto del portiere:</p>
                    <p style={{ margin: "4px 0 0", fontSize: 14, color: textSecondary, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{g.racconto}</p>
                  </div>
                )}
                {g.commento && (
                  <div style={{ marginBottom: 10, padding: "8px 10px", borderRadius: 8, background: goldDim }}>
                    <p style={{ margin: 0, fontSize: 11, color: textMuted, fontStyle: "italic" }}>Il tuo commento:</p>
                    <p style={{ margin: "4px 0 0", fontSize: 14, color: textPrimary, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{g.commento}</p>
                  </div>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: "4px 14px" }}>
                  {AREE_GARA.filter((a) => (g.voti || {})[a[0]]).map((a) => (
                    <div key={a[0]} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: textSecondary, padding: "3px 0" }}>
                      <span>{a[1]}{(g.miglioramenti || {})[a[0]] === "si" ? <em style={{ color: "#3fae6a", fontStyle: "normal", fontSize: 12 }}> · miglioramento</em> : (g.miglioramenti || {})[a[0]] === "no" ? <em style={{ color: textMuted, fontStyle: "normal", fontSize: 12 }}> · nessun miglioramento</em> : null}</span>
                      <b style={{ color: COLORI_VOTO[g.voti[a[0]]], textAlign: "right" }}>{ETICHETTE_VOTO[g.voti[a[0]]] || g.voti[a[0]]}</b>
                    </div>
                  ))}
                </div>
                {(g.lavorare || []).length > 0 && (
                  <p style={{ margin: "10px 0 0", fontSize: 13, color: textSecondary }}>
                    Vorrebbe lavorare su: <b style={{ color: textPrimary }}>{AREE_GARA.filter((a) => g.lavorare.includes(a[0])).map((a) => a[1]).join(", ")}</b>
                  </p>
                )}
                <button onClick={() => onElimina(g.id)} style={{ marginTop: 12, background: "none", border: `1px solid ${coral}`, color: coral, borderRadius: 9, padding: "6px 12px", fontSize: 12, cursor: "pointer" }}>Elimina questa partita</button>
              </div>
            )}
          </div>
        );
      })}
    </>
  );
}

  const SUPABASE_TABLE = "gestionale_kv";

  // Fetch con timeout: se la rete non risponde entro il tempo indicato, l'app smette di
  // aspettare invece di restare bloccata per sempre (può succedere in Safari su iPhone
  // quando il file è aperto localmente).
  const fetchConTimeout = async (url, options, timeoutMs) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs || 8000);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  };

  const authHeaders = (cfg, token) => ({
    apikey: cfg.anon_key,
    Authorization: `Bearer ${token || cfg.anon_key}`,
  });

  const supabaseSelect = async (cfg, key, token) => {
    const url = `${cfg.project_url}/rest/v1/${SUPABASE_TABLE}?key=eq.${encodeURIComponent(key)}&select=value`;
    const res = await fetchConTimeout(url, { headers: authHeaders(cfg, token) });
    if (!res.ok) throw new Error("Supabase select " + res.status);
    return res.json();
  };

  const supabaseUpsert = async (cfg, key, value, token) => {
    const url = `${cfg.project_url}/rest/v1/${SUPABASE_TABLE}`;
    const res = await fetchConTimeout(url, {
      method: "POST",
      headers: {
        ...authHeaders(cfg, token),
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal",
      },
      body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }]),
    });
    if (!res.ok) throw new Error("Supabase upsert " + res.status);
  };

  // --- Autenticazione (Supabase Auth: email + password) ---

  // --- Verifica in due passaggi (MFA/TOTP) ---
  const mfaListFactors = async (cfg, token) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/user`, {

  };
  const mfaEnroll = async (cfg, token) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/factors`, {
      method: "POST",
      headers: { apikey: cfg.anon_key, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ friendly_name: `mb-academy-mfa-${Date.now()}`, factor_type: "totp" }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Impossibile avviare l'attivazione");
    return data; // { id, totp: { qr_code, secret, uri } }
  };
  const mfaChallenge = async (cfg, token, factorId) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/factors/${factorId}/challenge`, {

  const mfaVerify = async (cfg, token, factorId, challengeId, code) => {

  const mfaUnenroll = async (cfg, token, factorId) => {
    const res = await fetchConTimeout(`${cfg.project_url}/auth/v1/factors/${factorId}`, {
      method: "DELETE",
      headers: { apikey: cfg.anon_key, Authorization: `Bearer ${token}` },
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error_description || data.msg || "Errore disattivazione");
    }
  };

  // Salvataggio della sessione di login: usa lo storage di Claude quando disponibile (dentro
  // l'artifact), altrimenti localStorage (quando l'app gira da sola, es. su Netlify) — così il
  // login resta affidabile e prevedibile ovunque venga aperta l'app.
  const sessionStorageSet = async (value) => {
    try {
      await window.storage.set(SESSION_KEY, value, false);
      return;
    } catch (e) {}
    try { localStorage.setItem(SESSION_KEY, value); } catch (e2) {}
  };
  const sessionStorageGet = async () => {
    try {
      const res = await window.storage.get(SESSION_KEY, false);
      if (res && res.value) return res.value;
    } catch (e) {}
    try { return localStorage.getItem(SESSION_KEY); } catch (e2) { return null; }
  };
  const sessionStorageDelete = async () => {
    try {
      await window.storage.delete(SESSION_KEY, false);
    } catch (e) {}
    try { localStorage.removeItem(SESSION_KEY); } catch (e2) {}
  };

  const persistSession = async (data, email) => {
    const sess = { access_token: data.access_token, refresh_token: data.refresh_token, email: email || (data.user && data.user.email) };
    await sessionStorageSet(JSON.stringify(sess));
    setSession(sess);
    return sess;
  };

  const doSignUp = async (cfg, emailOverride, passwordOverride) => {
    const email = (emailOverride || authEmail).trim();
    const password = passwordOverride || authPassword;
    setAuthBusy(true);
    setAuthError("");
    try {
      const data = await supabaseSignUp(cfg, email, password);
      if (data.access_token) {
        await persistSession(data, email);
        setAuthScreen(null);
      } else {
        setAuthError("Account creato, ma manca la conferma via email. Prova a fare login qui sotto tra qualche istante, oppure controlla la posta.");
        setAuthScreen("login");
      }
    } catch (e) {
      setAuthError(e.message);
    } finally {
      setAuthBusy(false);
    }
  };

  const doSignIn = async (cfg, emailOverride, passwordOverride) => {
    const email = (emailOverride || authEmail).trim();
    const password = passwordOverride || authPassword;
    setAuthBusy(true);
    setAuthError("");
    try {
      const data = await supabaseSignIn(cfg, email, password);
      // Verifica in due passaggi: se esiste un fattore TOTP confermato, la sessione NON viene
      // salvata finché non arriva il codice giusto. Se non riesco a leggere i fattori, non entro
      // (meglio riprovare che lasciare la porta aperta).
      let fattori;
      try {
        fattori = await mfaListFactors(cfg, data.access_token);
      } catch (e2) {
        throw new Error("Non riesco a controllare la verifica in due passaggi. Riprova tra un momento.");
      }
      const totp = (fattori || []).find((f) => f.factor_type === "totp" && f.status === "verified");
      if (totp) {
        setMfaPending({ factorId: totp.id, challengeId: null, tempSession: data, email });
        setMfaCode("");
        return;
      }
      await persistSession(data, email);
      setAuthScreen(null);
    } catch (e) {
      setAuthError(e.message);
    } finally {
      setAuthBusy(false);
    }
  };

  const doVerificaMfaLogin = async () => {
    if (!mfaPending || mfaCode.trim().length < 6) return;
    setAuthBusy(true);
    setAuthError("");
    try {
      // La richiesta del codice si crea al momento dell'invio, così non scade mentre lo cerchi.
      const ch = await mfaChallenge(dbConfig, mfaPending.tempSession.access_token, mfaPending.factorId);
      const verificato = await mfaVerify(dbConfig, mfaPending.tempSession.access_token, mfaPending.factorId, ch.id, mfaCode.trim());
      await persistSession(verificato, mfaPending.email);
      setMfaPending(null);
      setMfaCode("");
      setAuthScreen(null);
    } catch (e) {
      setAuthError(e.message);
    } finally {
      setAuthBusy(false);
    }
  };

  const caricaMfaFactors = async () => {
    if (!session) return;
    try {

  const iniziaAttivazioneMfa = async () => {
    setMfaBusy(true);
    setMfaErrore("");
    try {
      // Ripulisco eventuali tentativi precedenti rimasti a metà (mai confermati con il codice),
      // altrimenti Supabase rifiuta un nuovo tentativo per nome duplicato.
      let esistenti = [];
      try {
        esistenti = await mfaListFactors(dbConfig, session.access_token);
      } catch (e) {
        throw new Error("Lettura stato attuale: " + e.message);
      }
      const nonVerificati = (esistenti || []).filter((f) => f.status !== "verified");
      for (const f of nonVerificati) {
        await mfaUnenroll(dbConfig, session.access_token, f.id).catch(() => {});
      }
      let data;
      try {
        data = await mfaEnroll(dbConfig, session.access_token);
      } catch (e) {
        throw new Error("Avvio attivazione: " + e.message);
      }
      setMfaEnrollData(data);
    } catch (e) {
      setMfaErrore(e.message);
    } finally {
      setMfaBusy(false);
    }
  };

  const confermaAttivazioneMfa = async () => {
    if (!mfaEnrollData || mfaEnrollCode.trim().length < 6) return;
    setMfaBusy(true);
    setMfaErrore("");
    try {
      const ch = await mfaChallenge(dbConfig, session.access_token, mfaEnrollData.id);
      await mfaVerify(dbConfig, session.access_token, mfaEnrollData.id, ch.id, mfaEnrollCode.trim());
      setMfaEnrollData(null);
      setMfaEnrollCode("");
      await caricaMfaFactors();
    } catch (e) {
      setMfaErrore(e.message);
    } finally {
      setMfaBusy(false);

  const disattivaMfa = async (factorId) => {
    setMfaBusy(true);
    setMfaErrore("");
    try {
      await mfaUnenroll(dbConfig, session.access_token, factorId);

      setMfaBusy(false);
    }

  const doLogout = async () => {
    await sessionStorageDelete();
    setSession(null);
    setAuthScreen("login");

  // Lettura di una chiave: se Supabase è configurato prova lì (database vero, indipendente da
  // questa chat). Riprova fino a 3 volte in caso di problemi di rete temporanei (es. il database
  // che si sta "risvegliando" dopo una pausa). Se fallisce anche dopo i tentativi, NON sostituisce
  // mai i dati veri con quelli vecchi/di partenza — solleva un errore, così chi chiama sa che la
  // lettura non è andata a buon fine e può decidere di non toccare i dati esistenti, invece di
  // mostrarne di sbagliati come se fossero corretti.
  const readKey = async (key, fallback, cfg, token, opzioni) => {
    const permettiFallback = opzioni && opzioni.permettiFallback;
    if (cfg) {
      let ultimoErrore = null;
      for (let tentativo = 0; tentativo < 3; tentativo++) {
        try {
          const rows = await supabaseSelect(cfg, key, token);
          if (rows && rows.length > 0) return rows[0].value;
          ultimoErrore = null;
          break; // nessuna riga: è un dato genuinamente mai creato, non un errore di rete
        } catch (e) {
          ultimoErrore = e;
          if (tentativo < 2) await new Promise((r) => setTimeout(r, 900 * (tentativo + 1)));
        }
      }
      if (ultimoErrore && !permettiFallback) {
        throw ultimoErrore;
      }
    }
    try {
      const res = await window.storage.get(key, true);
      if (res && res.value != null) return JSON.parse(res.value);
    } catch (e) {}
    const migratedRaw = MIGRATION_DATA[key];
    if (migratedRaw != null) {
      try { return JSON.parse(migratedRaw); } catch (e2) { return fallback; }
    }
    return fallback;
  };

  // Fonde in modo sicuro il valore che sto per salvare con quello effettivamente presente sul
  // server in quel momento: se è un elenco di elementi con un id (tutte le nostre collezioni:
  // portieri, spese, sedute, pacchetti, ecc.), ed esiste sul server un elemento che questo
  // dispositivo non conosce (aggiunto da un altro dispositivo nel frattempo), lo tengo invece
  // di perderlo. Evita che un dispositivo con dati "vecchi" cancelli per sbaglio aggiunte più
  // recenti fatte altrove.
  const fondiConServer = async (key, value, cfg, token) => {
    if (!Array.isArray(value) || !value.every((x) => x && typeof x === "object" && "id" in x)) {
      return value;
    }
    try {
      const rows = await supabaseSelect(cfg, key, token);
      if (rows && rows.length > 0 && Array.isArray(rows[0].value)) {
        const serverArray = rows[0].value;
        const idLocali = new Set(value.map((x) => String(x.id)));
        const soloSulServer = serverArray.filter((x) => x && x.id != null && !idLocali.has(String(x.id)));
        if (soloSulServer.length > 0) {
          console.warn(`Recuperati ${soloSulServer.length} elemento/i presenti sul server ma non su questo dispositivo (chiave: ${key}) — uniti invece di essere sovrascritti.`);
          return [...value, ...soloSulServer];
        }
      }
    } catch (e) {
      // Se la rilettura fallisce, procedo comunque con il valore originale piuttosto che bloccare il salvataggio.
    }
    return value;
  };

  const writeKey = async (key, value, cfg, token, opzioni) => {
    const saltaFusione = opzioni && opzioni.saltaFusione;
    if (cfg) {
      const valoreDaSalvare = saltaFusione ? value : await fondiConServer(key, value, cfg, token);
      try {
        await supabaseUpsert(cfg, key, valoreDaSalvare, token);
        return valoreDaSalvare;
      } catch (e) {
        // Se il salvataggio fallisce e siamo loggati, potrebbe essere un token scaduto:
        // provo a rinnovarlo e a ritentare una volta prima di arrendermi.
        if (cfg.auth_enabled && session && session.refresh_token) {
          try {
            const fresh = await supabaseRefresh(cfg, session.refresh_token);
            const sess = await persistSession(fresh, session.email);
            await supabaseUpsert(cfg, key, valoreDaSalvare, sess.access_token);
            return valoreDaSalvare;
          } catch (e2) {
            // Fallito anche il tentativo con token rinnovato: proseguo con il fallback sotto,
            // ma segnalo l'errore per davvero invece di nasconderlo.
            try { localStorage.setItem(key, JSON.stringify(valoreDaSalvare)); } catch (e3) {}
            throw e2;
          }
        }
        try { localStorage.setItem(key, JSON.stringify(valoreDaSalvare)); } catch (e3) {}
        throw e;
      }
    }
    try {
      await window.storage.set(key, JSON.stringify(value), true);
      return value;
    } catch (e) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e2) {}
      throw e;
    }
  };

  const caricaDati = async (cfg, token) => {
    const [
      portieriData, guantiData, pacchettiData, speseData, entrateData, eventiData,
      certificatiData, sponsorCommData, sponsorTechData, inventarioData, noteVelociData, documentiData, settingsData,
    ] = await Promise.all([
      readKey(PORTIERI_KEY, SEED, cfg, token),
      readKey(GUANTI_KEY, [], cfg, token),
      readKey(PACCHETTI_KEY, [], cfg, token),
      readKey(SPESE_KEY, [], cfg, token),
      readKey(ENTRATE_KEY, [], cfg, token),
      readKey(EVENTI_KEY, [], cfg, token),

    const watchdog = setTimeout(() => {

            token = sess.access_token;
          } catch (e) {
            stored = null;
          }

        if (!token) {
          if (!cancelled && !finito) {
            finito = true;
            clearTimeout(watchdog);
            setAuthScreen("login");
            setLoading(false);
          }
          return;

          setLoading(false);

        return;
      }

      if (cancelled || finito) return;
      finito = true;
      clearTimeout(watchdog);

      setPortieri(d.portieriData);
      setGuanti(d.guantiData);

    if (canGenerateImmagine) {
      try {
        const canvas = await window.html2canvas(area, { backgroundColor: "#ffffff", scale: 2, useCORS: true });
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        if (blob) {
          const file = new File([blob], `${(title || "scheda").replace(/[^a-z0-9]/gi, "_")}.png`, { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title, text }).catch(() => {});
            return;
          }
          // Nessun supporto alla condivisione file: propone il download dell'immagine
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = file.name;
          a.click();
          URL.revokeObjectURL(url);
          return;
        }
      } catch (e) {
        // in caso di errore nella generazione immagine, prosegue con i fallback sotto

                    Saldo per intero già incassato (se disattivi, il residuo resta tra gli insoluti)
                  </label>
                  <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                    <button
                      onClick={() => {
                        if (!pagamentoForm.data || !pagamentoForm.importo) return;
                        aggiungiEntrata({ portiereId: p.id, data: pagamentoForm.data, importo: Number(pagamentoForm.importo), note: pagamentoForm.note, metodoPagamento: pagamentoForm.metodoPagamento || null, pagato: pagamentoForm.pagato, fonte: "Seduta singola", tipoSeduta: pagamentoForm.tipoSeduta || "Singola esclusiva", acconto: pagamentoForm.acconto ? Number(pagamentoForm.acconto) : null, dataAcconto: pagamentoForm.acconto ? (pagamentoForm.dataAcconto || oggiISO()) : null });
                        setPagamentoForm({ data: oggiISO(), importo: "", note: "", metodoPagamento: "", pagato: true, tipoSeduta: "Singola esclusiva", acconto: "", dataAcconto: "" });
                        setPagamentoJustSaved(true);
                        setTimeout(() => setPagamentoJustSaved(false), 2200);
                      }}
                      disabled={!pagamentoForm.data || !pagamentoForm.importo}

        </div>
      </div>

  if (view.page === "guanti") {
    return <PaginaGuanti portieri={portieri} guanti={guanti} aggiungiGuanto={aggiungiGuanto} rimuoviGuanto={rimuoviGuanto} modificaGuanto={modificaGuanto} inventario={inventario} modificaInventario={modificaInventario} setView={setView} Menu={Menu} TopBar={TopBar} saveState={saveState} printStyle={printStyle} handlePrint={handlePrint} handleShare={handleShare} />;
  }

  if (view.page === "pacchetti") {
    return (

        pacchetti={pacchetti}

        modificaPacchetto={modificaPacchetto}

        confirmAction={confirmAction}
        settings={settings}
        setView={setView}
        Menu={Menu}
        TopBar={TopBar}
        printStyle={printStyle}
        handlePrint={handlePrint}
        handleShare={handleShare}
      />
    );
  }

  if (view.page === "spese") {
    return <PaginaSpese spese={spese} guanti={guanti} pacchetti={pacchetti} entrate={entrate} eventi={eventi} aggiungiSpesa={aggiungiSpesa} rimuoviSpesa={rimuoviSpesa} modificaSpesa={modificaSpesa} setView={setView} Menu={Menu} TopBar={TopBar} saveState={saveState} printStyle={printStyle} handlePrint={handlePrint} handleShare={handleShare} />;
  }

  if (view.page === "estratto-conto") {
    const tuttiIMetodi = OPTS.metodoPagamento;

    const venditePortieri = guanti
      .filter((g) => g.tipo === "vendita")
      .map((g) => {
        const pp = portieri.find((x) => String(x.id) === String(g.portiereId));
        return { data: g.data, importo: Number(g.importo) || 0, causale: `Materiale${pp ? " — " + pp.nome : ""}`, metodoPagamento: g.metodoPagamento || null, movimento: "incasso" };
      });
    const incassiDaRicavo = ricavaIncassi(guanti, pacchetti, entrate, eventi, sponsorComm)
      .filter((v) => v.sourceType !== "materiale")
      .map((v) => {
        const pp = v.portiereId != null && v.portiereId !== "" ? portieri.find((x) => String(x.id) === String(v.portiereId)) : null;
        const causale =
          v.sourceType === "manuale"
            ? `${v.fonte || "Seduta"}${pp ? " — " + pp.nome : ""}${v.dettaglio && v.dettaglio !== "voce importata" ? " · " + v.dettaglio : ""}`
            : `${v.fonte} — ${v.dettaglio}`;
        return { data: v.data, importo: Number(v.importo) || 0, causale, metodoPagamento: v.metodoPagamento || null, movimento: "incasso" };
      });
    const uscite = spese.map((s) => ({ data: s.data, importo: Number(s.importo) || 0, causale: `${cap(s.categoria || "Spesa")}${s.note ? " · " + s.note : ""}`, metodoPagamento: s.metodoPagamento || null, movimento: "spesa" }));

    let movimenti = [...venditePortieri, ...incassiDaRicavo, ...uscite];

    if (estrattoDataDa) movimenti = movimenti.filter((m) => m.data >= estrattoDataDa);
    if (estrattoDataA) movimenti = movimenti.filter((m) => m.data <= estrattoDataA);
    if (estrattoMetodi.size > 0) movimenti = movimenti.filter((m) => m.metodoPagamento && estrattoMetodi.has(m.metodoPagamento));
    if (estrattoTipo !== "tutti") movimenti = movimenti.filter((m) => m.movimento === (estrattoTipo === "incassi" ? "incasso" : "spesa"));

    movimenti.sort((a, b) => a.data.localeCompare(b.data));

    const totaleIncassi = movimenti.filter((m) => m.movimento === "incasso").reduce((s, m) => s + m.importo, 0);
    const totaleSpese = movimenti.filter((m) => m.movimento === "spesa").reduce((s, m) => s + m.importo, 0);

    return (
      <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
        {printStyle}
        <Menu />
        <div className="no-print" style={{ maxWidth: 800, margin: "0 auto", padding: "18px 40px 0" }}>
          <TopBar title="Estratto conto" />
        </div>

        <div className="no-print" style={{ maxWidth: 800, margin: "16px auto 10px", padding: "0 40px" }}>
          <div style={cardStyle}>
            <p style={{ ...sectionLabelStyle, marginBottom: 10 }}>Filtri</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
              <div>
                <label style={labelStyle}>Dal</label>
                <input style={inputStyle} type="date" value={estrattoDataDa} onChange={(e) => setEstrattoDataDa(e.target.value)} />
              </div>
              <div>
                <label style={labelStyle}>Al</label>
                <input style={inputStyle} type="date" value={estrattoDataA} onChange={(e) => setEstrattoDataA(e.target.value)} />
              </div>
            </div>

            <label style={labelStyle}>Tipo movimento</label>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              {[["tutti", "Tutti"], ["incassi", "Solo incassi"], ["spese", "Solo spese"]].map(([val, lab]) => (
                <button
                  key={val}
                  onClick={() => setEstrattoTipo(val)}
                  style={{
                    flex: 1, padding: "8px 10px", borderRadius: 9, fontSize: 13, cursor: "pointer",
                    border: `1px solid ${estrattoTipo === val ? gold : border}`,
                    background: estrattoTipo === val ? goldDim : surface2,
                    color: estrattoTipo === val ? goldSoft : textPrimary,
                  }}
                >
                  {lab}
                </button>
              ))}
            </div>

            <label style={labelStyle}>Metodo di pagamento (nessuno selezionato = tutti)</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 4 }}>
              {tuttiIMetodi.map((m) => {
                const attivo = estrattoMetodi.has(m);
                return (
                  <button
                    key={m}
                    onClick={() => {
                      const next = new Set(estrattoMetodi);
                      if (attivo) next.delete(m);
                      else next.add(m);
                      setEstrattoMetodi(next);
                    }}
                    style={{
                      padding: "6px 12px", borderRadius: 100, fontSize: 12, fontWeight: 600, cursor: "pointer",
                      border: `1px solid ${attivo ? gold : border}`,
                      background: attivo ? goldDim : surface2,
                      color: attivo ? goldSoft : textPrimary,
                    }}
                  >
                    {m}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        <div className="no-print" style={{ maxWidth: 800, margin: "0 auto 16px", padding: "0 40px", display: "flex", gap: 8 }}>
          <button onClick={handlePrint} style={primaryBtn}>🖨️ Stampa / Esporta PDF</button>
          <button onClick={() => handleShare("Estratto conto", `Estratto conto: €${totaleIncassi.toFixed(2)} incassi, €${totaleSpese.toFixed(2)} spese`)} style={ghostBtn}>📤 Condividi</button>
        </div>

        <div id="print-area" style={{ maxWidth: 800, margin: "0 auto", padding: "20px 40px 60px", background: "#fff", color: "#1a1a1a" }}>
          <div style={{ textAlign: "center", marginBottom: 10 }}>
            <LogoDocumento custom={settings.logoCustom} w={80} />
            <p style={{ margin: 0, fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, color: "#333" }}>{settings.academyName || "MB Goalkeeper Academy Gest"}</p>
            {(settings.coachName || settings.mittenteTelefono || settings.mittenteEmail) && (
              <p style={{ margin: "4px 0 0", fontSize: 12, color: "#777" }}>
                {settings.coachName}
                {settings.coachName && (settings.mittenteTelefono || settings.mittenteEmail) ? " · " : ""}
                {settings.mittenteTelefono}
                {settings.mittenteTelefono && settings.mittenteEmail ? " · " : ""}
                {settings.mittenteEmail}
              </p>
            )}
          </div>
          <div style={{ borderTop: "2px solid #333", margin: "14px 0 20px" }} />
          <h1 style={{ fontSize: 20, margin: "0 0 4px" }}>Estratto conto</h1>
          <p style={{ fontSize: 12, color: "#999", margin: "0 0 4px" }}>
            {estrattoDataDa || estrattoDataA
              ? `Dal ${estrattoDataDa ? formatData(estrattoDataDa) : "inizio"} al ${estrattoDataA ? formatData(estrattoDataA) : "oggi"}`
              : "Tutto il periodo"}
            {estrattoMetodi.size > 0 ? ` · ${[...estrattoMetodi].join(", ")}` : ""}
          </p>
          <p style={{ fontSize: 11, color: "#bbb", margin: "0 0 20px" }}>Generato il {formatData(oggiISO())}</p>

          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ borderBottom: "2px solid #333" }}>
                <th style={{ textAlign: "left", padding: "6px 4px" }}>Data</th>
                <th style={{ textAlign: "left", padding: "6px 4px" }}>Causale</th>
                <th style={{ textAlign: "left", padding: "6px 4px" }}>Metodo</th>
                <th style={{ textAlign: "right", padding: "6px 4px" }}>Importo</th>
              </tr>
            </thead>
            <tbody>
              {movimenti.map((m, i) => (
                <tr key={i} style={{ borderBottom: "1px solid #eee" }}>
                  <td style={{ padding: "6px 4px", whiteSpace: "nowrap" }}>{formatData(m.data)}</td>
                  <td style={{ padding: "6px 4px" }}>{m.causale}</td>
                  <td style={{ padding: "6px 4px" }}>{m.metodoPagamento || "—"}</td>
                  <td style={{ padding: "6px 4px", textAlign: "right", color: m.movimento === "spesa" ? "#c9522f" : "#1f9d55", fontWeight: 600, whiteSpace: "nowrap" }}>
                    {m.movimento === "spesa" ? "-" : ""}€{m.importo.toFixed(2)}
                  </td>
                </tr>
              ))}
              {movimenti.length === 0 && (
                <tr>
                  <td colSpan={4} style={{ padding: "20px 4px", textAlign: "center", color: "#999" }}>Nessun movimento trovato con questi filtri.</td>
                </tr>
              )}
            </tbody>
          </table>

          <div style={{ marginTop: 20, paddingTop: 14, borderTop: "2px solid #333" }}>
            {estrattoTipo !== "spese" && <p style={{ fontSize: 14, margin: "0 0 4px", display: "flex", justifyContent: "space-between" }}><span>Totale incassi</span><strong style={{ color: "#1f9d55" }}>€{totaleIncassi.toFixed(2)}</strong></p>}
            {estrattoTipo !== "incassi" && <p style={{ fontSize: 14, margin: "0 0 4px", display: "flex", justifyContent: "space-between" }}><span>Totale spese</span><strong style={{ color: "#c9522f" }}>€{totaleSpese.toFixed(2)}</strong></p>}
            {estrattoTipo === "tutti" && <p style={{ fontSize: 16, margin: "8px 0 0", display: "flex", justifyContent: "space-between", fontWeight: 800 }}><span>Saldo netto</span><span>€{(totaleIncassi - totaleSpese).toFixed(2)}</span></p>}
          </div>
        </div>
      </div>
    );
  }

  if (view.page === "classifica-presenze") {
    const oggi = oggiISO();
    const classifica = portieri.map((p) => {
      const dateEntrate = entrate.filter((e) => String(e.portiereId) === String(p.id)).map((e) => e.data);
      const dateSedutePacchetti = pacchetti
        .filter((pk) => String(pk.portiereId) === String(p.id))
        .flatMap((pk) => pk.sedute || []);
      const tutteLeDate = [...dateEntrate, ...dateSedutePacchetti].filter(Boolean).sort();
      const presenze = tutteLeDate.length;
      const ultima = tutteLeDate.length > 0 ? tutteLeDate[tutteLeDate.length - 1] : null;
      const giorniDaUltima = ultima ? Math.floor((new Date(oggi) - new Date(ultima)) / (1000 * 60 * 60 * 24)) : null;
      return { portiere: p, presenze, ultima, giorniDaUltima };
    });
    classifica.sort((a, b) => (classificaOrdine === "decrescente" ? b.presenze - a.presenze : a.presenze - b.presenze));

    const inattivi = classifica.filter((c) => c.giorniDaUltima === null || c.giorniDaUltima > 30);

    return (
      <div style={{ padding: 20, maxWidth: 700, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Classifica presenze" />
        <div style={{ height: 18 }} />

        {inattivi.length > 0 && (
          <div className="no-print" style={{ ...cardStyle, marginBottom: 16, border: `1px solid ${coral}`, background: coralDim }}>
            <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: coral }}>
              ⚠️ {inattivi.length} portiere/i senza sedute da oltre 30 giorni (o mai registrate) — buoni candidati per un contatto commerciale.
            </p>
          </div>
        )}

        <div className="no-print" style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <button
            onClick={() => setClassificaOrdine("decrescente")}
            style={{
              flex: 1, padding: "8px 10px", borderRadius: 9, fontSize: 13, cursor: "pointer",
              border: `1px solid ${classificaOrdine === "decrescente" ? gold : border}`,
              background: classificaOrdine === "decrescente" ? goldDim : surface2,
              color: classificaOrdine === "decrescente" ? goldSoft : textPrimary,
            }}
          >
            Più presenze prima
          </button>
          <button
            onClick={() => setClassificaOrdine("crescente")}
            style={{
              flex: 1, padding: "8px 10px", borderRadius: 9, fontSize: 13, cursor: "pointer",
              border: `1px solid ${classificaOrdine === "crescente" ? gold : border}`,
              background: classificaOrdine === "crescente" ? goldDim : surface2,
              color: classificaOrdine === "crescente" ? goldSoft : textPrimary,
            }}
          >
            Meno presenze prima
          </button>
        </div>

        {classifica.map((c, i) => (
          <button
            key={c.portiere.id}
            onClick={() => setView({ page: "dettaglio", id: c.portiere.id })}
            style={{ ...cardStyle, display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", textAlign: "left", cursor: "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
              <span style={{ fontSize: 13, color: textMuted, fontWeight: 700, width: 22, flexShrink: 0 }}>{i + 1}.</span>
              <div style={{ minWidth: 0 }}>
                <p style={{ margin: 0, fontSize: 15, fontWeight: 600, color: textPrimary, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.portiere.nome}</p>
                <p style={{ margin: "2px 0 0", fontSize: 12, color: c.giorniDaUltima === null || c.giorniDaUltima > 30 ? coral : textMuted }}>
                  {c.ultima ? `Ultima seduta: ${formatData(c.ultima)} (${c.giorniDaUltima}g fa)` : "Nessuna seduta registrata"}
                </p>
              </div>
            </div>
            <span style={{ fontSize: 20, fontWeight: 800, color: textPrimary, flexShrink: 0, marginLeft: 10 }}>{c.presenze}</span>
          </button>
        ))}
      </div>
    );
  }

  if (view.page === "storico-assenze") {
    const gruppi = {};
    pacchetti.filter((pk) => pk.tipo !== "speciale").forEach((pk) => {
      const haId = pk.portiereId != null && pk.portiereId !== "";
      const k = haId ? "id:" + String(pk.portiereId) : "nome:" + String(pk.nome || "");
      if (!gruppi[k]) gruppi[k] = { chiave: k, portiereId: haId ? pk.portiereId : null, nome: pk.nome, pacchetti: [] };
      gruppi[k].pacchetti.push(pk);
    });
    const tutte = Object.values(gruppi).map((g) => {
      const pp = g.portiereId != null ? portieri.find((x) => String(x.id) === String(g.portiereId)) : null;
      const assenze = g.pacchetti.flatMap((pk) => (pk.assenze || []).map((a) => ({ ...a, pkId: pk.id })));
      const giustificate = assenze.filter((a) => a.tipo === "recuperata").length;
      const perse = assenze.filter((a) => a.tipo === "persa").length;
      const svolte = g.pacchetti.reduce((t, pk) => t + new Set(pk.sedute || []).size, 0);
      const presenzeReali = Math.max(0, svolte - perse);
      const previste = presenzeReali + assenze.length;
      const ultimaAssenza = assenze.map((a) => a.data).sort().pop() || null;
      return {
        ...g,
        nomeMostrato: pp ? pp.nome : g.nome,
        assenze, giustificate, perse, presenzeReali,
        tasso: previste > 0 ? Math.round((assenze.length / previste) * 100) : 0,
        ultimaAssenza,
        pacchettiOrdinati: [...g.pacchetti].sort((a, b) => String(b.dataInizio || "").localeCompare(String(a.dataInizio || ""))),
      };
    });
    const q = storicoQuery.trim().toLowerCase();
    const righe = tutte
      .filter((r) => (!storicoSoloAssenze || r.assenze.length > 0) && (!q || String(r.nomeMostrato || "").toLowerCase().includes(q)))
      .sort((a, b) => b.assenze.length - a.assenze.length || String(a.nomeMostrato || "").localeCompare(String(b.nomeMostrato || "")));
    const totPacchetti = tutte.reduce((t, r) => t + r.pacchetti.length, 0);
    const totAssenze = tutte.reduce((t, r) => t + r.assenze.length, 0);
    const totGiust = tutte.reduce((t, r) => t + r.giustificate, 0);
    const totPerse = tutte.reduce((t, r) => t + r.perse, 0);
    const conPiuAssenze = tutte.filter((r) => r.assenze.length >= 2).length;
    const tessera = (etichetta, valore, colore) => (
      <div style={{ ...cardStyle, flex: "1 1 120px", marginBottom: 0, textAlign: "center", padding: "12px 8px" }}>
        <p style={{ margin: 0, fontSize: 22, fontWeight: 800, color: colore || textPrimary }}>{valore}</p>
        <p style={{ margin: "2px 0 0", fontSize: 11, color: textMuted }}>{etichetta}</p>
      </div>
    );

    return (
      <div style={{ padding: 20, maxWidth: 760, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Storico assenze" />
        <div style={{ height: 18 }} />

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          {tessera("Pacchetti attivati", totPacchetti)}
          {tessera("Assenze totali", totAssenze, totAssenze > 0 ? coral : undefined)}
          {tessera("Giustificate (recuperate)", totGiust, "#1f9d55")}
          {tessera("Considerate fatte", totPerse, totPerse > 0 ? coral : undefined)}
          {tessera("Con 2+ assenze", conPiuAssenze, conPiuAssenze > 0 ? coral : undefined)}
        </div>

        <div className="no-print" style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          <input style={{ ...inputStyle, flex: "1 1 200px" }} placeholder="Cerca un portiere…" value={storicoQuery} onChange={(e) => setStoricoQuery(e.target.value)} />
          <button
            onClick={() => setStoricoSoloAssenze(!storicoSoloAssenze)}
            style={{ padding: "8px 12px", borderRadius: 9, fontSize: 13, cursor: "pointer", border: `1px solid ${storicoSoloAssenze ? coral : border}`, background: storicoSoloAssenze ? coralDim : surface2, color: storicoSoloAssenze ? coral : textPrimary }}
          >
            {storicoSoloAssenze ? "Solo con assenze ✓" : "Solo con assenze"}
          </button>
          <button onClick={handlePrint} style={{ ...ghostBtn }}>🖨️ Esporta PDF</button>
        </div>

        {righe.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 14, padding: "30px 0" }}>Nessun risultato.</p>}

        {righe.map((r) => {
          const aperto = storicoAperto === r.chiave;
          return (
            <div key={r.chiave} style={{ ...cardStyle, padding: 0, overflow: "hidden" }}>
              <button
                onClick={() => setStoricoAperto(aperto ? null : r.chiave)}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, width: "100%", textAlign: "left", background: "none", border: "none", cursor: "pointer", padding: "12px 14px" }}
              >
                <div style={{ minWidth: 0 }}>
                  <p style={{ margin: 0, fontSize: 15, fontWeight: 600, color: textPrimary, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.nomeMostrato}</p>
                  <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted, lineHeight: 1.4 }}>
                    {r.pacchetti.length} pacchett{r.pacchetti.length === 1 ? "o" : "i"} · {r.presenzeReali} present{r.presenzeReali === 1 ? "e" : "i"}
                    {r.assenze.length > 0 ? ` · ${r.giustificate} giustificat${r.giustificate === 1 ? "a" : "e"}, ${r.perse} considerat${r.perse === 1 ? "a" : "e"} fatt${r.perse === 1 ? "a" : "e"}` : ""}
                    {r.ultimaAssenza ? ` · ultima ${formatData(r.ultimaAssenza)}` : ""}
                  </p>
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <p style={{ margin: 0, fontSize: 20, fontWeight: 800, color: r.assenze.length >= 2 ? coral : r.assenze.length === 1 ? goldSoft : textMuted }}>{r.assenze.length}</p>
                  <p style={{ margin: 0, fontSize: 10.5, color: textMuted }}>{r.assenze.length > 0 ? `${r.tasso}% assenze` : "assenze"}</p>
                </div>
              </button>
              {aperto && (
                <div style={{ borderTop: `1px solid ${border}`, padding: "10px 14px 14px" }}>
                  {r.pacchettiOrdinati.map((pk) => {
                    const fatte = new Set(pk.sedute || []).size;
                    return (
                      <div key={pk.id} style={{ padding: "8px 0", borderTop: `1px dashed ${border}` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                          <p style={{ margin: 0, fontSize: 13.5, color: textPrimary, fontWeight: 600 }}>
                            Pacchetto dal {formatData(pk.dataInizio)} · {fatte}/{pk.numeroSedute} sedute{eNonPagato(pk.pagato) ? " · ⏳ da saldare" : ""}
                          </p>
                          <button onClick={() => setView({ page: "pacchetto-dettaglio", id: pk.id })} style={{ ...ghostBtn, fontSize: 12, padding: "4px 10px" }} className="no-print">Apri</button>
                        </div>
                        {(pk.assenze || []).length === 0 ? (
                          <p style={{ margin: "4px 0 0", fontSize: 12.5, color: "#1f9d55" }}>Nessuna assenza ✅</p>
                        ) : (
                          (pk.assenze || []).map((a, i) => (
                            <p key={i} style={{ margin: "4px 0 0", fontSize: 12.5, color: a.tipo === "persa" ? coral : textSecondary }}>
                              🚫 {formatData(a.data)} ·{" "}
                              {a.tipo === "persa"
                                ? "considerata fatta (persa)"
                                : `${a.bonus ? "giustificata" : "recuperata comunque"} · ${a.dataRecupero ? "recupero il " + formatData(a.dataRecupero) : "recupero da fissare"}`}
                            </p>
                          ))
                        )}
                      </div>
                    );
                  })}
                  {r.portiereId != null && (
                    <button className="no-print" onClick={() => setView({ page: "dettaglio", id: r.portiereId })} style={{ ...ghostBtn, marginTop: 10, fontSize: 12 }}>
                      🧤 Apri la scheda del portiere
                    </button>
                  )}
                </div>
              )}
            </div>
          );
        })}

        <p style={{ fontSize: 11.5, color: textMuted, textAlign: "center", marginTop: 14 }}>
          Lo storico conta i pacchetti normali e le assenze registrate dal pulsante 🚫 Assente. Le assenze di prima di questa versione non sono tracciate.
        </p>
      </div>
    );
  }

  if (view.page === "profili-incompleti") {
    const CAMPI_DA_CONTROLLARE = [
      ["telefono", "Telefono"],
      ["email", "Email"],
      ["dataNascita", "Data di nascita"],
      ["altezza", "Altezza"],
      ["peso", "Peso"],
      ["taglieGuanti", "Taglia guanti"],
    ];
    const profiliIncompleti = portieri
      .map((p) => {
        const mancanti = CAMPI_DA_CONTROLLARE.filter(([chiave]) => !p[chiave] && p[chiave] !== 0).map(([, label]) => label);
        return { portiere: p, mancanti };
      })
      .filter((x) => x.mancanti.length > 0)
      .sort((a, b) => b.mancanti.length - a.mancanti.length);

    return (
      <div style={{ padding: 20, maxWidth: 700, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Profili da completare" />
        <div style={{ height: 18 }} />

        <div className="no-print" style={{ ...cardStyle, marginBottom: 16 }}>
          <p style={{ margin: 0, fontSize: 13, color: textSecondary }}>
            Controlla i dati principali della scheda (non le note) — telefono, email, data di nascita, altezza, peso, taglia guanti. Utile per capire chi non ha mai completato il modulo di iscrizione o ha lasciato qualcosa vuoto.
          </p>
          <p style={{ margin: "8px 0 0", fontSize: 13, fontWeight: 700, color: profiliIncompleti.length > 0 ? coral : "#1f9d55" }}>
            {profiliIncompleti.length === 0 ? "✅ Tutti i profili sono completi!" : `${profiliIncompleti.length} profilo/i con dati mancanti`}
          </p>
        </div>

        {profiliIncompleti.map(({ portiere, mancanti }) => (
          <button
            key={portiere.id}
            onClick={() => setView({ page: "dettaglio", id: portiere.id })}
            style={{ ...cardStyle, display: "block", width: "100%", textAlign: "left", cursor: "pointer" }}
          >
            <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: textPrimary }}>{portiere.nome}</p>
            <p style={{ margin: "4px 0 0", fontSize: 13, color: coral }}>
              Mancano: {mancanti.join(", ")}
            </p>
          </button>
        ))}
      </div>
    );
  }

  if (view.page === "collega-entrate") {
    const entrateOrfane = entrate
      .filter((e) => e.portiereId === null || e.portiereId === undefined || e.portiereId === "")
      .sort((a, b) => (b.data || "").localeCompare(a.data || ""));

    return (
      <div style={{ padding: 20, maxWidth: 700, margin: "0 auto" }}>
        {printStyle}
        <Menu />
        <TopBar title="Ricollega entrate" />
        <div style={{ height: 18 }} />

        <div className="no-print" style={{ ...cardStyle, marginBottom: 16 }}>
          <p style={{ margin: 0, fontSize: 13, color: textSecondary }}>
            Qui trovi le entrate registrate in passato <strong>senza un portiere collegato</strong> (spesso arrivate da migrazioni dati, con il nome solo nella nota). Leggi la nota e assegna il portiere giusto — una volta fatto, contano correttamente ovunque nel gestionale, inclusa la Classifica presenze.
          </p>
          <p style={{ margin: "8px 0 0", fontSize: 13, fontWeight: 700, color: entrateOrfane.length > 0 ? coral : "#1f9d55" }}>
            {entrateOrfane.length === 0 ? "✅ Nessuna entrata orfana, tutto collegato!" : `${entrateOrfane.length} entrate da ricollegare`}
          </p>
        </div>

        {entrateOrfane.map((e) => {
          const suggerito = suggerisciPortiere(`${e.note || ""} ${e.fonte || ""}`, portieri);
          return (
            <div key={e.id} style={cardStyle}>
              <p style={{ margin: 0, fontSize: 15, fontWeight: 600, color: textPrimary }}>
                {formatData(e.data)} · €{Number(e.importo || 0).toFixed(2)}
              </p>
              <p style={{ margin: "4px 0 10px", fontSize: 13, color: textSecondary }}>
                {e.fonte ? `${e.fonte} — ` : ""}{e.note || "(nessuna nota)"}
              </p>

              {suggerito && (
                <button
                  onClick={() => modificaEntrata(e.id, { portiereId: String(suggerito.id) })}
                  style={{
                    display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%",
                    background: whatsappDim, border: `1px solid ${whatsapp}`, borderRadius: 9, padding: "10px 12px",
                    marginBottom: 10, cursor: "pointer",
