            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Note (es. motivo di un prezzo diverso dal solito)</label>
              <input style={inputStyle} type="text" placeholder="es. sconto famiglia, prezzo concordato…" value={form.note} onChange={(e) => setForm((f) => ({ ...f, note: e.target.value }))} />
            </div>
            <label style={{ ...labelStyle, display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: 14 }}>
              <input type="checkbox" checked={form.pagato} onChange={(e) => setForm((f) => ({ ...f, pagato: e.target.checked }))} style={{ width: 16, height: 16, accentColor: "var(--accent-color)" }} />
              Saldo per intero già incassato (altrimenti resta il saldo residuo tra gli insoluti)
            </label>
            {(!form.portiereId || !form.dataInizio || !form.numeroSedute) && (
              <p style={{ margin: "0 0 10px", fontSize: 13, color: coral, background: coralDim, border: `1px solid ${coral}`, borderRadius: 9, padding: "8px 12px" }}>
                ⚠️ Manca ancora: {[!form.portiereId && "portiere", !form.dataInizio && "data 1ª seduta", !form.numeroSedute && "numero sedute"].filter(Boolean).join(", ")}
              </p>
            )}
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={submit} disabled={!form.portiereId || !form.dataInizio || !form.numeroSedute} style={{ ...primaryBtn, flex: 1, opacity: form.portiereId && form.dataInizio && form.numeroSedute ? 1 : 0.5, cursor: form.portiereId && form.dataInizio && form.numeroSedute ? "pointer" : "not-allowed" }}>
                Crea e apri
              </button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))", gap: 12 }}>
        {[...pacchetti].sort((a, b) => (b.dataInizio || "").localeCompare(a.dataInizio || "")).map((pk) => {
          const fatte = new Set(pk.sedute).size;
          const completo = fatte >= pk.numeroSedute;
          const daRinnovare = completo && !pk.rinnovato;
          const rimanenti = pk.numeroSedute - fatte;

          // Arancione: manca solo una seduta. Rosso: pacchetto terminato (in attesa di rinnovo)
          const coloreRiga = daRinnovare
            ? { bg: coralDim, bd: coral }
            : rimanenti === 1
            ? { bg: "rgba(245,158,11,0.12)", bd: "#f59e0b" }
            : null;
          const perc = pk.numeroSedute ? Math.min(100, Math.round((fatte / pk.numeroSedute) * 100)) : 0;
          const coloreBarra = coloreRiga ? coloreRiga.bd : completo ? pitch : sky;

          return (
            <div
              key={pk.id}
              style={{
                ...cardStyle,
                position: "relative", margin: 0, padding: 12, aspectRatio: "1 / 1", minWidth: 0,
                display: "flex", flexDirection: "column",
                ...(coloreRiga ? { background: coloreRiga.bg, border: `1px solid ${coloreRiga.bd}` } : {}),
              }}
            >
              <button
                onClick={() => setView({ page: "pacchetto-dettaglio", id: pk.id })}
                style={{ background: "none", border: "none", textAlign: "left", cursor: "pointer", padding: 0, flex: 1, minWidth: 0, width: "100%", display: "flex", flexDirection: "column", justifyContent: "space-between" }}
              >
                <div style={{ minWidth: 0 }}>
                  <p style={{ margin: 0, paddingRight: 18, fontSize: 13, color: textPrimary, fontWeight: 700, lineHeight: 1.25, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
                    {pk.nome}
                  </p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "2px 6px", marginTop: 3 }}>
                    {pk.tipo === "speciale" && <span style={{ fontSize: 10, fontWeight: 700, color: lilla }}>⭐ Speciale</span>}
                    {daRinnovare && <span style={{ fontSize: 10, fontWeight: 700, color: pitch }}>🔄 da rinnovare</span>}
                    {(pk.assenze || []).length > 0 && <span style={{ fontSize: 10, fontWeight: 700, color: "#c9522f" }}>🚫 {(pk.assenze || []).length} ass.</span>}
                    {(pk.assenze || []).some((a) => a.tipo === "recuperata" && !a.dataRecupero) && <span style={{ fontSize: 10, fontWeight: 700, color: "#c9522f" }}>🔁 recupero da fissare</span>}
                    {pk.note && <span style={{ fontSize: 10 }} title={pk.note}>📝</span>}
                  </div>
                </div>
                <div>
                  <p style={{ margin: "0 0 5px", fontSize: 24, fontWeight: 700, lineHeight: 1, color: completo ? pitch : textPrimary }}>
                    {fatte}<span style={{ fontSize: 14, fontWeight: 600, color: textMuted }}>/{pk.numeroSedute}</span>
                  </p>
                  <div style={{ height: 4, borderRadius: 2, background: surface2 }}>
                    <div style={{ width: `${perc}%`, height: 4, borderRadius: 2, background: coloreBarra }} />
                  </div>
                  <p style={{ margin: "5px 0 0", fontSize: 10.5, color: textMuted, lineHeight: 1.3 }}>
                    dal {formatData(pk.dataInizio)}{pk.importoTotale ? ` · €${Number(pk.importoTotale).toFixed(0)}` : ""}
                  </p>
                </div>
              </button>
              <button
                aria-label="Elimina pacchetto"
                onClick={() => {
                  confirmAction(`Eliminare il pacchetto di ${pk.nome}? L'azione non è reversibile.`, () => rimuoviPacchetto(pk.id));
                }}
                style={{ position: "absolute", top: 4, right: 4, background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer", padding: "2px 6px", lineHeight: 1 }}
              >
                ×
              </button>
            </div>
          );
        })}
        </div>
        {pacchetti.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 15, padding: "40px 0" }}>Nessun pacchetto creato.</p>}
      </div>
    </div>
  );
}

function PaginaPacchettoDettaglio({ pk, pacchetti, portieri, aggiungiSeduta, rimuoviSeduta, rimuoviPacchetto, modificaPacchetto, setView, goBack, confirmAction, printStyle, Menu, handlePrint, handleShare, settings }) {
  const [nuovaData, setNuovaData] = useState("");
  const [editIdx, setEditIdx] = useState(null);
  const [editData, setEditData] = useState("");
  const [modalitaCliente, setModalitaCliente] = useState(false);
  const [editIdxPrestabilita, setEditIdxPrestabilita] = useState(null);
  const [showEstendi, setShowEstendi] = useState(false);
  const [nSedudeDaAggiungere, setNSedudeDaAggiungere] = useState("2");
  const [assenzaPer, setAssenzaPer] = useState(null);
  const [confermaAnnulla, setConfermaAnnulla] = useState(null);
  const [recuperoTmp, setRecuperoTmp] = useState({});
  const [erroreRecupero, setErroreRecupero] = useState({});
  const [recuperoSubito, setRecuperoSubito] = useState("");
  const [erroreSubito, setErroreSubito] = useState("");
  const [dataMancante, setDataMancante] = useState("");
  const [erroreMancante, setErroreMancante] = useState("");
  const fatte = new Set(pk.sedute).size;
  const completo = fatte >= pk.numeroSedute;
  const datePrestabilite = pk.datePrestabilite || [];
  const saldoResiduo = (Number(pk.importoTotale) || 0) - (Number(pk.acconto) || 0);
  const insoluto = pk.importoTotale && eNonPagato(pk.pagato) && saldoResiduo > 0.009;
  const [editAcconto, setEditAcconto] = useState(false);
  const [accontoTmp, setAccontoTmp] = useState(pk.acconto || "");
  const [dataAccontoTmp, setDataAccontoTmp] = useState(pk.dataAcconto || oggiISO());
  const [editNota, setEditNota] = useState(false);
  const [notaTmp, setNotaTmp] = useState(pk.note || "");
  const [editImporto, setEditImporto] = useState(false);
  const [importoTmp, setImportoTmp] = useState(pk.importoTotale != null ? String(pk.importoTotale) : "");
  const [scadenzaTmp, setScadenzaTmp] = useState(pk.dataScadenzaSaldo || pk.dataInizio || "");
  const [metodoTmp, setMetodoTmp] = useState(pk.metodoPagamento || "");

  const estendiPacchetto = () => {
    const n = Math.max(1, Number(nSedudeDaAggiungere) || 1);
    if (pk.tipo === "speciale") {
      const pianificazione = pk.pianificazione || [];
      const ultima = pianificazione.length ? pianificazione[pianificazione.length - 1].data : pk.dataInizio;
      const nuove = [];
      for (let i = 0; i < n; i++) {
        nuove.push({ data: aggiungiGiorni(ultima, 7 * (i + 1)), durata: 1 });
      }
      modificaPacchetto(pk.id, {
        numeroSedute: pk.numeroSedute + n,
        pianificazione: [...pianificazione, ...nuove],
        oreTotali: (pk.oreTotali || pianificazione.reduce((s, x) => s + (Number(x.durata) || 0), 0)) + n,
      });
    } else {
      const base = datePrestabilite.length ? datePrestabilite[datePrestabilite.length - 1] : pk.dataInizio;
      const nuove = [];
      for (let i = 0; i < n; i++) {
        nuove.push(aggiungiGiorni(base, 7 * (i + 1)));
      }
      modificaPacchetto(pk.id, {
        numeroSedute: pk.numeroSedute + n,
        datePrestabilite: [...datePrestabilite, ...nuove],
      });
    }
    setShowEstendi(false);
    setNSedudeDaAggiungere("2");
  };

  const submit = () => {
    if (!nuovaData || completo) return;
    aggiungiSeduta(pk.id, nuovaData);
    setNuovaData("");
  };

  const startEditSeduta = (idx, data) => {
    setEditIdx(idx);
    setEditData(data);
  };

  const salvaEditSeduta = (idx) => {
    if (!editData) return;
    const nuove = [...pk.sedute];
    nuove[idx] = editData;
    nuove.sort();
    modificaPacchetto(pk.id, { sedute: nuove });
    setEditIdx(null);
  };

  const riepAssenze = riepilogoAssenze(pacchetti, pk);
  const elencoAssenze = pk.assenze || [];

  // Segna come assente una data prestabilita. "recupera": la data esce dal programma; il recupero
  // lo aggiunge a mano l'utente scegliendo la data. "fatta": la seduta si considera svolta (persa).
  const registraAssenza = (d, scelta, dataRec) => {
    if (scelta === "fatta") {
      modificaPacchetto(pk.id, {
        sedute: pk.sedute.includes(d) ? pk.sedute : [...pk.sedute, d].sort(),
        assenze: [...elencoAssenze, { data: d, tipo: "persa", bonus: false, registrataIl: oggiISO() }],
      });
    } else {
      // Giustificata: la data esce dal programma. La data del recupero la scegli tu (adesso o dopo).
      if (dataRec && (datePrestabilite.includes(dataRec) || pk.sedute.includes(dataRec))) {
        setErroreSubito("Questa data è già in programma: scegline una nuova (di solito dopo l'ultima seduta).");
        return;
      }
      modificaPacchetto(pk.id, {
        datePrestabilite: dataRec ? [...datePrestabilite.filter((x) => x !== d), dataRec].sort() : datePrestabilite.filter((x) => x !== d),
        assenze: [...elencoAssenze, { data: d, tipo: "recuperata", bonus: riepAssenze.disponibili > 0, dataRecupero: dataRec || null, recuperoNuovo: !!dataRec, registrataIl: oggiISO() }],
      });
    }
    setRecuperoSubito("");
    setErroreSubito("");
    setAssenzaPer(null);
  };

  const annullaAssenza = (idx) => {
    const a = elencoAssenze[idx];
    if (!a) return;
    const resto = elencoAssenze.filter((_, i) => i !== idx);
    if (a.tipo === "persa") {
      modificaPacchetto(pk.id, { assenze: resto, sedute: pk.sedute.filter((x) => x !== a.data) });
    } else {
      const dp = a.recuperoNuovo ? datePrestabilite.filter((x) => x !== a.dataRecupero) : datePrestabilite;
      modificaPacchetto(pk.id, { assenze: resto, datePrestabilite: [...dp, a.data].sort() });
    }
  };

  const impostaRecupero = (idx) => {
    const v = recuperoTmp[idx];
    if (!v) return;
    if (datePrestabilite.includes(v) || pk.sedute.includes(v)) {
      setErroreRecupero((t) => ({ ...t, [idx]: "Questa data è già in programma: scegline una nuova (di solito dopo l'ultima seduta)." }));
      return;
    }
    modificaPacchetto(pk.id, {
      datePrestabilite: [...datePrestabilite, v].sort(),
      assenze: elencoAssenze.map((x, i) => (i === idx ? { ...x, dataRecupero: v, recuperoNuovo: true } : x)),
    });
    setRecuperoTmp((t) => ({ ...t, [idx]: "" }));
    setErroreRecupero((t) => ({ ...t, [idx]: "" }));
  };

  // Torna a "recupero da fissare" per poter scegliere un'altra data.
  const cambiaRecupero = (idx) => {
    const a = elencoAssenze[idx];
    if (!a) return;
    modificaPacchetto(pk.id, {
      datePrestabilite: a.recuperoNuovo ? datePrestabilite.filter((x) => x !== a.dataRecupero) : datePrestabilite,
      assenze: elencoAssenze.map((x, i) => (i === idx ? { ...x, dataRecupero: null, recuperoNuovo: false } : x)),
    });
  };

  const salvaDataPrestabilita = (idx, val) => {
    const nuove = [...datePrestabilite];
    nuove[idx] = val;
    modificaPacchetto(pk.id, { datePrestabilite: nuove });
  };

  const togglePagato = () => {
    const nowPagato = eNonPagato(pk.pagato);
    modificaPacchetto(pk.id, { pagato: nowPagato, dataPagamento: nowPagato ? oggiISO() : null });
  };

  const elimina = () => {
    confirmAction(`Eliminare il pacchetto di ${pk.nome}? L'azione non è reversibile.`, () => {
      rimuoviPacchetto(pk.id);
      setView({ page: "pacchetti" });

  if (modalitaCliente) {

            {pk.tipo === "speciale" ? (

                {(pk.assenze || []).filter((a) => a.tipo === "recuperata" && !a.dataRecupero).map((a, i) => (

          <div style={{ border: "1px solid #ddd", borderRadius: 10, padding: 16 }}>
            <p style={{ margin: 0, fontSize: 13, color: "#777", fontWeight: 700, textTransform: "uppercase" }}>Pagamento</p>
            {pk.importoTotale ? (

            <p style={{ fontSize: 15, margin: "6px 0", color: pk.pagato === true ? "#1f9d55" : "#c9522f", fontWeight: 700 }}>

          </div>

          <p style={{ textAlign: "center", fontSize: 12, color: "#999", marginTop: 30 }}>Documento generato da MB Goalkeeper Academy Gest</p>
        </div>
      </div>
    );

  return (

                  <button

<script>
  (function() {
    var src = document.getElementById("app-source").textContent;

    // Calcolo un'impronta veloce del codice sorgente, per sapere se è cambiato dall'ultima
    // apertura. Se è la stessa di prima, riuso il codice già compilato salvato nel browser,
    // saltando il passaggio più lento (la compilazione), che altrimenti si ripete identico
    // ad ogni apertura anche se il codice non è cambiato per niente.
    function impronta(str) {
      var h = 5381;
      for (var i = 0; i < str.length; i++) {
        h = ((h << 5) + h + str.charCodeAt(i)) | 0;
      }
      return String(h) + "_" + str.length;
    }

    var out = null;
    var chiaveImpronta = "gest-mb-babel-impronta-v1";
    var chiaveCodice = "gest-mb-babel-cache-v1";
    var impronaAttuale = impronta(src);

    try {
      var impronaSalvata = localStorage.getItem(chiaveImpronta);
      if (impronaSalvata === impronaAttuale) {
        out = localStorage.getItem(chiaveCodice);
      }
    } catch (e) {}

    if (!out) {
      out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      try {
        localStorage.setItem(chiaveImpronta, impronaAttuale);
        localStorage.setItem(chiaveCodice, out);
      } catch (e) {}
    }

    var s = document.createElement("script");
    s.text = out;
    document.body.appendChild(s);
  })();
</script>
<script>
(function () {

  var st = document.createElement("style");
  st.textContent =
    "#mbcal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100000;display:flex;align-items:center;justify-content:center;font-family:-apple-system,system-ui,sans-serif}" +
    "#mbcal{background:#1c1c1e;color:#f5f5f7;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:22px;width:min(460px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}" +
    "#mbcal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}" +
    "#mbcal .hd b{font-size:20px}" +
