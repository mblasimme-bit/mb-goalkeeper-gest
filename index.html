function PaginaCertificati({ portieri, certificati, aggiungiCertificato, modificaCertificato, rimuoviCertificato, confirmAction, setView, Menu, TopBar, saveState, printStyle, handlePrint, handleShare }) {
  const vuoto = { portiereId: "", tipo: "", dataVisita: "", dataScadenza: "", medico: "", note: "", allegatoNome: null, allegatoTipo: null, allegatoData: null };
  const [form, setForm] = useState(vuoto);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);

  const TIPI = ["Visita sportiva agonistica", "Visita specialistica", "Altro referto"];

  const submit = () => {
    if (!form.portiereId || !form.tipo || !form.dataVisita) return;
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    aggiungiCertificato({ ...form, nome: portiere ? portiere.nome : "—" });
    setForm(vuoto);
    setShowForm(false);
  };

  const startEdit = (c) => {
    setEditId(c.id);
    setForm({ portiereId: c.portiereId, tipo: c.tipo, dataVisita: c.dataVisita, dataScadenza: c.dataScadenza || "", medico: c.medico || "", note: c.note || "", allegatoNome: c.allegatoNome || null, allegatoTipo: c.allegatoTipo || null, allegatoData: c.allegatoData || null });
  };

  const salvaEdit = () => {
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    modificaCertificato(editId, { ...form, nome: portiere ? portiere.nome : "—" });
    setEditId(null);
    setForm(vuoto);
  };

  const oggi = new Date().toISOString().slice(0, 10);
  const ordinati = [...certificati].sort((a, b) => (b.dataVisita || "").localeCompare(a.dataVisita || ""));

  const statoScadenza = (c) => {
    if (!c.dataScadenza) return null;
    const giorni = Math.round((new Date(c.dataScadenza) - new Date(oggi)) / 86400000);
    if (giorni < 0) return { label: "Scaduto", fg: coral, bg: coralDim };
    if (giorni <= 30) return { label: `Scade tra ${giorni}g`, fg: goldSoft, bg: goldDim };
    return { label: `Valido fino al ${formatData(c.dataScadenza)}`, fg: "#1f9d55", bg: "rgba(31,157,85,0.12)" };
  };

  const FormCert = ({ f, setF }) => (
    <>
      <div style={{ marginBottom: 10 }}>
        <label style={labelStyle}>Portiere</label>
        <SelettorePortiere portieri={portieri} value={f.portiereId} onChange={(v) => setF((x) => ({ ...x, portiereId: v }))} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>
        <div>
          <label style={labelStyle}>Tipo</label>
          <select style={inputStyle} value={f.tipo} onChange={(e) => setF((x) => ({ ...x, tipo: e.target.value }))}>
            <option value="">Seleziona...</option>
            {TIPI.map((t) => (
              <option key={t} value={t}>{t}</option>
            ))}
          </select>
        </div>
        <div>
          <label style={labelStyle}>Medico / struttura</label>
          <input style={inputStyle} type="text" value={f.medico} onChange={(e) => setF((x) => ({ ...x, medico: e.target.value }))} />
        </div>
        <div>
          <label style={labelStyle}>Data visita</label>
          <input style={inputStyle} type="date" value={f.dataVisita} onChange={(e) => setF((x) => ({ ...x, dataVisita: e.target.value }))} />
        </div>
        <div>
          <label style={labelStyle}>Data scadenza</label>
          <input style={inputStyle} type="date" value={f.dataScadenza} onChange={(e) => setF((x) => ({ ...x, dataScadenza: e.target.value }))} />
        </div>
      </div>
      <div>
        <label style={labelStyle}>Note / esito referto</label>
        <textarea style={{ ...inputStyle, resize: "vertical", minHeight: 70 }} value={f.note} onChange={(e) => setF((x) => ({ ...x, note: e.target.value }))} />
      </div>
      <div style={{ marginTop: 10 }}>
        <label style={labelStyle}>Allegato (referto, certificato scansionato)</label>
        <input
          style={inputStyle}
          type="file"
          accept="image/*,application/pdf"
          onChange={(e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              setF((x) => ({ ...x, allegatoNome: file.name, allegatoTipo: file.type, allegatoData: evt.target.result }));
            };
            reader.readAsDataURL(file);
          }}
        />
        {f.allegatoNome && (
          <p style={{ fontSize: 12, color: "#1f9d55", margin: "6px 0 0" }}>
            📎 {f.allegatoNome}{" "}
            <button type="button" onClick={() => setF((x) => ({ ...x, allegatoNome: null, allegatoTipo: null, allegatoData: null }))} style={{ background: "none", border: "none", color: coral, cursor: "pointer", fontSize: 12 }}>
              rimuovi
            </button>
          </p>
        )}
        <p style={{ fontSize: 11, color: textMuted, margin: "4px 0 0" }}>File piccoli consigliati (l'app li salva localmente nel browser).</p>
      </div>
    </>
  );

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Certificati" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 0" }}>{certificati.length} certificati registrati</p>

        <div className="no-print" style={{ margin: "16px 0" }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare("Certificati", `${certificati.length} certificati registrati`)} />
        </div>

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
          <button onClick={() => { setShowForm((v) => !v); setForm(vuoto); setEditId(null); }} style={{ background: coralDim, color: coral, border: `1px solid ${coral}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
            + Nuovo certificato
          </button>
        </div>

        {showForm && (
          <div style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuovo certificato</p>
            <FormCert f={form} setF={setForm} />
            <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
              <button onClick={submit} disabled={!form.portiereId || !form.tipo || !form.dataVisita} style={{ ...primaryBtn, flex: 1, opacity: form.portiereId && form.tipo && form.dataVisita ? 1 : 0.5 }}>Salva</button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        {ordinati.map((c) => {
          const stato = statoScadenza(c);
          if (editId === c.id) {
            return (
              <div key={c.id} style={{ ...cardStyle, marginBottom: 10 }}>
                <FormCert f={form} setF={setForm} />
                <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                  <button onClick={salvaEdit} style={primaryBtn}>Salva</button>
                  <button onClick={() => { setEditId(null); setForm(vuoto); }} style={ghostBtn}>Annulla</button>
                </div>
              </div>
            );
          }
          return (
            <div key={c.id} style={{ ...cardStyle, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                <div style={{ minWidth: 0 }}>
                  <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: textPrimary }}>{c.nome}</p>
                  <p style={{ margin: "3px 0 0", fontSize: 13, color: textMuted }}>
                    {c.tipo} · {formatData(c.dataVisita)}{c.medico ? ` · ${c.medico}` : ""}
                  </p>
                  {c.note && <p style={{ margin: "6px 0 0", fontSize: 13, color: textSecondary }}>{c.note}</p>}
                  {c.allegatoData && (
                    <a href={c.allegatoData} download={c.allegatoNome} style={{ display: "inline-block", marginTop: 6, fontSize: 12, color: "#1f9d55", textDecoration: "none" }}>
                      📎 {c.allegatoNome}
                    </a>
                  )}
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
                  {stato && (
                    <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 100, color: stato.fg, background: stato.bg, whiteSpace: "nowrap" }}>
                      {stato.label}
                    </span>
                  )}
                  <button onClick={() => startEdit(c)} style={{ background: "none", border: "none", color: textMuted, fontSize: 14, cursor: "pointer" }}>✎</button>
                  <button onClick={() => confirmAction("Eliminare questo certificato?", () => rimuoviCertificato(c.id))} style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer" }}>×</button>
                </div>
              </div>
            </div>
          );
        })}
        {ordinati.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 15, padding: "40px 0" }}>Nessun certificato registrato.</p>}

        <div style={{ fontSize: 12, color: textSecondary, height: 18, marginTop: 8 }}>
          {saveState === "saving" && "Salvataggio..."}
          {saveState === "saved" && "Salvato"}
          {saveState === "error" && <span style={{ color: coral, fontWeight: 700 }}>⚠️ Non salvato, controlla la connessione e riprova</span>}
        </div>
      </div>
    </div>
  );
}

function PaginaPacchetti({ portieri, pacchetti, aggiungiPacchetto, rimuoviPacchetto, modificaPacchetto, rinnovoDa, apriForm, confirmAction, setView, Menu, TopBar, printStyle, handlePrint, handleShare }) {
  const rigeneraDateIniziale = (dataInizio, numeroSedute) => {
    if (!dataInizio) return [];
    const n = Math.min(10, Math.max(2, Number(numeroSedute) || 4));
    const out = [];
    for (let i = 0; i < n; i++) {
      const base = new Date(dataInizio);
      base.setDate(base.getDate() + i * 7);
      out.push(base.toISOString().slice(0, 10));
    }
    return out;
  };
  const [form, setForm] = useState(() =>
    rinnovoDa
      ? {
          portiereId: String(rinnovoDa.portiereId),
          dataInizio: rinnovoDa.dataInizio,
          orario: rinnovoDa.orario || "17:00",
          numeroSedute: String(rinnovoDa.numeroSedute || 4),
          datePrestabilite: rigeneraDateIniziale(rinnovoDa.dataInizio, rinnovoDa.numeroSedute),
          dataScadenzaSaldo: rinnovoDa.dataInizio,
          importoTotale: "",
          metodoPagamento: "",
          pagato: false,
        }
      : { portiereId: "", dataInizio: "", orario: "17:00", numeroSedute: "4", datePrestabilite: [], dataScadenzaSaldo: "", importoTotale: "", metodoPagamento: "", pagato: false }
  );
  const [showForm, setShowForm] = useState(!!rinnovoDa || !!apriForm);
  const [tipoForm, setTipoForm] = useState("normale"); // "normale" | "speciale"

  const DURATE_DISPONIBILI = [0.5, 1, 1.5, 2, 2.5, 3];

  const rigeneraPianificazione = (dataInizio, numeroSedute, pianificazioneEsistente) => {
    if (!dataInizio) return [];
    const n = Math.max(1, Math.floor(Number(numeroSedute)) || 1);
    const out = [];
    for (let i = 0; i < n; i++) {
      if (pianificazioneEsistente[i]) {
        out.push(pianificazioneEsistente[i]);
      } else {
        const base = new Date(dataInizio);
        base.setDate(base.getDate() + i * 7);
        out.push({ data: base.toISOString().slice(0, 10), durata: 1 });
      }
    }
    return out;
  };

  const [formSpeciale, setFormSpeciale] = useState({
    portiereId: "", dataInizio: "", orario: "17:00", numeroSedute: "1",
    pianificazione: [], dataScadenzaSaldo: "", importoTotale: "", metodoPagamento: "", pagato: false,
  });

  const setDataInizioSpeciale = (val) => {
    setFormSpeciale((f) => ({ ...f, dataInizio: val, pianificazione: rigeneraPianificazione(val, f.numeroSedute, f.pianificazione), dataScadenzaSaldo: f.dataScadenzaSaldo || val }));
  };
  const setNumeroSeduteSpeciale = (val) => {
    const n = Math.max(1, Math.floor(Number(val)) || 1);
    setFormSpeciale((f) => ({ ...f, numeroSedute: String(n), pianificazione: rigeneraPianificazione(f.dataInizio, n, f.pianificazione) }));
  };
  const setPianificazioneCampo = (i, campo, val) => {
    setFormSpeciale((f) => {
      const next = [...f.pianificazione];
      next[i] = { ...next[i], [campo]: val };
      return { ...f, pianificazione: next };
    });
  };

  const submitSpeciale = () => {
    if (!formSpeciale.portiereId || !formSpeciale.dataInizio || !formSpeciale.numeroSedute) return;
    const portiere = portieri.find((p) => String(p.id) === String(formSpeciale.portiereId));
    const oreTotali = formSpeciale.pianificazione.reduce((s, x) => s + (Number(x.durata) || 0), 0);
    const id = aggiungiPacchetto({
      tipo: "speciale",
      portiereId: formSpeciale.portiereId,
      nome: portiere ? portiere.nome : "—",
      dataInizio: formSpeciale.dataInizio,
      orario: formSpeciale.orario || null,
      numeroSedute: Number(formSpeciale.numeroSedute),
      pianificazione: formSpeciale.pianificazione,
      oreTotali,
      dataScadenzaSaldo: formSpeciale.dataScadenzaSaldo || formSpeciale.dataInizio,
      importoTotale: formSpeciale.importoTotale ? Number(formSpeciale.importoTotale) : null,
      metodoPagamento: formSpeciale.metodoPagamento || null,
      pagato: formSpeciale.pagato,
      dataPagamento: formSpeciale.pagato ? new Date().toISOString().slice(0, 10) : null,
    });
    setFormSpeciale({ portiereId: "", dataInizio: "", orario: "17:00", numeroSedute: "1", pianificazione: [], dataScadenzaSaldo: "", importoTotale: "", metodoPagamento: "", pagato: false });
    setShowForm(false);
    setView({ page: "pacchetto-dettaglio", id });
  };

  // Rigenera le date prestabilite (cadenza settimanale) quando cambia il numero di sedute o la data di inizio,
  // conservando le date già impostate manualmente dove possibile.
  const rigeneraDate = (dataInizio, numeroSedute, dateEsistenti) => {
    if (!dataInizio) return [];
    const n = Math.min(10, Math.max(2, Number(numeroSedute) || 4));
    const out = [];
    for (let i = 0; i < n; i++) {
      if (dateEsistenti[i]) {
        out.push(dateEsistenti[i]);
      } else {
        const base = new Date(dataInizio);
        base.setDate(base.getDate() + i * 7);
        out.push(base.toISOString().slice(0, 10));
      }
    }
    return out;
  };

  const setDataInizio = (val) => {
    setForm((f) => ({ ...f, dataInizio: val, datePrestabilite: rigeneraDate(val, f.numeroSedute, f.datePrestabilite), dataScadenzaSaldo: f.dataScadenzaSaldo || val }));
  };
  const setNumeroSedute = (val) => {
    const n = Math.min(10, Math.max(3, Number(val) || 4));
    setForm((f) => ({ ...f, numeroSedute: String(n), datePrestabilite: rigeneraDate(f.dataInizio, n, f.datePrestabilite) }));
  };
  const setDataSeduta = (i, val) => {
    setForm((f) => {
      const next = [...f.datePrestabilite];
      next[i] = val;
      return { ...f, datePrestabilite: next };
    });
  };

  const submit = () => {
    if (!form.portiereId || !form.dataInizio || !form.numeroSedute) return;
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    const id = aggiungiPacchetto({
      portiereId: form.portiereId,
      nome: portiere ? portiere.nome : "—",
      dataInizio: form.dataInizio,
      orario: form.orario || null,
      numeroSedute: Number(form.numeroSedute),
      datePrestabilite: form.datePrestabilite,
      dataScadenzaSaldo: form.dataScadenzaSaldo || form.dataInizio,
      importoTotale: form.importoTotale ? Number(form.importoTotale) : null,
      metodoPagamento: form.metodoPagamento || null,
      pagato: form.pagato,
      dataPagamento: form.pagato ? new Date().toISOString().slice(0, 10) : null,
    });
    if (rinnovoDa && rinnovoDa.idVecchio) {
      modificaPacchetto(rinnovoDa.idVecchio, { rinnovato: true });
    }
    setForm({ portiereId: "", dataInizio: "", orario: "17:00", numeroSedute: "4", datePrestabilite: [], dataScadenzaSaldo: "", importoTotale: "", metodoPagamento: "", pagato: false });
    setShowForm(false);
    setView({ page: "pacchetto-dettaglio", id });
  };

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Pacchetti" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 0" }}>{pacchetti.length} pacchetti registrati</p>

        <div className="no-print" style={{ margin: "16px 0" }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare("Pacchetti", `${pacchetti.length} pacchetti registrati`)} />
        </div>

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 16 }}>
          <button
            onClick={() => { setTipoForm("normale"); setShowForm((v) => (tipoForm === "normale" ? !v : true)); }}
            style={{ background: skyDim, color: sky, border: `1px solid ${sky}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
          >
            + Nuovo pacchetto
          </button>
          <button
            onClick={() => { setTipoForm("speciale"); setShowForm((v) => (tipoForm === "speciale" ? !v : true)); }}
            style={{ background: lillaDim, color: lilla, border: `1px solid ${lilla}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
          >
            ⭐ Pacchetto speciale
          </button>
        </div>

        {showForm && tipoForm === "speciale" && (
          <div style={{ ...cardStyle, marginBottom: 18, border: `1px solid ${lilla}` }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>⭐ Nuovo pacchetto speciale</p>
            <p style={{ fontSize: 12, color: textMuted, margin: "-6px 0 14px" }}>
              Numero di sedute libero e durata scelta seduta per seduta — pensato per richieste particolari.
            </p>

            <label style={labelStyle}>Portiere</label>
            <SelettorePortiere portieri={portieri} value={formSpeciale.portiereId} onChange={(v) => setFormSpeciale((f) => ({ ...f, portiereId: v }))} />

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 10 }}>
              <div>
                <label style={labelStyle}>Data 1ª seduta</label>
                <input style={inputStyle} type="date" value={formSpeciale.dataInizio} onChange={(e) => setDataInizioSpeciale(e.target.value)} />
              </div>
              <div>
                <label style={labelStyle}>Orario delle sedute</label>
                <input style={inputStyle} type="time" value={formSpeciale.orario} onChange={(e) => setFormSpeciale((f) => ({ ...f, orario: e.target.value }))} />
              </div>
            </div>

            <div style={{ marginTop: 10, marginBottom: 10 }}>
              <label style={labelStyle}>Numero sedute (qualsiasi numero)</label>
              <input
                style={inputStyle}
                type="number"
                min="1"
                value={formSpeciale.numeroSedute}
                onChange={(e) => setNumeroSeduteSpeciale(e.target.value)}
              />
            </div>

            {formSpeciale.dataInizio && formSpeciale.pianificazione.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <label style={labelStyle}>Date e durata di ogni seduta (modificabili)</label>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {formSpeciale.pianificazione.map((s, i) => (
                    <div key={i} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <span style={{ fontSize: 12, color: textMuted, width: 18 }}>{i + 1}.</span>
                      <input style={{ ...inputStyle, flex: 2 }} type="date" value={s.data} onChange={(e) => setPianificazioneCampo(i, "data", e.target.value)} />
                      <select style={{ ...inputStyle, flex: 1 }} value={s.durata} onChange={(e) => setPianificazioneCampo(i, "durata", Number(e.target.value))}>
                        {DURATE_DISPONIBILI.map((d) => (
                          <option key={d} value={d}>{d} {d === 1 ? "ora" : "ore"}</option>
                        ))}
                      </select>
                    </div>
                  ))}
                </div>
                <p style={{ fontSize: 12, color: textMuted, margin: "8px 0 0" }}>
                  Totale ore: {formSpeciale.pianificazione.reduce((s, x) => s + (Number(x.durata) || 0), 0)}
                </p>
              </div>
            )}

            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Giorno del saldo</label>
              <input style={inputStyle} type="date" value={formSpeciale.dataScadenzaSaldo} onChange={(e) => setFormSpeciale((f) => ({ ...f, dataScadenzaSaldo: e.target.value }))} />
            </div>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Importo totale pacchetto (€)</label>
              <input style={inputStyle} type="number" step="0.01" value={formSpeciale.importoTotale} onChange={(e) => setFormSpeciale((f) => ({ ...f, importoTotale: e.target.value }))} />
            </div>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Metodo di pagamento</label>
              <select style={inputStyle} value={formSpeciale.metodoPagamento} onChange={(e) => setFormSpeciale((f) => ({ ...f, metodoPagamento: e.target.value }))}>
                <option value="">—</option>
                {OPTS.metodoPagamento.map((m) => (
                  <option key={m} value={m}>{m}</option>
                ))}
              </select>
            </div>
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: textPrimary, cursor: "pointer", marginBottom: 14 }}>
              <input type="checkbox" checked={formSpeciale.pagato} onChange={(e) => setFormSpeciale((f) => ({ ...f, pagato: e.target.checked }))} />
              Saldo già incassato (altrimenti resta tra gli insoluti finché non lo segni pagato)
            </label>

            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={submitSpeciale}
                disabled={!formSpeciale.portiereId || !formSpeciale.dataInizio}
                style={{ ...primaryBtn, flex: 1, opacity: !formSpeciale.portiereId || !formSpeciale.dataInizio ? 0.5 : 1, cursor: !formSpeciale.portiereId || !formSpeciale.dataInizio ? "not-allowed" : "pointer" }}
              >
                Crea e apri
              </button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        {showForm && tipoForm === "normale" && (
          <div style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuovo pacchetto</p>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Portiere</label>
              <SelettorePortiere portieri={portieri} value={form.portiereId} onChange={(v) => setForm((f) => ({ ...f, portiereId: v }))} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>
              <div>
                <label style={labelStyle}>Data 1ª seduta</label>
                <input style={inputStyle} type="date" value={form.dataInizio} onChange={(e) => setDataInizio(e.target.value)} />
              </div>
              <div>
                <label style={labelStyle}>Orario delle sedute</label>
                <input style={inputStyle} type="time" value={form.orario} onChange={(e) => setForm((f) => ({ ...f, orario: e.target.value }))} />
              </div>
            </div>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Numero sedute</label>
              <select style={inputStyle} value={form.numeroSedute} onChange={(e) => setNumeroSedute(e.target.value)}>
                {[2, 3, 4, 5, 6, 7, 8, 9, 10].map((n) => (
                  <option key={n} value={n}>{n} sedute</option>
                ))}
              </select>
            </div>

            {form.dataInizio && (form.datePrestabilite || []).length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <label style={labelStyle}>Date prestabilite delle sedute (modificabili)</label>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {form.datePrestabilite.map((d, i) => (
                    <input key={i} style={inputStyle} type="date" value={d} onChange={(e) => setDataSeduta(i, e.target.value)} />
                  ))}
                </div>
              </div>
            )}

            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Giorno del saldo (di solito la 1ª seduta)</label>
              <input style={inputStyle} type="date" value={form.dataScadenzaSaldo} onChange={(e) => setForm((f) => ({ ...f, dataScadenzaSaldo: e.target.value }))} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Importo totale pacchetto (€)</label>
              <input style={inputStyle} type="number" step="0.01" value={form.importoTotale} placeholder="—" onChange={(e) => setForm((f) => ({ ...f, importoTotale: e.target.value }))} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Metodo di pagamento</label>
              <select style={inputStyle} value={form.metodoPagamento} onChange={(e) => setForm((f) => ({ ...f, metodoPagamento: e.target.value }))}>
                <option value="">— non specificato —</option>
                {OPTS.metodoPagamento.map((m) => (
                  <option key={m} value={m}>{m}</option>
                ))}
              </select>
            </div>
            <label style={{ ...labelStyle, display: "flex", alignItems: "center", gap: 8, cursor: "pointer", marginBottom: 14 }}>
              <input type="checkbox" checked={form.pagato} onChange={(e) => setForm((f) => ({ ...f, pagato: e.target.checked }))} style={{ width: 16, height: 16, accentColor: "var(--accent-color)" }} />
              Saldo già incassato (altrimenti resta tra gli insoluti finché non lo segni pagato)
            </label>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={submit} disabled={!form.portiereId || !form.dataInizio || !form.numeroSedute} style={{ ...primaryBtn, flex: 1, opacity: form.portiereId && form.dataInizio && form.numeroSedute ? 1 : 0.5, cursor: form.portiereId && form.dataInizio && form.numeroSedute ? "pointer" : "not-allowed" }}>
                Crea e apri
              </button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        {pacchetti.map((pk) => {
          const fatte = pk.sedute.length;
          const completo = fatte >= pk.numeroSedute;
          const daRinnovare = completo && !pk.rinnovato;
          return (
            <div key={pk.id} style={{ ...cardStyle, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
              <button
                onClick={() => setView({ page: "pacchetto-dettaglio", id: pk.id })}
                style={{ background: "none", border: "none", textAlign: "left", cursor: "pointer", padding: 0, flex: 1, minWidth: 0 }}
              >
                <p style={{ margin: 0, fontSize: 15, color: textPrimary, fontWeight: 600 }}>
                  {pk.nome}
                  {pk.tipo === "speciale" && <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 700, color: lilla }}>⭐ Speciale</span>}
                  {daRinnovare && <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 700, color: pitch }}>🔄 da rinnovare</span>}
                </p>
                <p style={{ margin: "2px 0 0", fontSize: 12, color: textMuted }}>
                  dal {formatData(pk.dataInizio)}{pk.importoTotale ? ` · €${Number(pk.importoTotale).toFixed(2)}` : ""}
                </p>
              </button>
              <span
                style={{
                  fontSize: 12,
                  fontWeight: 700,
                  padding: "4px 10px",
                  borderRadius: 100,
                  color: completo ? "#ffffff" : sky,
                  background: completo ? pitch : skyDim,
                  flexShrink: 0,
                }}
              >
                {fatte}/{pk.numeroSedute}
              </span>
              <button
                onClick={() => {
                  confirmAction(`Eliminare il pacchetto di ${pk.nome}? L'azione non è reversibile.`, () => rimuoviPacchetto(pk.id));
                }}
                style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer", flexShrink: 0 }}
              >
                ×
              </button>
            </div>
          );
        })}
        {pacchetti.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 15, padding: "40px 0" }}>Nessun pacchetto creato.</p>}
      </div>
    </div>
  );
}

function PaginaPacchettoDettaglio({ pk, portieri, aggiungiSeduta, rimuoviSeduta, rimuoviPacchetto, modificaPacchetto, setView, goBack, confirmAction, printStyle, Menu, handlePrint, handleShare, settings }) {
  const [nuovaData, setNuovaData] = useState("");
  const [editIdx, setEditIdx] = useState(null);
  const [editData, setEditData] = useState("");
  const [modalitaCliente, setModalitaCliente] = useState(false);
  const [editIdxPrestabilita, setEditIdxPrestabilita] = useState(null);
  const fatte = pk.sedute.length;
  const completo = fatte >= pk.numeroSedute;
  const datePrestabilite = pk.datePrestabilite || [];
  const insoluto = pk.importoTotale && eNonPagato(pk.pagato);

  const submit = () => {
    if (!nuovaData || completo) return;
    aggiungiSeduta(pk.id, nuovaData);
    setNuovaData("");
  };

  const startEditSeduta = (idx, data) => {
    setEditIdx(idx);
    setEditData(data);
  };

  const salvaEditSeduta = (idx) => {
    if (!editData) return;
    const nuove = [...pk.sedute];
    nuove[idx] = editData;
    nuove.sort();
    modificaPacchetto(pk.id, { sedute: nuove });
    setEditIdx(null);
  };

  const salvaDataPrestabilita = (idx, val) => {
    const nuove = [...datePrestabilite];
    nuove[idx] = val;
    modificaPacchetto(pk.id, { datePrestabilite: nuove });
  };

  const togglePagato = () => {
    const nowPagato = eNonPagato(pk.pagato);
    modificaPacchetto(pk.id, { pagato: nowPagato, dataPagamento: nowPagato ? new Date().toISOString().slice(0, 10) : null });
  };

  const elimina = () => {
    confirmAction(`Eliminare il pacchetto di ${pk.nome}? L'azione non è reversibile.`, () => {
      rimuoviPacchetto(pk.id);
      setView({ page: "pacchetti" });
    });
  };

  if (modalitaCliente) {
    return (
      <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
        {printStyle}
        <Menu />
        <div className="no-print" style={{ maxWidth: 700, margin: "0 auto", padding: "14px 40px", display: "flex", justifyContent: "space-between" }}>
          <button onClick={() => setModalitaCliente(false)} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: textPrimary, fontSize: 15, fontWeight: 600, cursor: "pointer", padding: 0 }}>
            <span style={{ fontSize: 18, lineHeight: 1 }}>←</span> Torna al pacchetto
          </button>
          <button onClick={handlePrint} style={primaryBtn}>🖨️ Stampa / Esporta PDF</button>
        </div>
        <div id="print-area" style={{ maxWidth: 700, margin: "0 auto", padding: "30px 40px 60px", background: "#fff", color: "#1a1a1a" }}>
          <div style={{ textAlign: "center", marginBottom: 28 }}>
            <img src={settings.logoCustom || LOGO} alt="logo" style={{ width: 90, height: 90, borderRadius: 14, objectFit: "cover", marginBottom: 10 }} />
            <p style={{ margin: 0, fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, color: "#333" }}>MB Goalkeeper Academy Gest</p>
          </div>
          <h1 style={{ fontSize: 22, textAlign: "center", margin: "0 0 4px", color: "#111" }}>Programma allenamenti</h1>
          <p style={{ textAlign: "center", fontSize: 16, color: "#444", margin: "0 0 24px" }}>{pk.nome}</p>

          <div style={{ border: "1px solid #ddd", borderRadius: 10, padding: 16, marginBottom: 20 }}>
            <p style={{ margin: 0, fontSize: 13, color: "#777", fontWeight: 700, textTransform: "uppercase" }}>
              Sedute previste{pk.tipo === "speciale" ? ` · ${pk.oreTotali || (pk.pianificazione || []).reduce((s, x) => s + (Number(x.durata) || 0), 0)} ore totali` : ""}
            </p>
            {pk.tipo === "speciale" ? (
              (pk.pianificazione || []).map((s, i) => (
                <p key={i} style={{ fontSize: 15, margin: "6px 0", color: "#222" }}>
                  {pk.sedute.includes(s.data) ? "✅" : "⬜"} Seduta {i + 1}: <strong>{formatData(s.data)} – {s.durata} {s.durata === 1 ? "ora" : "ore"}</strong>
                </p>
              ))
            ) : (
              <>
                {datePrestabilite.length === 0 && <p style={{ fontSize: 14, color: "#555" }}>Nessuna data ancora programmata.</p>}
                {datePrestabilite.map((d, i) => (
                  <p key={i} style={{ fontSize: 15, margin: "6px 0", color: "#222" }}>
                    {pk.sedute.includes(d) ? "✅" : "⬜"} Seduta {i + 1}: <strong>{formatData(d)}{pk.orario ? ` – ${pk.orario}` : ""}</strong>
                  </p>
                ))}
              </>
            )}
          </div>

          <div style={{ border: "1px solid #ddd", borderRadius: 10, padding: 16 }}>
            <p style={{ margin: 0, fontSize: 13, color: "#777", fontWeight: 700, textTransform: "uppercase" }}>Pagamento</p>
            {pk.importoTotale ? (
              <p style={{ fontSize: 15, margin: "6px 0", color: "#222" }}>Importo totale: <strong>€{Number(pk.importoTotale).toFixed(2)}</strong></p>
            ) : null}
            <p style={{ fontSize: 15, margin: "6px 0", color: pk.pagato === true ? "#1f9d55" : "#c9522f", fontWeight: 700 }}>
              {pk.pagato === true ? "✅ Saldato" : "⏳ Da saldare"}
            </p>
            {pk.metodoPagamento && <p style={{ fontSize: 14, margin: "6px 0", color: "#444" }}>Metodo: {pk.metodoPagamento}</p>}
          </div>

          <p style={{ textAlign: "center", fontSize: 12, color: "#999", marginTop: 30 }}>Documento generato da MB Goalkeeper Academy Gest</p>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div className="no-print" style={{ position: "sticky", top: 0, zIndex: 10, background: bg, borderBottom: `1px solid ${border}` }}>
        <div style={{ maxWidth: 1400, margin: "0 auto", padding: "14px 40px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button
              onClick={() => setView({ page: "lista" })}
              title="Torna alla home"
              style={{ background: surface2, color: textPrimary, border: `1px solid ${border}`, borderRadius: 10, width: 36, height: 36, fontSize: 16, cursor: "pointer" }}
            >
              🏠
            </button>
            <button
              onClick={goBack}
              style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: textPrimary, fontSize: 15, fontWeight: 600, cursor: "pointer", padding: 0 }}
            >
              <span style={{ fontSize: 18, lineHeight: 1 }}>←</span> Indietro
            </button>
          </div>
          <button onClick={elimina} style={{ background: "none", border: `1px solid ${coral}`, color: coral, borderRadius: 9, padding: "6px 12px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            Elimina pacchetto
          </button>
        </div>
      </div>
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "18px 40px 48px" }}>
        <div style={{ background: surface, border: `1px solid ${insoluto ? coral : borderStrong}`, borderRadius: 18, padding: 22, marginBottom: 18 }}>
          <p style={{ fontSize: 24, fontWeight: 700, textTransform: "uppercase", margin: 0, color: textPrimary }}>{pk.nome}</p>
          <p style={{ fontSize: 14, color: textSecondary, margin: "5px 0 0" }}>Pacchetto dal {formatData(pk.dataInizio)}</p>
          <p style={{ fontSize: 14, color: goldSoft, margin: "10px 0 0", fontWeight: 600 }}>
            {fatte} / {pk.numeroSedute} sedute {completo ? "· completato" : ""}
          </p>
          {pk.importoTotale ? (
            <p style={{ fontSize: 14, color: sky, margin: "6px 0 0", fontWeight: 600 }}>
              €{Number(pk.importoTotale).toFixed(2)} totale · €{(Number(pk.importoTotale) / pk.numeroSedute).toFixed(2)} a seduta
            </p>
          ) : null}

          {completo && !pk.rinnovato && (
            <div className="no-print" style={{ marginTop: 14, padding: "12px 14px", borderRadius: 10, background: pitchDim, border: `1px solid ${pitch}` }}>
              <p style={{ margin: 0, fontSize: 13, color: pitch, fontWeight: 700 }}>Questo pacchetto è concluso — vuoi rinnovarlo?</p>
              <p style={{ margin: "4px 0 10px", fontSize: 12, color: textMuted }}>
                Il nuovo pacchetto riprenderà dallo stesso giorno della settimana ({pk.orario ? `ore ${pk.orario}` : "stesso orario"}), potrai comunque modificare le date prima di salvare.
              </p>
              <button
                onClick={() => {
                  const tutteLeDate = [...(datePrestabilite.length ? datePrestabilite : pk.sedute)].sort();
                  const ultima = tutteLeDate[tutteLeDate.length - 1] || pk.dataInizio;
                  const prossima = new Date(ultima);
                  prossima.setDate(prossima.getDate() + 7);
                  setView({
                    page: "pacchetti",
                    rinnovoDa: {
                      portiereId: pk.portiereId,
                      orario: pk.orario || "17:00",
                      numeroSedute: pk.numeroSedute,
                      dataInizio: prossima.toISOString().slice(0, 10),
                      idVecchio: pk.id,
                    },
                  });
                }}
                style={{ background: pitch, color: "#fff", border: "none", borderRadius: 9, padding: "8px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
              >
                🔄 Rinnova pacchetto
              </button>
            </div>
          )}
          {completo && pk.rinnovato && (
            <p style={{ margin: "10px 0 0", fontSize: 12, color: textMuted }}>✅ Già rinnovato</p>
          )}

          {pk.tipo === "speciale" && pk.pianificazione && (
            <div style={{ marginTop: 14, padding: "12px 14px", borderRadius: 10, background: lillaDim, border: `1px solid ${lilla}` }}>
              <p style={{ margin: "0 0 8px", fontSize: 13, color: lilla, fontWeight: 700 }}>
                ⭐ Pacchetto speciale · {pk.oreTotali || pk.pianificazione.reduce((s, x) => s + (Number(x.durata) || 0), 0)} ore totali
              </p>
              {pk.pianificazione.map((s, i) => {
                const svolta = pk.sedute.includes(s.data);
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "5px 0" }}>
                    <span style={{ fontSize: 13, color: textPrimary }}>
                      {i + 1}. {formatData(s.data)} — {s.durata} {s.durata === 1 ? "ora" : "ore"}
                    </span>
                    <button
                      className="no-print"
                      onClick={() => {
                        if (svolta) {
                          rimuoviSeduta(pk.id, pk.sedute.indexOf(s.data));
                        } else {
                          aggiungiSeduta(pk.id, s.data);
                        }
                      }}
                      style={{
                        flexShrink: 0,
                        fontSize: 11,
                        fontWeight: 700,
                        padding: "4px 9px",
                        borderRadius: 7,
                        cursor: "pointer",
                        border: svolta ? "1px solid #1f9d55" : `1px solid ${border}`,
                        background: svolta ? "rgba(31,157,85,0.12)" : surface2,
                        color: svolta ? "#1f9d55" : textMuted,
                      }}
                    >
                      {svolta ? "✅ Svolta" : "Segna svolta"}
                    </button>
                  </div>
                );
              })}
            </div>
          )}

          <div className="no-print" style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <button
              onClick={togglePagato}
              style={{
                background: pk.pagato === true ? "rgba(31,157,85,0.12)" : coralDim,
                color: pk.pagato === true ? "#1f9d55" : coral,
                border: `1px solid ${pk.pagato === true ? "#1f9d55" : coral}`,
                borderRadius: 9,
                padding: "8px 14px",
                fontSize: 13,
                fontWeight: 700,
                cursor: "pointer",
              }}
            >
              {eDavveroPagato(pk.pagato) ? "✅ Saldato" : "⏳ Segna come saldato"}
            </button>
            {insoluto && <span style={{ fontSize: 12, color: coral, fontWeight: 700 }}>⚠️ INSOLUTO</span>}
          </div>

          <div className="no-print" style={{ marginTop: 14, maxWidth: 260 }}>
            <label style={labelStyle}>Portiere</label>
            <SelettorePortiere
              portieri={portieri}
              value={pk.portiereId || ""}
              onChange={(v) => {
                const nuovoPortiere = portieri.find((p) => String(p.id) === v);
                modificaPacchetto(pk.id, { portiereId: v, nome: nuovoPortiere ? nuovoPortiere.nome : pk.nome });
              }}
            />
          </div>

          <div className="no-print" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 12, maxWidth: 260 }}>
            <div>
              <label style={labelStyle}>Data 1ª seduta</label>
              <input style={inputStyle} type="date" value={pk.dataInizio || ""} onChange={(e) => modificaPacchetto(pk.id, { dataInizio: e.target.value })} />
            </div>
            <div>
              <label style={labelStyle}>Numero sedute</label>
              <select
                style={inputStyle}
                value={pk.numeroSedute || 4}
                onChange={(e) => modificaPacchetto(pk.id, { numeroSedute: Number(e.target.value) })}
              >
                {[2, 3, 4, 5, 6, 7, 8, 9, 10].map((n) => (
                  <option key={n} value={n}>{n} sedute</option>
                ))}
              </select>
            </div>
          </div>

          <div className="no-print" style={{ marginTop: 12, maxWidth: 220 }}>
            <label style={labelStyle}>Importo totale pacchetto (€)</label>
            <input
              style={inputStyle}
              type="number"
              step="0.01"
              value={pk.importoTotale || ""}
              placeholder="—"
              onChange={(e) => modificaPacchetto(pk.id, { importoTotale: e.target.value ? Number(e.target.value) : null })}
            />
          </div>

          <div className="no-print" style={{ marginTop: 14, maxWidth: 220 }}>
            <label style={labelStyle}>Giorno del saldo</label>
            <input
              style={inputStyle}
              type="date"
              value={pk.dataScadenzaSaldo || pk.dataInizio}
              onChange={(e) => modificaPacchetto(pk.id, { dataScadenzaSaldo: e.target.value })}
            />
          </div>

          <div className="no-print" style={{ marginTop: 12, maxWidth: 220 }}>
            <label style={labelStyle}>Orario delle sedute</label>
            <input
              style={inputStyle}
              type="time"
              value={pk.orario || ""}
              onChange={(e) => modificaPacchetto(pk.id, { orario: e.target.value || null })}
            />
          </div>
          {pk.orario && (
            <p className="print-only-block" style={{ display: "none", fontSize: 13, color: textMuted, margin: "8px 0 0" }}>
              Orario: {pk.orario}
            </p>
          )}

          <div className="no-print" style={{ marginTop: 12, maxWidth: 220 }}>
            <label style={labelStyle}>Metodo di pagamento</label>
            <select
              style={inputStyle}
              value={pk.metodoPagamento || ""}
              onChange={(e) => modificaPacchetto(pk.id, { metodoPagamento: e.target.value || null })}
            >
              <option value="">— non specificato —</option>
              {OPTS.metodoPagamento.map((m) => (
                <option key={m} value={m}>{m}</option>
              ))}
            </select>
          </div>
          {pk.metodoPagamento && (
            <p className="print-only-block" style={{ display: "none", fontSize: 13, color: textMuted, margin: "8px 0 0" }}>
              Pagamento: {pk.metodoPagamento}
            </p>
          )}
        </div>

        {datePrestabilite.length > 0 && (
          <div style={{ ...cardStyle }}>
            <p style={sectionLabelStyle}>🗓️ Date prestabilite</p>
            {datePrestabilite.map((d, i) => {
              const svolta = pk.sedute.includes(d);
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "6px 0", borderTop: i > 0 ? `1px solid ${border}` : "none" }}>
                  {editIdxPrestabilita === i ? (
                    <input style={inputStyle} type="date" value={d} onChange={(e) => salvaDataPrestabilita(i, e.target.value)} onBlur={() => setEditIdxPrestabilita(null)} autoFocus />
                  ) : (
                    <button onClick={() => setEditIdxPrestabilita(i)} style={{ background: "none", border: "none", color: textSecondary, fontSize: 14, cursor: "pointer", textAlign: "left" }}>
                      Seduta {i + 1}: {formatData(d)}{pk.orario ? ` alle ${pk.orario}` : ""} ✎
                    </button>
                  )}
                  <button
                    className="no-print"
                    onClick={() => {
                      if (svolta) {
                        rimuoviSeduta(pk.id, pk.sedute.indexOf(d));
                      } else {
                        aggiungiSeduta(pk.id, d);
                      }
                    }}
                    style={{
                      flexShrink: 0,
                      fontSize: 12,
                      fontWeight: 700,
                      padding: "5px 10px",
                      borderRadius: 8,
                      cursor: "pointer",
                      border: svolta ? "1px solid #1f9d55" : `1px solid ${border}`,
                      background: svolta ? "rgba(31,157,85,0.12)" : surface2,
                      color: svolta ? "#1f9d55" : textMuted,
                    }}
                  >
                    {svolta ? "✅ Svolta" : "Segna svolta"}
                  </button>
                </div>
              );
            })}
          </div>
        )}

        <div className="no-print" style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16 }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare(`Pacchetto ${pk.nome}`, `Pacchetto ${pk.nome}: ${fatte}/${pk.numeroSedute} sedute svolte`)} />
          <button onClick={() => setModalitaCliente(true)} style={{ ...ghostBtn, display: "flex", alignItems: "center", gap: 6 }}>
            📄 Programma per il cliente
          </button>
        </div>

        <p style={sectionLabelStyle}>📅 Sedute svolte</p>
        <div style={cardStyle}>
          {pk.sedute.length === 0 && <p style={{ fontSize: 13, color: textMuted, margin: 0 }}>Nessuna seduta ancora registrata.</p>}
          {pk.sedute.map((data, idx) => {
            if (editIdx === idx) {
              return (
                <div key={idx} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderTop: idx > 0 ? `1px solid ${border}` : "none" }}>
                  <span style={{ fontSize: 14, color: textPrimary, flexShrink: 0 }}>Seduta {idx + 1}</span>
                  <input style={{ ...inputStyle, width: 160 }} type="date" value={editData} onChange={(e) => setEditData(e.target.value)} />
                  <button onClick={() => salvaEditSeduta(idx)} style={{ ...primaryBtn, padding: "6px 12px", fontSize: 13 }}>Salva</button>
                  <button onClick={() => setEditIdx(null)} style={ghostBtn}>Annulla</button>
                </div>
              );
            }
            return (
              <div key={idx} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderTop: idx > 0 ? `1px solid ${border}` : "none" }}>
                <span style={{ fontSize: 14, color: textPrimary }}>Seduta {idx + 1} · {formatData(data)}</span>
                <span className="no-print" style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => startEditSeduta(idx, data)} style={{ background: "none", border: "none", color: textMuted, fontSize: 14, cursor: "pointer" }}>✎</button>
                  <button onClick={() => rimuoviSeduta(pk.id, idx)} style={{ background: "none", border: "none", color: textMuted, fontSize: 16, cursor: "pointer" }}>×</button>
                </span>
              </div>
            );
          })}
        </div>

        {!completo && (
          <div className="no-print" style={{ ...cardStyle, display: "flex", gap: 10, alignItems: "flex-end" }}>
            <div style={{ flex: 1 }}>
              <label style={labelStyle}>Aggiungi seduta</label>
              <input style={inputStyle} type="date" value={nuovaData} onChange={(e) => setNuovaData(e.target.value)} />
            </div>
            <button onClick={submit} disabled={!nuovaData} style={{ ...primaryBtn, opacity: nuovaData ? 1 : 0.5, cursor: nuovaData ? "pointer" : "not-allowed" }}>
              Aggiungi
            </button>
          </div>
        )}
      </div>
    </div>
  );
}


const App = () => {
  const search = typeof window !== "undefined" ? window.location.search : "";
  if (search.includes("iscrizione=1")) return <ModuloIscrizione />;
  if (search.includes("verifica=1")) return <ModuloVerificaPeriodica />;
  return <GestionalePortieri />;
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  (function() {
    var src = document.getElementById("app-source").textContent;

    // Calcolo un'impronta veloce del codice sorgente, per sapere se è cambiato dall'ultima
    // apertura. Se è la stessa di prima, riuso il codice già compilato salvato nel browser,
    // saltando il passaggio più lento (la compilazione), che altrimenti si ripete identico
    // ad ogni apertura anche se il codice non è cambiato per niente.
    function impronta(str) {
      var h = 5381;
      for (var i = 0; i < str.length; i++) {
        h = ((h << 5) + h + str.charCodeAt(i)) | 0;
      }
      return String(h) + "_" + str.length;
    }

    var out = null;
    var chiaveImpronta = "gest-mb-babel-impronta-v1";
    var chiaveCodice = "gest-mb-babel-cache-v1";
    var impronaAttuale = impronta(src);

    try {
      var impronaSalvata = localStorage.getItem(chiaveImpronta);
      if (impronaSalvata === impronaAttuale) {
        out = localStorage.getItem(chiaveCodice);
      }
    } catch (e) {}

    if (!out) {
      out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      try {
        localStorage.setItem(chiaveImpronta, impronaAttuale);
        localStorage.setItem(chiaveCodice, out);
      } catch (e) {}
    }

    var s = document.createElement("script");
    s.text = out;
    document.body.appendChild(s);
  })();
</script>
