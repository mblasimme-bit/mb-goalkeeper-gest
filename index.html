function CalendarioSedute({ entrate, portieri, pacchetti, modificaEntrata, rimuoviEntrata, confirmAction, setView }) {
  const [meseRef, setMeseRef] = useState(() => oggiISO().slice(0, 7));
  const [giornoSel, setGiornoSel] = useState(null);
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({});

  const oggi = oggiISO();
  const [annoStr, meseStr] = meseRef.split("-");
  const anno = Number(annoStr);
  const meseIdx = Number(meseStr) - 1;

  const primoGiorno = new Date(anno, meseIdx, 1);
  const numGiorni = new Date(anno, meseIdx + 1, 0).getDate();
  const weekdayJs = primoGiorno.getDay();
  const leadingBlanks = (weekdayJs + 6) % 7;

  const entratePerGiorno = useMemo(() => {
    const map = {};
    (entrate || []).forEach((e) => {
      if (!e.data) return;
      if (!map[e.data]) map[e.data] = [];
      map[e.data].push(e);
    });
    return map;
  }, [entrate]);

  const pacchettiPerGiorno = useMemo(() => {
    const map = {};
    (pacchetti || []).forEach((pk) => {
      const date = pk.tipo === "speciale" ? (pk.pianificazione || []).map((s) => s.data) : (pk.datePrestabilite || []);
      date.forEach((d) => {
        if (!d) return;
        if (!map[d]) map[d] = [];
        map[d].push(pk);
      });
    });
    return map;
  }, [pacchetti]);

  const cambiaMese = (delta) => {
    const d = new Date(anno, meseIdx + delta, 1);
    setMeseRef(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
    setGiornoSel(null);
    setEditId(null);
  };

  const giorni = [];
  for (let i = 0; i < leadingBlanks; i++) giorni.push(null);
  for (let d = 1; d <= numGiorni; d++) giorni.push(d);

  const startEdit = (e) => {
    setEditId(e.id);
    setEditForm({ importo: e.importo, note: e.note || "", portiereId: e.portiereId != null ? String(e.portiereId) : "", metodoPagamento: e.metodoPagamento || "" });
  };

  const salvaEdit = (e) => {
    modificaEntrata(e.id, {
      importo: Number(editForm.importo) || 0,
      note: editForm.note,
      portiereId: editForm.portiereId ? Number(editForm.portiereId) : null,
      metodoPagamento: editForm.metodoPagamento || null,
    });
    setEditId(null);
  };

  const eliminaSeduta = (e) => {
    confirmAction("Eliminare questa seduta registrata?", () => rimuoviEntrata(e.id));
  };

  const sedimeGiorno = giornoSel ? entratePerGiorno[giornoSel] || [] : [];
  const pacchettiGiorno = giornoSel ? pacchettiPerGiorno[giornoSel] || [] : [];
  const nomeMese = `${MESI[meseIdx]} ${anno}`;

  return (
    <div className="no-print" style={{ ...cardStyle }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <p style={{ margin: 0, fontSize: 17, fontWeight: 700, color: textPrimary }}>📅 Calendario sedute</p>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button onClick={() => cambiaMese(-1)} style={{ ...ghostBtn, padding: "6px 12px", fontSize: 15 }}>‹</button>
          <span style={{ fontSize: 15, color: textSecondary, minWidth: 130, textAlign: "center", textTransform: "capitalize", fontWeight: 600 }}>{nomeMese}</span>
          <button onClick={() => cambiaMese(1)} style={{ ...ghostBtn, padding: "6px 12px", fontSize: 15 }}>›</button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 14, marginBottom: 10, fontSize: 11, color: textMuted }}>
        <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#1f9d55", marginRight: 4 }} />seduta registrata</span>
        <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: sky, marginRight: 4 }} />seduta pacchetto programmata</span>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: giornoSel ? 16 : 0 }}>
        {["L", "M", "M", "G", "V", "S", "D"].map((g, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 12, color: textMuted, fontWeight: 700 }}>{g}</div>
        ))}
        {giorni.map((d, i) => {
          if (d === null) return <div key={"b" + i} />;
          const dataStr = `${anno}-${String(meseIdx + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const sessioni = entratePerGiorno[dataStr] || [];
          const countPk = (pacchettiPerGiorno[dataStr] || []).length;
          const isOggi = dataStr === oggi;
          const isSel = dataStr === giornoSel;
          const totaleGiorno = sessioni.reduce((s, e) => s + (Number(e.importo) || 0), 0);
          const tuttiPagati = sessioni.length > 0 && sessioni.every((e) => eDavveroPagato(e.pagato));
          return (
            <button
              key={dataStr}
              onClick={() => { setGiornoSel(isSel ? null : dataStr); setEditId(null); }}
              style={{
                position: "relative",
                minHeight: 74,
                display: "flex",
                flexDirection: "column",
                alignItems: "stretch",
                padding: "5px 4px",
                border: isSel ? `2px solid var(--accent-color, ${gold})` : isOggi ? `1px solid ${goldSoft}` : `1px solid ${border}`,
                borderRadius: 10,
                background: sessioni.length > 0 ? "rgba(31,157,85,0.10)" : countPk > 0 ? skyDim : "transparent",
                color: textPrimary,
                cursor: "pointer",
                overflow: "hidden",
              }}
            >
              <span style={{ fontSize: 13, fontWeight: isOggi ? 700 : 500, textAlign: "left" }}>{d}</span>
              {sessioni.length > 0 && (
                <div style={{ textAlign: "left", marginTop: 1 }}>
                  {sessioni.slice(0, 2).map((e, idx) => {
                    const pp = e.portiereId != null ? portieri.find((x) => String(x.id) === String(e.portiereId)) : null;
                    return (
                      <p key={idx} style={{ margin: 0, fontSize: 9.5, lineHeight: 1.25, color: textPrimary, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                        {pp ? pp.nome : "—"}
                      </p>
                    );
                  })}
                  {sessioni.length > 2 && (
                    <p style={{ margin: 0, fontSize: 9, color: textMuted }}>+{sessioni.length - 2} altri</p>
                  )}
                </div>
              )}
              {sessioni.length > 0 ? (
                <p style={{ margin: "auto 0 0", fontSize: 9.5, fontWeight: 700, color: tuttiPagati ? "#1f9d55" : coral, textAlign: "left" }}>
                  €{totaleGiorno.toFixed(0)}
                </p>
              ) : countPk > 0 ? (
                <p style={{ margin: "auto 0 0", fontSize: 9, color: sky, textAlign: "left" }}>{countPk} programmata/e</p>
              ) : null}
            </button>
          );
        })}
      </div>
      {giornoSel && (
        <div style={{ borderTop: `1px solid ${border}`, paddingTop: 12 }}>
          <p style={{ margin: "0 0 8px", fontSize: 15, fontWeight: 700, color: textPrimary }}>{formatData(giornoSel)}</p>
          {sedimeGiorno.length === 0 && pacchettiGiorno.length === 0 && (
            <p style={{ fontSize: 13, color: textMuted, margin: 0 }}>Nessuna seduta questo giorno.</p>
          )}
          {pacchettiGiorno.length > 0 && (
            <div style={{ marginBottom: 10 }}>
              <p style={{ margin: "0 0 4px", fontSize: 11, color: sky, fontWeight: 700, textTransform: "uppercase" }}>Sedute pacchetto programmate</p>
              {pacchettiGiorno.map((pk) => (
                <button
                  key={pk.id}
                  onClick={() => setView && setView({ page: "pacchetto-dettaglio", id: pk.id })}
                  style={{ display: "flex", justifyContent: "space-between", width: "100%", background: "none", border: "none", padding: "6px 0", borderTop: `1px solid ${border}`, fontSize: 13, color: textSecondary, cursor: "pointer", textAlign: "left" }}
                >
                  <span>{pk.nome}{pk.orario ? ` · ${pk.orario}` : ""}</span>
                  <span style={{ color: sky }}>›</span>
                </button>
              ))}
            </div>
          )}
          {sedimeGiorno.length > 0 && <p style={{ margin: "0 0 4px", fontSize: 11, color: "#1f9d55", fontWeight: 700, textTransform: "uppercase" }}>Sedute registrate</p>}
          {sedimeGiorno.map((e, i) => {
            const p = e.portiereId != null ? portieri.find((pp) => String(pp.id) === String(e.portiereId)) : null;
            if (editId === e.id) {
              return (
                <div key={e.id} style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", padding: "6px 0", borderTop: i > 0 ? `1px solid ${border}` : "none" }}>
                  <input style={{ ...inputStyle, width: 100 }} type="number" step="0.01" value={editForm.importo} onChange={(ev) => setEditForm((f) => ({ ...f, importo: ev.target.value }))} />
                  <SelettorePortiere portieri={portieri} value={editForm.portiereId} onChange={(v) => setEditForm((f) => ({ ...f, portiereId: v }))} consentiVuoto style={{ width: 160 }} />
                  <input style={{ ...inputStyle, flex: 1, minWidth: 120 }} type="text" value={editForm.note} placeholder="Note" onChange={(ev) => setEditForm((f) => ({ ...f, note: ev.target.value }))} />
                  <select style={{ ...inputStyle, width: 160 }} value={editForm.metodoPagamento} onChange={(ev) => setEditForm((f) => ({ ...f, metodoPagamento: ev.target.value }))}>
                    <option value="">— metodo non specificato —</option>
                    {OPTS.metodoPagamento.map((m) => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                  <button onClick={() => salvaEdit(e)} style={{ ...primaryBtn, padding: "6px 14px", fontSize: 13 }}>Salva</button>
                  <button onClick={() => setEditId(null)} style={ghostBtn}>Annulla</button>
                </div>
              );
            }
            return (
              <div key={e.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderTop: i > 0 ? `1px solid ${border}` : "none", fontSize: 13 }}>
                <span style={{ color: textSecondary }}>
                  {p ? p.nome : "— nessun portiere —"}{e.note ? ` · ${e.note}` : ""}{e.fonte ? ` (${e.fonte})` : ""}{e.metodoPagamento ? ` · ${e.metodoPagamento}` : ""}
                </span>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color: "#1f9d55", fontWeight: 600 }}>€{Number(e.importo || 0).toFixed(2)}</span>
                  <button onClick={() => startEdit(e)} style={{ background: "none", border: "none", color: textMuted, fontSize: 13, cursor: "pointer" }}>✎</button>
                  <button onClick={() => eliminaSeduta(e)} style={{ background: "none", border: "none", color: textMuted, fontSize: 16, cursor: "pointer" }}>×</button>
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PaginaContabilita({ spese, guanti, pacchetti, entrate, eventi, sponsorComm, portieri, setView, settings, updateSettings, confirmAction, modificaSpesa, rimuoviSpesa, modificaGuanto, rimuoviGuanto, modificaPacchetto, rimuoviEntrata, modificaEntrata, importaMovimenti, printStyle, Menu, TopBar, handlePrint, handleShare }) {
  const [collapsed, setCollapsed] = useState({});
  const [editKey, setEditKey] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [importMsg, setImportMsg] = useState(null);
  const fileInputRef = useRef(null);
  const verde = "#1f9d55";
  const verdeDim = "rgba(31,157,85,0.12)";
  const nascosti = settings.nascondiImportiContabilita;
  const mostra = (val) => (nascosti ? "••••" : `€${(Number(val) || 0).toFixed(2)}`);

  const [query, setQuery] = useState("");
  const [categoriaAttiva, setCategoriaAttiva] = useState(null);
  const [meseSelezionato, setMeseSelezionato] = useState(() => oggiISO().slice(0, 7));
  const [periodoDa, setPeriodoDa] = useState("");
  const [periodoA, setPeriodoA] = useState("");
  const qNorm = query.trim().toLowerCase();
  const matchesQuery = (text) => !qNorm || (text || "").toLowerCase().includes(qNorm);
  const dentroPeriodo = (data) => (!periodoDa || (data && data >= periodoDa)) && (!periodoA || (data && data <= periodoA));

  const incassiVociAll = useMemo(() => ricavaIncassi(guanti, pacchetti, entrate, eventi, sponsorComm), [guanti, pacchetti, entrate, eventi, sponsorComm]);
  const incassiSettimana = useMemo(() => {
    const d = new Date();
    const wd = (d.getDay() + 6) % 7; // lunedì = 0
    const lunedi = new Date(d);
    lunedi.setDate(d.getDate() - wd);
    const domenica = new Date(lunedi);
    domenica.setDate(lunedi.getDate() + 6);
    const lunediStr = dataLocaleISO(lunedi);
    const domenicaStr = dataLocaleISO(domenica);
    return incassiVociAll
      .filter((v) => v.data && v.data >= lunediStr && v.data <= domenicaStr)
      .reduce((s, v) => s + v.importo, 0);
  }, [incassiVociAll]);
  const incassiVoci = useMemo(() => {
    let list = incassiVociAll;
    if (categoriaAttiva && categoriaAttiva.tipo === "incasso") {
      list = list.filter((v) => v.sourceType === categoriaAttiva.key);
    }
    if (periodoDa || periodoA) list = list.filter((v) => dentroPeriodo(v.data));
    if (!qNorm) return list;
    return list.filter((v) => {
      const p = v.portiereId != null ? portieri.find((pp) => String(pp.id) === String(v.portiereId)) : null;
      const testo = `${v.dettaglio || ""} ${v.note || ""} ${v.fonte || ""} ${p ? p.nome : ""}`;
      return matchesQuery(testo);
    });
  }, [incassiVociAll, qNorm, portieri, categoriaAttiva, periodoDa, periodoA]);
  const speseAll = useMemo(() => {
    const daSpese = spese.map((s) => ({ ...s, sourceType: "spesa" }));
    const daEventi = (eventi || [])
      .filter((ev) => ev.speseReale)
      .map((ev) => ({ id: `evento-${ev.id}`, categoria: "eventi", data: ev.dataInizio, importo: Number(ev.speseReale) || 0, note: ev.titolo, sourceType: "evento-spesa", eventoId: ev.id }));
    return [...daSpese, ...daEventi];
  }, [spese, eventi]);
  const speseFiltrate = useMemo(() => {
    let list = speseAll;
    if (categoriaAttiva && categoriaAttiva.tipo === "spesa") {
      list = list.filter((s) => s.categoria === categoriaAttiva.key);
    }
    if (periodoDa || periodoA) list = list.filter((s) => dentroPeriodo(s.data));
    if (!qNorm) return list;
    return list.filter((s) => matchesQuery(`${s.categoria || ""} ${s.note || ""}`));
  }, [speseAll, qNorm, categoriaAttiva, periodoDa, periodoA]);

  const incassiPerMese = useMemo(() => raggruppaPerMese(incassiVoci, "importo"), [incassiVoci]);
  const spesePerMese = useMemo(() => raggruppaPerMese(speseFiltrate, "importo"), [speseFiltrate]);

  const mesi = useMemo(() => {
    const keys = new Set([...incassiPerMese.map((g) => g.key), ...spesePerMese.map((g) => g.key)]);
    return Array.from(keys)
      .sort((a, b) => b.localeCompare(a))
      .map((key) => {
        const inc = incassiPerMese.find((g) => g.key === key);
        const sp = spesePerMese.find((g) => g.key === key);
        return {
          key,
          label: meseLabel(key),
          incassi: inc ? inc.totale : 0,
          incassiVoci: inc ? inc.items : [],
          spese: sp ? sp.totale : 0,
          spesaVoci: sp ? sp.items : [],
          saldo: (inc ? inc.totale : 0) - (sp ? sp.totale : 0),
        };
      });
  }, [incassiPerMese, spesePerMese]);

  const totIncassi = incassiVoci.reduce((s, v) => s + v.importo, 0);
  const totSpese = speseFiltrate.reduce((s, sp) => s + (Number(sp.importo) || 0), 0);
  const totSaldo = totIncassi - totSpese;

  // Riepilogo per area: mensile (navigabile) + totale complessivo, eventi inclusi nel bilancio.
  const sommaPerPeriodo = (items) => {
    const mese = items.reduce((s, v) => s + (v.data && v.data.slice(0, 7) === meseSelezionato ? Number(v.importo) || 0 : 0), 0);
    const totale = items.reduce((s, v) => s + (Number(v.importo) || 0), 0);
    return { mese, totale };
  };
  const cambiaMeseRiepilogo = (delta) => {
    const [anno, mese] = meseSelezionato.split("-").map(Number);
    const d = new Date(anno, mese - 1 + delta, 1);
    setMeseSelezionato(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };
  const etichettaMeseRiepilogo = (() => {
    const [anno, mese] = meseSelezionato.split("-").map(Number);
    return `${MESI[mese - 1]} ${anno}`;
  })();

  const sommaTipo = (tipo) => sommaPerPeriodo(incassiVociAll.filter((v) => v.sourceType === tipo).map((v) => ({ data: v.data, importo: v.importo })));
  const catSedute = useMemo(() => sommaTipo("manuale"), [incassiVociAll, meseSelezionato]);
  const catPacchetti = useMemo(() => sommaTipo("pacchetto"), [incassiVociAll, meseSelezionato]);
  const catMateriale = useMemo(() => sommaTipo("materiale"), [incassiVociAll, meseSelezionato]);
  const catEventiIncassi = useMemo(() => sommaTipo("evento-incasso"), [incassiVociAll, meseSelezionato]);
  const catSponsor = useMemo(() => sommaTipo("sponsor"), [incassiVociAll, meseSelezionato]);

  const catSpesePerTipo = useMemo(
    () => OPTS.categoriaSpesa.map((cat) => ({ nome: cat, ...sommaPerPeriodo(spese.filter((s) => s.categoria === cat).map((s) => ({ data: s.data, importo: s.importo }))) })),
    [spese, meseSelezionato]
  );
  const catEventiSpese = useMemo(() => sommaPerPeriodo((eventi || []).filter((ev) => ev.speseReale).map((ev) => ({ data: ev.dataInizio, importo: ev.speseReale }))), [eventi, meseSelezionato]);

  const categorieIncassi = [
    { nome: "Sedute singole", key: "manuale", ...catSedute, onClick: () => setCategoriaAttiva({ tipo: "incasso", key: "manuale", label: "Sedute singole" }) },
    { nome: "Pacchetti", key: "pacchetto", ...catPacchetti, onClick: () => setCategoriaAttiva({ tipo: "incasso", key: "pacchetto", label: "Pacchetti" }) },
    { nome: "Materiale", key: "materiale", ...catMateriale, onClick: () => setCategoriaAttiva({ tipo: "incasso", key: "materiale", label: "Materiale" }) },
    { nome: "Eventi (incassi)", key: "evento-incasso", ...catEventiIncassi, onClick: () => setCategoriaAttiva({ tipo: "incasso", key: "evento-incasso", label: "Eventi (incassi)" }) },
    { nome: "Sponsor", key: "sponsor", ...catSponsor, onClick: () => setCategoriaAttiva({ tipo: "incasso", key: "sponsor", label: "Sponsor" }) },
  ];
  const categorieUscite = [
    ...catSpesePerTipo.map((c) => ({
      nome: c.nome.charAt(0).toUpperCase() + c.nome.slice(1),
      key: c.nome,
      mese: c.mese,
      totale: c.totale,
      onClick: () => setCategoriaAttiva({ tipo: "spesa", key: c.nome, label: c.nome.charAt(0).toUpperCase() + c.nome.slice(1) }),
    })),
    { nome: "Eventi (spese)", key: "eventi", ...catEventiSpese, onClick: () => setCategoriaAttiva({ tipo: "spesa", key: "eventi", label: "Eventi (spese)" }) },
  ];

  const riepilogoIncassiMese = categorieIncassi.reduce((s, c) => s + c.mese, 0);
  const riepilogoIncassiTotale = categorieIncassi.reduce((s, c) => s + c.totale, 0);
  const riepilogoUsciteMese = categorieUscite.reduce((s, c) => s + c.mese, 0);
  const riepilogoUsciteTotale = categorieUscite.reduce((s, c) => s + c.totale, 0);
  const riepilogoSaldoMese = riepilogoIncassiMese - riepilogoUsciteMese;
  const riepilogoSaldoTotale = riepilogoIncassiTotale - riepilogoUsciteTotale;

  const startEditIncasso = (v) => {
    setEditKey(`incasso-${v.sourceType}-${v.sourceId}${v.parte ? `-${v.parte}` : ""}`);
    setEditForm({ importo: v.importo, data: v.data, note: v.note || "", portiereId: v.portiereId != null ? String(v.portiereId) : "", metodoPagamento: v.metodoPagamento || "" });
  };

  const salvaEditIncasso = (v) => {
    if (v.sourceType === "materiale") {
      modificaGuanto(v.sourceId, { importo: Number(editForm.importo) || 0, data: editForm.data, note: editForm.note });
    } else if (v.sourceType === "manuale") {
      if (v.parte === "acconto") {
        modificaEntrata(v.sourceId, { acconto: Number(editForm.importo) || 0, dataAcconto: editForm.data, metodoPagamentoAcconto: editForm.metodoPagamento || null });
      } else {
        modificaEntrata(v.sourceId, {
          importo: Number(editForm.importo) || 0,
          data: editForm.data,
          note: editForm.note,
          portiereId: editForm.portiereId ? Number(editForm.portiereId) : null,
          metodoPagamento: editForm.metodoPagamento || null,
        });
      }
    } else {
      if (v.parte === "acconto") {
        modificaPacchetto(v.sourceId, { acconto: Number(editForm.importo) || 0, dataAcconto: editForm.data, metodoPagamentoAcconto: editForm.metodoPagamento || null });
      } else {
        modificaPacchetto(v.sourceId, { importoTotale: Number(editForm.importo) || 0, metodoPagamento: editForm.metodoPagamento || null });
      }
    }
    setEditKey(null);
  };

  const eliminaIncasso = (v) => {
    if (v.parte === "acconto") {
      const msg = "Rimuovere l'acconto registrato? Il resto del pacchetto/seduta non viene toccato.";
      confirmAction(msg, () => {
        if (v.sourceType === "manuale") modificaEntrata(v.sourceId, { acconto: null, dataAcconto: null });
        else modificaPacchetto(v.sourceId, { acconto: null, dataAcconto: null });
      });
      return;
    }
    let msg = "Rimuovere l'importo di questo pacchetto? Il pacchetto in sé resterà, solo l'incasso verrà azzerato.";
    if (v.sourceType === "materiale") msg = "Eliminare questa vendita di materiale?";
    if (v.sourceType === "manuale") msg = "Eliminare questa entrata?";
    confirmAction(msg, () => {
      if (v.sourceType === "materiale") rimuoviGuanto(v.sourceId);
      else if (v.sourceType === "manuale") rimuoviEntrata(v.sourceId);
      else modificaPacchetto(v.sourceId, { importoTotale: null });
    });
  };

  const startEditSpesa = (s) => {
    setEditKey(`spesa-${s.id}`);
    setEditForm({ categoria: s.categoria, data: s.data, importo: s.importo, note: s.note || "", metodoPagamento: s.metodoPagamento || "" });
  };

  const salvaEditSpesa = (s) => {
    modificaSpesa(s.id, { categoria: editForm.categoria, data: editForm.data, importo: Number(editForm.importo) || 0, note: editForm.note, metodoPagamento: editForm.metodoPagamento || null });
    setEditKey(null);
  };

  const eliminaSpesa = (s) => {
    confirmAction("Eliminare questa spesa?", () => rimuoviSpesa(s.id));
  };

  const normalizzaCategoria = (raw) => {
    if (!raw) return "materiale tecnico";
    const r = String(raw).trim().toLowerCase();
    const match = OPTS.categoriaSpesa.find((c) => c === r || r.includes(c) || c.includes(r));
    return match || "materiale tecnico";
  };

  const parseData = (raw) => {
    if (raw instanceof Date) return raw.toISOString().slice(0, 10);
    if (typeof raw === "number") {
      // seriale data Excel
      const d = new Date(Math.round((raw - 25569) * 86400 * 1000));
      return d.toISOString().slice(0, 10);
    }
    const s = String(raw || "").trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    return "";
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = window.XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = window.XLSX.utils.sheet_to_json(sheet, { defval: "" });

        const nuoveSpese = [];
        const nuoveEntrate = [];
        let scartate = 0;

        rows.forEach((row) => {
          const keys = Object.keys(row).reduce((acc, k) => ({ ...acc, [k.trim().toLowerCase()]: row[k] }), {});
          const tipoRaw = String(keys.tipo || "").trim().toLowerCase();
          const importo = Number(keys.importo);
          const data = parseData(keys.data);
          const note = keys.note || keys.dettaglio || "";
          if (!importo || !data) {
            scartate++;
            return;
          }
          if (tipoRaw.startsWith("entrat") || tipoRaw.startsWith("incass")) {
            nuoveEntrate.push({ data, importo, note });
          } else {
            nuoveSpese.push({ categoria: normalizzaCategoria(keys.categoria), data, importo, note });
          }
        });

        importaMovimenti(nuoveSpese, nuoveEntrate);
        setImportMsg(`Importate ${nuoveSpese.length + nuoveEntrate.length} righe (${nuoveSpese.length} spese, ${nuoveEntrate.length} entrate)${scartate ? `, ${scartate} scartate (data o importo mancante)` : ""}.`);
      } catch (err) {
        setImportMsg("Errore nella lettura del file. Controlla che sia un .xlsx o .csv con colonne Tipo, Categoria, Data, Importo, Note.");
      }
      e.target.value = "";
    };
    reader.readAsArrayBuffer(file);
  };

  const iconBtn = { background: "none", border: "none", color: textMuted, fontSize: 13, cursor: "pointer", padding: "2px 4px" };

                    if (editKey === key) {

                          <select style={{ ...inputStyle, width: 150 }} value={editForm.metodoPagamento} onChange={(e) => setEditForm((f) => ({ ...f, metodoPagamento: e.target.value }))}>

                          </select>
                          <input style={{ ...inputStyle, flex: 1, minWidth: 120 }} type="text" value={editForm.note} placeholder="Note" onChange={(e) => setEditForm((f) => ({ ...f, note: e.target.value }))} />
                          <button onClick={() => salvaEditSpesa(v)} style={{ ...primaryBtn, padding: "6px 14px", fontSize: 13 }}>Salva</button>
                          <button onClick={() => setEditKey(null)} style={ghostBtn}>Annulla</button>
                        </div>
                      );
                    }
                    return (
                      <div key={key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderTop: `1px solid ${border}`, fontSize: 13 }}>
                        <span style={{ color: c ? c.fg : textSecondary, textTransform: "capitalize" }}>
                          {v.sourceType === "evento-spesa" ? "🗓️ Evento" : v.categoria}{v.metodoPagamento ? ` (${v.metodoPagamento})` : ""}{v.note ? `: ${v.note}` : ""}
                        </span>
                        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ color: coral, fontWeight: 600 }}>{nascosti ? "••••" : `−€${Number(v.importo).toFixed(2)}`}</span>
                          {v.sourceType === "evento-spesa" ? (
                            <button className="no-print" onClick={() => setView({ page: "eventi" })} style={iconBtn} title="Modifica dalla pagina Eventi">✎</button>
                          ) : (
                            <>
                              <button className="no-print" onClick={() => startEditSpesa(v)} style={iconBtn}>✎</button>
                              <button className="no-print" onClick={() => eliminaSpesa(v)} style={iconBtn}>×</button>
                            </>
                          )}
                        </span>
                      </div>
                    );
                  })}
                  {m.incassiVoci.length === 0 && m.spesaVoci.length === 0 && (
                    <p style={{ fontSize: 13, color: textMuted, margin: 0 }}>Nessun movimento.</p>

            </div>

        })}
        {mesi.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 15, padding: "40px 0" }}>Nessun movimento registrato.</p>}
      </div>
    </div>
  );

const VIOLA = "#7a4fa0";
const VIOLA_DIM = "rgba(122,79,160,0.12)";

function PaginaEventi({ eventi, aggiungiEvento, modificaEvento, rimuoviEvento, confirmAction, Menu, TopBar, saveState, printStyle, handlePrint, handleShare }) {
  const vuoto = {
    titolo: "", tipo: "interno",
    dataInizio: "", oraInizio: "", dataFine: "", oraFine: "", luogo: "",
    preventivoSpesa: "", preventivoIncasso: "",
    incassoReale: "", speseReale: "",
    materialeDaPortare: "", materialeDaRichiedere: "",
    note: "",
  };
  const [form, setForm] = useState(vuoto);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);

  const submit = () => {
    if (!form.titolo.trim() || !form.dataInizio) return;
    aggiungiEvento({ ...form, titolo: form.titolo.trim() });
    setForm(vuoto);
    setShowForm(false);
  };

  const startEdit = (ev) => {
    setEditId(ev.id);
    setForm({ ...vuoto, ...ev });
  };

  const salvaEdit = () => {
    modificaEvento(editId, { ...form, titolo: form.titolo.trim() });
    setEditId(null);
    setForm(vuoto);
  };

  const oggi = oggiISO();
  const ordinati = [...eventi].sort((a, b) => (a.dataInizio || "").localeCompare(b.dataInizio || ""));
  const prossimi = ordinati.filter((e) => e.dataInizio >= oggi);
  const passati = ordinati.filter((e) => e.dataInizio < oggi).reverse();

  const periodo = (ev) => {
    let s = formatData(ev.dataInizio);
    if (ev.oraInizio) s += ` ${ev.oraInizio}`;
    if (ev.dataFine && ev.dataFine !== ev.dataInizio) s += ` → ${formatData(ev.dataFine)}${ev.oraFine ? ` ${ev.oraFine}` : ""}`;
    else if (ev.oraFine) s += ` - ${ev.oraFine}`;
    return s;
  };

  const Riga = ({ ev, passato }) => {
    if (editId === ev.id) {
      return (
        <div style={{ ...cardStyle, marginBottom: 10 }}>
          <FormEvento form={form} setForm={setForm} />
          <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
            <button onClick={salvaEdit} disabled={!form.titolo.trim() || !form.dataInizio} style={{ ...primaryBtn, opacity: form.titolo.trim() && form.dataInizio ? 1 : 0.5 }}>Salva</button>
            <button onClick={() => { setEditId(null); setForm(vuoto); }} style={ghostBtn}>Annulla</button>
          </div>
        </div>
      );
    }
    const margine = (Number(ev.preventivoIncasso) || 0) - (Number(ev.preventivoSpesa) || 0);
    return (
      <div style={{ ...cardStyle, marginBottom: 10, opacity: passato ? 0.65 : 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: textPrimary }}>{ev.titolo}</p>
              <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 100, textTransform: "uppercase", color: ev.tipo === "esterno" ? sky : VIOLA, background: ev.tipo === "esterno" ? skyDim : VIOLA_DIM }}>
                {ev.tipo === "esterno" ? "Esterno" : "Interno"}
              </span>
            </div>
            <p style={{ margin: "3px 0 0", fontSize: 13, color: textMuted }}>
              {periodo(ev)}{ev.luogo ? ` · ${ev.luogo}` : ""}
            </p>
            {(ev.preventivoSpesa || ev.preventivoIncasso) ? (
              <p style={{ margin: "6px 0 0", fontSize: 13 }}>
                <span style={{ color: textMuted, fontSize: 11 }}>Preventivo: </span>
                {ev.preventivoIncasso ? <span style={{ color: "#1f9d55", fontWeight: 600 }}>+€{Number(ev.preventivoIncasso).toFixed(2)} </span> : null}
                {ev.preventivoSpesa ? <span style={{ color: coral, fontWeight: 600 }}>−€{Number(ev.preventivoSpesa).toFixed(2)} </span> : null}
                {(ev.preventivoSpesa || ev.preventivoIncasso) && <span style={{ color: margine >= 0 ? "#1f9d55" : coral }}>(margine €{margine.toFixed(2)})</span>}
              </p>
            ) : null}
            {(ev.incassoReale || ev.speseReale) ? (
              <p style={{ margin: "4px 0 0", fontSize: 13 }}>
                <span style={{ color: goldSoft, fontSize: 11 }}>Consuntivo (in bilancio): </span>
                {ev.incassoReale ? <span style={{ color: "#1f9d55", fontWeight: 700 }}>+€{Number(ev.incassoReale).toFixed(2)} </span> : null}
                {ev.speseReale ? <span style={{ color: coral, fontWeight: 700 }}>−€{Number(ev.speseReale).toFixed(2)} </span> : null}
              </p>
            ) : null}
            {ev.materialeDaPortare && <p style={{ margin: "6px 0 0", fontSize: 13, color: textSecondary }}>🎒 Da portare: {ev.materialeDaPortare}</p>}
            {ev.materialeDaRichiedere && <p style={{ margin: "4px 0 0", fontSize: 13, color: textSecondary }}>📋 Da richiedere in loco: {ev.materialeDaRichiedere}</p>}
            {ev.note && <p style={{ margin: "6px 0 0", fontSize: 13, color: textSecondary }}>{ev.note}</p>}
          </div>
          <div className="no-print" style={{ display: "flex", gap: 8, flexShrink: 0 }}>
            <button onClick={() => startEdit(ev)} style={{ background: "none", border: "none", color: textMuted, fontSize: 14, cursor: "pointer" }}>✎</button>
            <button onClick={() => confirmAction("Eliminare questo evento?", () => rimuoviEvento(ev.id))} style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer" }}>×</button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Eventi" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 0" }}>{eventi.length} eventi · {prossimi.length} in programma</p>

        <div className="no-print" style={{ margin: "16px 0" }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare("Eventi", `${eventi.length} eventi registrati, ${prossimi.length} in programma`)} />
        </div>

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
          <button onClick={() => { setShowForm((v) => !v); setForm(vuoto); setEditId(null); }} style={{ background: VIOLA_DIM, color: VIOLA, border: `1px solid ${VIOLA}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
            + Nuovo evento
          </button>
        </div>

        {showForm && (
          <div className="no-print" style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuovo evento</p>
            <FormEvento form={form} setForm={setForm} />
            <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
              <button onClick={submit} disabled={!form.titolo.trim() || !form.dataInizio} style={{ ...primaryBtn, flex: 1, opacity: form.titolo.trim() && form.dataInizio ? 1 : 0.5, cursor: form.titolo.trim() && form.dataInizio ? "pointer" : "not-allowed" }}>
                Salva
              </button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        <p style={sectionLabelStyle}>In programma</p>
        {prossimi.map((ev) => <Riga key={ev.id} ev={ev} />)}
        {prossimi.length === 0 && <p style={{ fontSize: 13, color: textMuted, marginBottom: 20 }}>Nessun evento in programma.</p>}

        {passati.length > 0 && (
          <>
            <p style={{ ...sectionLabelStyle, marginTop: 20 }}>Passati</p>
            {passati.map((ev) => <Riga key={ev.id} ev={ev} passato />)}
          </>
        )}

        <div className="no-print" style={{ fontSize: 12, color: textSecondary, height: 18, marginTop: 8 }}>
          {saveState === "saving" && "Salvataggio..."}
          {saveState === "saved" && "Salvato"}
          {saveState === "error" && <span style={{ color: coral, fontWeight: 700 }}>⚠️ Non salvato, controlla la connessione e riprova</span>}
        </div>
      </div>
    </div>
  );
}

      <div style={{ marginBottom: 10 }}>
        <label style={labelStyle}>Tipo di evento</label>
        <div style={{ display: "flex", gap: 8 }}>
          {[["interno", "Interno"], ["esterno", "Esterno"]].map(([val, label]) => (
            <button
              key={val}
              type="button"
              onClick={() => setForm((f) => ({ ...f, tipo: val }))}
              style={{
                flex: 1,
                padding: "8px 0",
                borderRadius: 9,
                fontSize: 13,
                fontWeight: 700,

          <label style={labelStyle}>Data inizio</label>

        </div>
        <div>
          <label style={labelStyle}>Ora inizio</label>

      <p style={{ ...sectionLabelStyle, fontSize: 11, marginBottom: 8 }}>Fine</p>

          <label style={labelStyle}>Data fine</label>
          <input style={inputStyle} type="date" value={form.dataFine} onChange={(e) => setForm((f) => ({ ...f, dataFine: e.target.value }))} />
        </div>
        <div>
          <label style={labelStyle}>Ora fine</label>
          <input style={inputStyle} type="time" value={form.oraFine} onChange={(e) => setForm((f) => ({ ...f, oraFine: e.target.value }))} />
        </div>
      </div>

      <div style={{ marginBottom: 10 }}>
        <label style={labelStyle}>Luogo</label>
        <input style={inputStyle} type="text" value={form.luogo} onChange={(e) => setForm((f) => ({ ...f, luogo: e.target.value }))} />
      </div>

      <p style={{ ...sectionLabelStyle, fontSize: 11, marginBottom: 8 }}>Preventivi</p>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>
        <div>
          <label style={labelStyle}>Preventivo di spesa (€)</label>
          <input style={inputStyle} type="number" step="0.01" value={form.preventivoSpesa} onChange={(e) => setForm((f) => ({ ...f, preventivoSpesa: e.target.value }))} />

        <div>
          <label style={labelStyle}>Preventivo di incasso (€)</label>
          <input style={inputStyle} type="number" step="0.01" value={form.preventivoIncasso} onChange={(e) => setForm((f) => ({ ...f, preventivoIncasso: e.target.value }))} />

      </div>

      <p style={{ ...sectionLabelStyle, fontSize: 11, marginBottom: 4 }}>Consuntivo (dopo l'evento)</p>

        Solo questi valori entrano nel bilancio di Contabilità — il preventivo sopra resta solo una stima.

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>

          <input style={inputStyle} type="number" step="0.01" value={form.speseReale} placeholder="—" onChange={(e) => setForm((f) => ({ ...f, speseReale: e.target.value }))} />

        <div>
          <label style={labelStyle}>Incasso reale (€)</label>
          <input style={inputStyle} type="number" step="0.01" value={form.incassoReale} placeholder="—" onChange={(e) => setForm((f) => ({ ...f, incassoReale: e.target.value }))} />

      </div>

      <p style={{ ...sectionLabelStyle, fontSize: 11, marginBottom: 8 }}>Materiale</p>

        <textarea style={{ ...inputStyle, resize: "vertical", minHeight: 60 }} value={form.materialeDaPortare} placeholder="es. guanti, palloni, pettorine..." onChange={(e) => setForm((f) => ({ ...f, materialeDaPortare: e.target.value }))} />
      </div>
      <div style={{ marginBottom: 10 }}>
        <label style={labelStyle}>Materiale da richiedere in loco</label>
        <textarea style={{ ...inputStyle, resize: "vertical", minHeight: 60 }} value={form.materialeDaRichiedere} placeholder="es. porte, spogliatoio, cronometro..." onChange={(e) => setForm((f) => ({ ...f, materialeDaRichiedere: e.target.value }))} />

      <div>
        <label style={labelStyle}>Appunti preventivi</label>
        <textarea style={{ ...inputStyle, resize: "vertical", minHeight: 70 }} value={form.note} placeholder="Obiettivi, promemoria, contatti..." onChange={(e) => setForm((f) => ({ ...f, note: e.target.value }))} />
      </div>
    </>
  );
}

function PaginaSponsor({
  portieri,
  sponsorComm,
  sponsorTech,
  inventario,
  aggiungiSponsorComm,
  modificaSponsorComm,
  rimuoviSponsorComm,
  aggiungiSponsorTech,
  modificaSponsorTech,
  rimuoviSponsorTech,
  aggiungiInventario,
  modificaInventario,
  rimuoviInventario,
  confirmAction,
  Menu,
  TopBar,
  printStyle,
  handlePrint,
  handleShare,
}) {
  const [tab, setTab] = useState("commerciali");
  const [showForm, setShowForm] = useState(false);
  const [editSp, setEditSp] = useState(null);
  const [formEditSp, setFormEditSp] = useState({});
  const apriEditSp = (chiave, valori) => { setFormEditSp(valori); setEditSp(chiave); };
  const campoEditSp = (k, label, opzioni) => {
    const o = opzioni || {};
    return (
      <div key={k} style={{ gridColumn: o.largo ? "1 / -1" : undefined }}>
        <label style={labelStyle}>{label}</label>
        {o.scelte ? (
          <select style={inputStyle} value={formEditSp[k] || ""} onChange={(e) => setFormEditSp((f) => ({ ...f, [k]: e.target.value }))}>
            <option value="">— nessuno —</option>
            {o.scelte.map(([v, t]) => <option key={v} value={v}>{t}</option>)}
          </select>
        ) : (
          <input style={inputStyle} type={o.tipo || "text"} step={o.step} value={formEditSp[k] === undefined || formEditSp[k] === null ? "" : formEditSp[k]} onChange={(e) => setFormEditSp((f) => ({ ...f, [k]: e.target.value }))} />
        )}
      </div>
    );
  };
  const barraEditSp = (onSalva) => (
    <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
      <button onClick={() => { onSalva(); setEditSp(null); }} style={{ ...primaryBtn, padding: "8px 16px", fontSize: 13 }}>Salva</button>
      <button onClick={() => setEditSp(null)} style={{ ...ghostBtn, padding: "8px 16px", fontSize: 13 }}>Annulla</button>
    </div>
  );
  const bottoneModifica = (onClick) => (
    <button className="no-print" onClick={onClick} title="Modifica" style={{ background: "none", border: "none", color: textMuted, fontSize: 16, cursor: "pointer" }}>✎</button>
  );
  const [formComm, setFormComm] = useState({ nome: "", importo: "", data: oggiISO(), note: "" });
  const [formTech, setFormTech] = useState({ azienda: "", note: "" });
  const [formInv, setFormInv] = useState({ articolo: "", fornitore: "", modello: "", taglia: "", prezzo: "", quantita: "1", sponsorTechId: "", assegnatoA: "", data: oggiISO() });

  const totComm = sponsorComm.reduce((s, x) => s + (Number(x.importo) || 0), 0);

  const submitComm = () => {
    if (!formComm.nome || !formComm.importo) return;
    aggiungiSponsorComm({ ...formComm, importo: Number(formComm.importo) });
    setFormComm({ nome: "", importo: "", data: oggiISO(), note: "" });
    setShowForm(false);
  };
  const submitTech = () => {
    if (!formTech.azienda) return;
    aggiungiSponsorTech(formTech);
    setFormTech({ azienda: "", note: "" });
    setShowForm(false);
  };
  const submitInv = () => {
    if (!formInv.articolo || !formInv.quantita) return;
    aggiungiInventario({
      ...formInv,
      quantita: Number(formInv.quantita),
      prezzo: formInv.prezzo ? Number(formInv.prezzo) : null,
      sponsorTechId: formInv.sponsorTechId || null,
      assegnatoA: formInv.assegnatoA || null,
    });
    setFormInv({ articolo: "", fornitore: "", modello: "", taglia: "", prezzo: "", quantita: "1", sponsorTechId: "", assegnatoA: "", data: oggiISO() });
    setShowForm(false);
  };

  const nomeAzienda = (id) => {
    const s = sponsorTech.find((x) => String(x.id) === String(id));
    return s ? s.azienda : null;
  };
  const nomePortiere = (id) => {
    const p = portieri.find((x) => String(x.id) === String(id));
    return p ? p.nome : null;
  };

  const TabBtn = ({ id, label }) => (
    <button
      onClick={() => { setTab(id); setShowForm(false); }}
      style={{
        padding: "9px 16px",
        borderRadius: 10,
        fontSize: 13,
        fontWeight: 700,
        cursor: "pointer",
        border: tab === id ? `1px solid var(--accent-color, ${gold})` : `1px solid ${border}`,
        background: tab === id ? "var(--accent-dim)" : surface2,
        color: tab === id ? "var(--accent-soft)" : textSecondary,
      }}
    >
      {label}
    </button>
  );

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1000, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Sponsor" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 16px" }}>
          Sponsor commerciali, sponsor tecnici e inventario di kit/gadget dell'academy
        </p>

        <div className="no-print" style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
          <TabBtn id="commerciali" label="💰 Commerciali" />
          <TabBtn id="tecnici" label="👕 Tecnici" />
          <TabBtn id="inventario" label="📦 Inventario" />
        </div>

        {tab === "commerciali" && (
          <div>
            <div style={{ ...cardStyle }}>
              <p style={sectionLabelStyle}>Totale sponsorizzazioni commerciali</p>
              <p style={{ margin: 0, fontSize: 26, fontWeight: 700, color: "#1f9d55" }}>€{totComm.toFixed(2)}</p>
            </div>
            <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>
              <button onClick={() => setShowForm((v) => !v)} style={{ background: skyDim, color: sky, border: `1px solid ${sky}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                + Nuovo sponsor commerciale
              </button>
            </div>
            {showForm && (
              <div style={{ ...cardStyle, marginBottom: 16 }}>
                <label style={labelStyle}>Nome sponsor</label>
                <input style={{ ...inputStyle, marginBottom: 10 }} type="text" value={formComm.nome} onChange={(e) => setFormComm((f) => ({ ...f, nome: e.target.value }))} />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                  <div>
                    <label style={labelStyle}>Importo (€)</label>
                    <input style={inputStyle} type="number" step="0.01" value={formComm.importo} onChange={(e) => setFormComm((f) => ({ ...f, importo: e.target.value }))} />
                  </div>
                  <div>
                    <label style={labelStyle}>Data</label>
                    <input style={inputStyle} type="date" value={formComm.data} onChange={(e) => setFormComm((f) => ({ ...f, data: e.target.value }))} />
                  </div>
                </div>
                <label style={labelStyle}>Note</label>
                <input style={{ ...inputStyle, marginBottom: 14 }} type="text" value={formComm.note} onChange={(e) => setFormComm((f) => ({ ...f, note: e.target.value }))} />
                <button onClick={submitComm} disabled={!formComm.nome || !formComm.importo} style={{ ...primaryBtn, opacity: formComm.nome && formComm.importo ? 1 : 0.5 }}>Salva</button>
              </div>
            )}
            {sponsorComm.length === 0 && <p style={{ fontSize: 14, color: textMuted }}>Nessuno sponsor commerciale registrato.</p>}
            {[...sponsorComm].sort((a, b) => (b.data || "").localeCompare(a.data || "")).map((s) => (
              editSp === `comm-${s.id}` ? (
                <div key={s.id} style={cardStyle}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    {campoEditSp("nome", "Nome sponsor", { largo: true })}
                    {campoEditSp("importo", "Importo (€)", { tipo: "number", step: "0.01" })}
                    {campoEditSp("data", "Data", { tipo: "date" })}
                    {campoEditSp("note", "Note", { largo: true })}
                  </div>
                  {barraEditSp(() => modificaSponsorComm(s.id, { nome: formEditSp.nome, importo: Number(formEditSp.importo) || 0, data: formEditSp.data, note: formEditSp.note }))}
                </div>
              ) : (
                <div key={s.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: textPrimary }}>{s.nome}</p>
                    <p style={{ margin: "3px 0 0", fontSize: 13, color: textMuted }}>{formatData(s.data)}{s.note ? ` · ${s.note}` : ""}</p>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 15, fontWeight: 700, color: "#1f9d55" }}>€{Number(s.importo).toFixed(2)}</span>
                    {bottoneModifica(() => apriEditSp(`comm-${s.id}`, { nome: s.nome || "", importo: s.importo != null ? String(s.importo) : "", data: s.data || "", note: s.note || "" }))}
                    <button onClick={() => confirmAction("Eliminare questo sponsor?", () => rimuoviSponsorComm(s.id))} style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer" }}>×</button>
                  </div>
                </div>
              )
            ))}
          </div>
        )}

        {tab === "tecnici" && (
          <div>
            <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>
              <button onClick={() => setShowForm((v) => !v)} style={{ background: skyDim, color: sky, border: `1px solid ${sky}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                + Nuovo sponsor tecnico
              </button>
            </div>
            {showForm && (
              <div style={{ ...cardStyle, marginBottom: 16 }}>
                <label style={labelStyle}>Azienda</label>
                <input style={{ ...inputStyle, marginBottom: 10 }} type="text" value={formTech.azienda} onChange={(e) => setFormTech((f) => ({ ...f, azienda: e.target.value }))} />
                <label style={labelStyle}>Note (cosa fornisce)</label>
                <input style={{ ...inputStyle, marginBottom: 14 }} type="text" placeholder="es. kit gara, borse, gadget" value={formTech.note} onChange={(e) => setFormTech((f) => ({ ...f, note: e.target.value }))} />
                <button onClick={submitTech} disabled={!formTech.azienda} style={{ ...primaryBtn, opacity: formTech.azienda ? 1 : 0.5 }}>Salva</button>
              </div>
            )}
            {sponsorTech.length === 0 && <p style={{ fontSize: 14, color: textMuted }}>Nessuno sponsor tecnico registrato.</p>}
            {sponsorTech.map((s) => (
              editSp === `tech-${s.id}` ? (
                <div key={s.id} style={cardStyle}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
                    {campoEditSp("azienda", "Azienda")}
                    {campoEditSp("note", "Note")}
                  </div>
                  {barraEditSp(() => modificaSponsorTech(s.id, { azienda: formEditSp.azienda, note: formEditSp.note }))}
                </div>
              ) : (
                <div key={s.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: textPrimary }}>{s.azienda}</p>
                    {s.note && <p style={{ margin: "3px 0 0", fontSize: 13, color: textMuted }}>{s.note}</p>}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    {bottoneModifica(() => apriEditSp(`tech-${s.id}`, { azienda: s.azienda || "", note: s.note || "" }))}
                    <button onClick={() => confirmAction("Eliminare questo sponsor tecnico?", () => rimuoviSponsorTech(s.id))} style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer" }}>×</button>
                  </div>
                </div>
              )
            ))}
          </div>
        )}

        {tab === "inventario" && (
          <div>
            <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10, marginBottom: 10 }}>
                  <div>
                    <label style={labelStyle}>Taglia</label>
                    <input style={inputStyle} type="text" placeholder="es. M, 8, 9½…" value={formInv.taglia} onChange={(e) => setFormInv((f) => ({ ...f, taglia: e.target.value }))} />
                  </div>
                  <div>
                    <label style={labelStyle}>Quantità</label>

                  <div>
                    <label style={labelStyle}>Prezzo vendita (€)</label>
                    <input style={inputStyle} type="number" step="0.01" placeholder="facoltativo" value={formInv.prezzo} onChange={(e) => setFormInv((f) => ({ ...f, prezzo: e.target.value }))} />
                  </div>
                  <div>
                    <label style={labelStyle}>Data</label>
                    <input style={inputStyle} type="date" value={formInv.data} onChange={(e) => setFormInv((f) => ({ ...f, data: e.target.value }))} />
                  </div>
                </div>
                <div style={{ marginBottom: 10 }}>
                  <label style={labelStyle}>Fornito da (sponsor tecnico, facoltativo)</label>
                  <select style={inputStyle} value={formInv.sponsorTechId} onChange={(e) => setFormInv((f) => ({ ...f, sponsorTechId: e.target.value }))}>
                    <option value="">— non specificato —</option>
                    {sponsorTech.map((s) => (
                      <option key={s.id} value={s.id}>{s.azienda}</option>
                    ))}
                  </select>
                </div>
                <div style={{ marginBottom: 14 }}>
                  <label style={labelStyle}>Assegnato a (facoltativo)</label>
                  <SelettorePortiere portieri={portieri} value={formInv.assegnatoA} onChange={(v) => setFormInv((f) => ({ ...f, assegnatoA: v }))} consentiVuoto placeholder="— in magazzino —" />
                </div>
                <button onClick={submitInv} disabled={!formInv.articolo} style={{ ...primaryBtn, opacity: formInv.articolo ? 1 : 0.5 }}>Salva</button>
              </div>
            )}
            {inventario.length === 0 && <p style={{ fontSize: 14, color: textMuted }}>Nessun articolo in inventario.</p>}
            {inventario.map((i) => (
              editSp === `inv-${i.id}` ? (
                <div key={i.id} style={cardStyle}>

                    {campoEditSp("articolo", "Articolo", { largo: true })}
                    {campoEditSp("fornitore", "Fornitore")}
                    {campoEditSp("modello", "Modello")}
                    {campoEditSp("taglia", "Taglia")}
                    {campoEditSp("quantita", "Quantità", { tipo: "number" })}
                    {campoEditSp("prezzo", "Prezzo vendita (€)", { tipo: "number", step: "0.01" })}
                    {campoEditSp("data", "Data", { tipo: "date" })}
                    {campoEditSp("sponsorTechId", "Fornito da (sponsor tecnico)", { scelte: sponsorTech.map((x) => [String(x.id), x.azienda]) })}
                    {campoEditSp("assegnatoA", "Assegnato a", { scelte: portieri.map((x) => [String(x.id), x.nome]) })}
                  </div>
                  {barraEditSp(() => modificaInventario(i.id, {
                    articolo: formEditSp.articolo, fornitore: formEditSp.fornitore, modello: formEditSp.modello, taglia: formEditSp.taglia,
                    quantita: Math.max(0, Number(formEditSp.quantita) || 0),
                    prezzo: formEditSp.prezzo === "" || formEditSp.prezzo == null ? null : Number(formEditSp.prezzo),
                    data: formEditSp.data,
                    sponsorTechId: formEditSp.sponsorTechId || null, assegnatoA: formEditSp.assegnatoA || null,
                  }))}

                <div key={i.id} style={{ ...cardStyle, display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                    <p style={{ margin: "3px 0 0", fontSize: 13, color: textMuted }}>
                      {formatData(i.data)}
                      {nomeAzienda(i.sponsorTechId) ? ` · da ${nomeAzienda(i.sponsorTechId)}` : ""}
                      {nomePortiere(i.assegnatoA) ? ` · assegnato a ${nomePortiere(i.assegnatoA)}` : " · in magazzino"}
                    </p>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    {bottoneModifica(() => apriEditSp(`inv-${i.id}`, {
                      articolo: i.articolo || "", fornitore: i.fornitore || "", modello: i.modello || "", taglia: i.taglia || "",
                      quantita: i.quantita != null ? String(i.quantita) : "", prezzo: i.prezzo != null ? String(i.prezzo) : "",

function PaginaCertificati({ portieri, certificati, aggiungiCertificato, modificaCertificato, rimuoviCertificato, confirmAction, setView, Menu, TopBar, saveState, printStyle, handlePrint, handleShare }) {
  const vuoto = { portiereId: "", tipo: "", dataVisita: "", dataScadenza: "", medico: "", note: "", allegatoNome: null, allegatoTipo: null, allegatoData: null };
  const [form, setForm] = useState(vuoto);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);

  const TIPI = ["Visita sportiva agonistica", "Visita specialistica", "Altro referto"];

  const submit = () => {
    if (!form.portiereId || !form.tipo || !form.dataVisita) return;
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    aggiungiCertificato({ ...form, nome: portiere ? portiere.nome : "—" });
    setForm(vuoto);
    setShowForm(false);
  };

  const startEdit = (c) => {
    setEditId(c.id);
    setForm({ portiereId: c.portiereId, tipo: c.tipo, dataVisita: c.dataVisita, dataScadenza: c.dataScadenza || "", medico: c.medico || "", note: c.note || "", allegatoNome: c.allegatoNome || null, allegatoTipo: c.allegatoTipo || null, allegatoData: c.allegatoData || null });
  };

  const salvaEdit = () => {
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    modificaCertificato(editId, { ...form, nome: portiere ? portiere.nome : "—" });
    setEditId(null);
    setForm(vuoto);
  };

  const oggi = oggiISO();
  const ordinati = [...certificati].sort((a, b) => (b.dataVisita || "").localeCompare(a.dataVisita || ""));

  const statoScadenza = (c) => {
    if (!c.dataScadenza) return null;
    const giorni = Math.round((new Date(c.dataScadenza) - new Date(oggi)) / 86400000);
    if (giorni < 0) return { label: "Scaduto", fg: coral, bg: coralDim };
    if (giorni <= 30) return { label: `Scade tra ${giorni}g`, fg: goldSoft, bg: goldDim };
    return { label: `Valido fino al ${formatData(c.dataScadenza)}`, fg: "#1f9d55", bg: "rgba(31,157,85,0.12)" };
  };

  const FormCert = ({ f, setF }) => (
    <>
      <div style={{ marginBottom: 10 }}>
        <label style={labelStyle}>Portiere</label>
        <SelettorePortiere portieri={portieri} value={f.portiereId} onChange={(v) => setF((x) => ({ ...x, portiereId: v }))} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>
        <div>
          <label style={labelStyle}>Tipo</label>
          <select style={inputStyle} value={f.tipo} onChange={(e) => setF((x) => ({ ...x, tipo: e.target.value }))}>
            <option value="">Seleziona...</option>
            {TIPI.map((t) => (
              <option key={t} value={t}>{t}</option>
            ))}
          </select>
        </div>
        <div>
          <label style={labelStyle}>Medico / struttura</label>
          <input style={inputStyle} type="text" value={f.medico} onChange={(e) => setF((x) => ({ ...x, medico: e.target.value }))} />
        </div>
        <div>
          <label style={labelStyle}>Data visita</label>
          <input style={inputStyle} type="date" value={f.dataVisita} onChange={(e) => setF((x) => ({ ...x, dataVisita: e.target.value }))} />
        </div>
        <div>
          <label style={labelStyle}>Data scadenza</label>
          <input style={inputStyle} type="date" value={f.dataScadenza} onChange={(e) => setF((x) => ({ ...x, dataScadenza: e.target.value }))} />
        </div>
      </div>
      <div>
        <label style={labelStyle}>Note / esito referto</label>
        <textarea style={{ ...inputStyle, resize: "vertical", minHeight: 70 }} value={f.note} onChange={(e) => setF((x) => ({ ...x, note: e.target.value }))} />
      </div>
      <div style={{ marginTop: 10 }}>
        <label style={labelStyle}>Allegato (referto, certificato scansionato)</label>
        <input
          style={inputStyle}
          type="file"
          accept="image/*,application/pdf"
          onChange={(e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              setF((x) => ({ ...x, allegatoNome: file.name, allegatoTipo: file.type, allegatoData: evt.target.result }));
            };
            reader.readAsDataURL(file);
          }}
        />
        {f.allegatoNome && (
          <p style={{ fontSize: 12, color: "#1f9d55", margin: "6px 0 0" }}>
            📎 {f.allegatoNome}{" "}
            <button type="button" onClick={() => setF((x) => ({ ...x, allegatoNome: null, allegatoTipo: null, allegatoData: null }))} style={{ background: "none", border: "none", color: coral, cursor: "pointer", fontSize: 12 }}>
              rimuovi
            </button>
          </p>
        )}
        <p style={{ fontSize: 11, color: textMuted, margin: "4px 0 0" }}>File piccoli consigliati (l'app li salva localmente nel browser).</p>
      </div>
    </>
  );

  return (
    <div style={{ background: bg, minHeight: "100%", fontFamily: "-apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", system-ui, sans-serif" }}>
      {printStyle}
      <Menu />
      <div id="print-area" style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 40px 48px" }}>
        <TopBar title="Certificati" />
        <p style={{ fontSize: 14, color: textSecondary, margin: "10px 0 0" }}>{certificati.length} certificati registrati</p>

        <div className="no-print" style={{ margin: "16px 0" }}>
          <ExportBar onPrint={handlePrint} onShare={() => handleShare("Certificati", `${certificati.length} certificati registrati`)} />
        </div>

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
          <button onClick={() => { setShowForm((v) => !v); setForm(vuoto); setEditId(null); }} style={{ background: coralDim, color: coral, border: `1px solid ${coral}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
            + Nuovo certificato
          </button>
        </div>

        {showForm && (
          <div style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuovo certificato</p>
            <FormCert f={form} setF={setForm} />
            <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
              <button onClick={submit} disabled={!form.portiereId || !form.tipo || !form.dataVisita} style={{ ...primaryBtn, flex: 1, opacity: form.portiereId && form.tipo && form.dataVisita ? 1 : 0.5 }}>Salva</button>
              <button onClick={() => setShowForm(false)} style={ghostBtn}>Annulla</button>
            </div>
          </div>
        )}

        {ordinati.map((c) => {
          const stato = statoScadenza(c);
          if (editId === c.id) {
            return (
              <div key={c.id} style={{ ...cardStyle, marginBottom: 10 }}>
                <FormCert f={form} setF={setForm} />
                <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                  <button onClick={salvaEdit} style={primaryBtn}>Salva</button>
                  <button onClick={() => { setEditId(null); setForm(vuoto); }} style={ghostBtn}>Annulla</button>
                </div>
              </div>
            );
          }
          return (
            <div key={c.id} style={{ ...cardStyle, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                <div style={{ minWidth: 0 }}>
                  <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: textPrimary }}>{c.nome}</p>
                  <p style={{ margin: "3px 0 0", fontSize: 13, color: textMuted }}>
                    {c.tipo} · {formatData(c.dataVisita)}{c.medico ? ` · ${c.medico}` : ""}
                  </p>
                  {c.note && <p style={{ margin: "6px 0 0", fontSize: 13, color: textSecondary }}>{c.note}</p>}
                  {c.allegatoData && (
                    <a href={c.allegatoData} download={c.allegatoNome} style={{ display: "inline-block", marginTop: 6, fontSize: 12, color: "#1f9d55", textDecoration: "none" }}>
                      📎 {c.allegatoNome}
                    </a>
                  )}
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
                  {stato && (
                    <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 100, color: stato.fg, background: stato.bg, whiteSpace: "nowrap" }}>
                      {stato.label}
                    </span>
                  )}
                  <button onClick={() => startEdit(c)} style={{ background: "none", border: "none", color: textMuted, fontSize: 14, cursor: "pointer" }}>✎</button>
                  <button onClick={() => confirmAction("Eliminare questo certificato?", () => rimuoviCertificato(c.id))} style={{ background: "none", border: "none", color: textMuted, fontSize: 18, cursor: "pointer" }}>×</button>
                </div>
              </div>
            </div>
          );
        })}
        {ordinati.length === 0 && <p style={{ textAlign: "center", color: textSecondary, fontSize: 15, padding: "40px 0" }}>Nessun certificato registrato.</p>}

        <div style={{ fontSize: 12, color: textSecondary, height: 18, marginTop: 8 }}>
          {saveState === "saving" && "Salvataggio..."}
          {saveState === "saved" && "Salvato"}
          {saveState === "error" && <span style={{ color: coral, fontWeight: 700 }}>⚠️ Non salvato, controlla la connessione e riprova</span>}
        </div>
      </div>
    </div>
  );
}

function PaginaPacchetti({ portieri, pacchetti, aggiungiPacchetto, rinnovaPacchetto, rimuoviPacchetto, modificaPacchetto, rinnovoDa, apriForm, confirmAction, settings, setView, Menu, TopBar, printStyle, handlePrint, handleShare }) {
  const rigeneraDateIniziale = (dataInizio, numeroSedute) => {
    if (!dataInizio) return [];
    const n = Math.min(10, Math.max(2, Number(numeroSedute) || 4));
    const out = [];
    for (let i = 0; i < n; i++) {
      out.push(aggiungiGiorni(dataInizio, i * 7));
    }
    return out;
  };
  const [form, setForm] = useState(() =>
    rinnovoDa
      ? {
          portiereId: String(rinnovoDa.portiereId),
          dataInizio: rinnovoDa.dataInizio,
          orario: rinnovoDa.orario || "17:00",
          numeroSedute: String(rinnovoDa.numeroSedute || 4),
          datePrestabilite: rigeneraDateIniziale(rinnovoDa.dataInizio, rinnovoDa.numeroSedute),
          dataScadenzaSaldo: rinnovoDa.dataInizio,
          importoTotale: "",
          metodoPagamento: "",
          pagato: false,
          acconto: "",
          dataAcconto: "",
          note: "",
        }
      : { portiereId: "", dataInizio: "", orario: "17:00", numeroSedute: "4", datePrestabilite: [], dataScadenzaSaldo: "", importoTotale: "", metodoPagamento: "", pagato: false, acconto: "", dataAcconto: "", note: "" }
  );
  const [showForm, setShowForm] = useState(!!rinnovoDa || !!apriForm);
  const [tipoForm, setTipoForm] = useState("normale"); // "normale" | "speciale"

  const DURATE_DISPONIBILI = [0.5, 1, 1.5, 2, 2.5, 3];

  const rigeneraPianificazione = (dataInizio, numeroSedute, pianificazioneEsistente) => {
    if (!dataInizio) return [];
    const n = Math.max(1, Math.floor(Number(numeroSedute)) || 1);
    const out = [];
    for (let i = 0; i < n; i++) {
      if (pianificazioneEsistente[i]) {
        out.push(pianificazioneEsistente[i]);
      } else {
        out.push({ data: aggiungiGiorni(dataInizio, i * 7), durata: 1 });
      }
    }
    return out;
  };

  const [formSpeciale, setFormSpeciale] = useState({
    portiereId: "", dataInizio: "", orario: "17:00", numeroSedute: "1",
    pianificazione: [], dataScadenzaSaldo: "", importoTotale: "", metodoPagamento: "", pagato: false, note: "",
  });

  const setDataInizioSpeciale = (val) => {
    setFormSpeciale((f) => ({ ...f, dataInizio: val, pianificazione: rigeneraPianificazione(val, f.numeroSedute, f.pianificazione), dataScadenzaSaldo: f.dataScadenzaSaldo || val }));
  };
  const setNumeroSeduteSpeciale = (val) => {
    const n = Math.max(1, Math.floor(Number(val)) || 1);
    setFormSpeciale((f) => ({ ...f, numeroSedute: String(n), pianificazione: rigeneraPianificazione(f.dataInizio, n, f.pianificazione) }));
  };
  const setPianificazioneCampo = (i, campo, val) => {
    setFormSpeciale((f) => {
      const next = [...f.pianificazione];
      next[i] = { ...next[i], [campo]: val };
      return { ...f, pianificazione: next };
    });
  };

  const submitSpeciale = () => {
    if (!formSpeciale.portiereId || !formSpeciale.dataInizio || !formSpeciale.numeroSedute) return;
    const portiere = portieri.find((p) => String(p.id) === String(formSpeciale.portiereId));
    const oreTotali = formSpeciale.pianificazione.reduce((s, x) => s + (Number(x.durata) || 0), 0);
    const id = aggiungiPacchetto({
      tipo: "speciale",
      portiereId: formSpeciale.portiereId,
      nome: portiere ? portiere.nome : "—",
      dataInizio: formSpeciale.dataInizio,
      orario: formSpeciale.orario || null,
      numeroSedute: Number(formSpeciale.numeroSedute),
      pianificazione: formSpeciale.pianificazione,
      oreTotali,
      dataScadenzaSaldo: formSpeciale.dataScadenzaSaldo || formSpeciale.dataInizio,
      importoTotale: formSpeciale.importoTotale ? Number(formSpeciale.importoTotale) : null,
      metodoPagamento: formSpeciale.metodoPagamento || null,
      pagato: formSpeciale.pagato,
      dataPagamento: formSpeciale.pagato ? oggiISO() : null,
      note: formSpeciale.note || null,
    });
    setFormSpeciale({ portiereId: "", dataInizio: "", orario: "17:00", numeroSedute: "1", pianificazione: [], dataScadenzaSaldo: "", importoTotale: "", metodoPagamento: "", pagato: false, note: "" });
    setShowForm(false);
    setView({ page: "pacchetto-dettaglio", id });
  };

  // Rigenera le date prestabilite (cadenza settimanale) quando cambia il numero di sedute o la data di inizio,
  // conservando le date già impostate manualmente dove possibile.
  const rigeneraDate = (dataInizio, numeroSedute, dateEsistenti) => {
    if (!dataInizio) return [];
    const n = Math.min(10, Math.max(2, Number(numeroSedute) || 4));
    const out = [];
    for (let i = 0; i < n; i++) {
      if (dateEsistenti[i]) {
        out.push(dateEsistenti[i]);
      } else {
        out.push(aggiungiGiorni(dataInizio, i * 7));
      }
    }
    return out;
  };

  const setDataInizio = (val) => {
    setForm((f) => ({ ...f, dataInizio: val, datePrestabilite: rigeneraDate(val, f.numeroSedute, f.datePrestabilite), dataScadenzaSaldo: f.dataScadenzaSaldo || val }));
  };
  const setNumeroSedute = (val) => {
    const n = Math.min(10, Math.max(2, Number(val) || 4));
    setForm((f) => ({ ...f, numeroSedute: String(n), datePrestabilite: rigeneraDate(f.dataInizio, n, f.datePrestabilite) }));
  };
  const setDataSeduta = (i, val) => {
    setForm((f) => {
      const next = [...f.datePrestabilite];
      next[i] = val;
      return { ...f, datePrestabilite: next };
    });
  };

  const submit = () => {
    if (!form.portiereId || !form.dataInizio || !form.numeroSedute) return;
    const portiere = portieri.find((p) => String(p.id) === String(form.portiereId));
    const nuovoPacchetto = {
      portiereId: form.portiereId,
      nome: portiere ? portiere.nome : "—",
      dataInizio: form.dataInizio,
      orario: form.orario || null,
      numeroSedute: Number(form.numeroSedute),
      datePrestabilite: form.datePrestabilite,
      dataScadenzaSaldo: form.dataScadenzaSaldo || form.dataInizio,
      importoTotale: form.importoTotale ? Number(form.importoTotale) : null,
      metodoPagamento: form.metodoPagamento || null,
      pagato: form.pagato,
      dataPagamento: form.pagato ? oggiISO() : null,
      acconto: form.acconto ? Number(form.acconto) : null,

    const id = (rinnovoDa && rinnovoDa.idVecchio)

  return (

        <div className="no-print" style={{ margin: "16px 0" }}>

        </div>

        <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 16 }}>

            style={{ background: skyDim, color: sky, border: `1px solid ${sky}`, borderRadius: 10, padding: "9px 14px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}

            + Nuovo pacchetto
          </button>
          <button
            onClick={() => { setTipoForm("speciale"); setShowForm((v) => (tipoForm === "speciale" ? !v : true)); }}

        {showForm && tipoForm === "speciale" && (

            <label style={labelStyle}>Portiere</label>

            {formSpeciale.dataInizio && formSpeciale.pianificazione.length > 0 && (

            <div style={{ marginBottom: 10 }}>

            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Importo totale pacchetto (€)</label>
              <input style={inputStyle} type="number" step="0.01" value={formSpeciale.importoTotale} onChange={(e) => setFormSpeciale((f) => ({ ...f, importoTotale: e.target.value }))} />

            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Metodo di pagamento</label>

            <div style={{ marginBottom: 14 }}>

            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: textPrimary, cursor: "pointer", marginBottom: 14 }}>

            {(!formSpeciale.portiereId || !formSpeciale.dataInizio) && (

        {showForm && tipoForm === "normale" && (
          <div style={{ ...cardStyle, marginBottom: 18 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>Nuovo pacchetto</p>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Portiere</label>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 }}>

              <select style={inputStyle} value={form.numeroSedute} onChange={(e) => setNumeroSedute(e.target.value)}>

            {form.numeroSedute && !form.dataInizio && (

              </p>
            )}
            {form.dataInizio && (form.datePrestabilite || []).length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <label style={labelStyle}>Date prestabilite delle sedute (modificabili)</label>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {form.datePrestabilite.map((d, i) => (
                    <input key={i} style={inputStyle} type="date" value={d} onChange={(e) => setDataSeduta(i, e.target.value)} />
                  ))}

              </div>
            )}

            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Giorno del saldo (di solito la 1ª seduta)</label>
              <input style={inputStyle} type="date" value={form.dataScadenzaSaldo} onChange={(e) => setForm((f) => ({ ...f, dataScadenzaSaldo: e.target.value }))} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Importo totale pacchetto (€)</label>
              <input style={inputStyle} type="number" step="0.01" value={form.importoTotale} placeholder="—" onChange={(e) => setForm((f) => ({ ...f, importoTotale: e.target.value }))} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <label style={labelStyle}>Metodo di pagamento</label>
              <select style={inputStyle} value={form.metodoPagamento} onChange={(e) => setForm((f) => ({ ...f, metodoPagamento: e.target.value }))}>
                <option value="">— non specificato —</option>
                {OPTS.metodoPagamento.map((m) => (
                  <option key={m} value={m}>{m}</option>
                ))}
              </select>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
              <div>
                <label style={labelStyle}>Acconto ricevuto (facoltativo)</label>
                <input style={inputStyle} type="number" step="0.01" placeholder="es. 20" value={form.acconto} onChange={(e) => setForm((f) => ({ ...f, acconto: e.target.value, dataAcconto: e.target.value && !f.dataAcconto ? oggiISO() : f.dataAcconto }))} />
              </div>
              <div>
                <label style={labelStyle}>Data acconto</label>
                <input style={inputStyle} type="date" value={form.dataAcconto} onChange={(e) => setForm((f) => ({ ...f, dataAcconto: e.target.value }))} />
