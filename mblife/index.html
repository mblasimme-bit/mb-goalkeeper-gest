<title>MBlife</title>
<style>
:root{--gold:#D4AF6A;--gold2:#E9D19F;--grad:linear-gradient(135deg,#F3DDA4 0%,#D4AF6A 48%,#A47C3B 100%);--on:#1b140a;
  --bg:#0b0a08;--s1:rgba(30,25,18,.92);--s2:#231e16;--s3:#2c251a;--line:rgba(233,209,159,.12);--text:#f7f1e4;--muted:#ab9f88;--faint:#756b58;
  --inc:#2ED47A;--exp:#FF5C5C;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{background:radial-gradient(700px 420px at 100% -5%,rgba(212,175,106,.28),transparent 62%),radial-gradient(600px 400px at -10% 105%,rgba(212,175,106,.14),transparent 60%),linear-gradient(180deg,#15120c,#0b0a08 60%);background-attachment:fixed}
button,input{font:inherit;color:inherit}
svg.i{width:1em;height:1em;flex-shrink:0}
#app{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 14px);display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top .logo{width:30px;height:30px;border-radius:10px;overflow:hidden;box-shadow:0 6px 16px rgba(212,175,106,.3)}.top .logo img{width:100%;height:100%;display:block}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px}.top h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;font-size:19px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px;border-radius:11px;font-weight:750;color:var(--muted)}
.seg button.on.exp{background:var(--exp);color:#fff}.seg button.on.inc{background:var(--inc);color:#06210f}
.amount{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;padding:6px 6px 0;min-height:58px}
.amount .cur{font-size:28px;font-weight:800;color:var(--faint)}
.amount .v{font-size:44px;font-weight:850;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.amount .v.zero{color:var(--faint)}
.sec{font-size:10.5px;font-weight:750;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:4px 2px 4px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px;border-radius:14px;border:1px solid transparent;background:none;scroll-snap-align:start}
.cat .b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:19px;background:var(--c);box-shadow:0 5px 14px -4px var(--c)}
.cat span{font-size:11.5px;font-weight:650;line-height:1.15;text-align:center;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat.on{background:var(--s3);border-color:var(--gold)}.cat.on span{color:var(--text)}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.chip{border:1px solid var(--line);background:var(--s2);border-radius:20px;padding:6px 13px;font-weight:650;font-size:13.5px;color:var(--muted)}
.chip.on{background:var(--grad);color:var(--on);border-color:transparent}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.note{width:100%;border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:9px 12px;font-size:16px;outline:none;margin-top:8px}
.note:focus{border-color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pad button{border:0;background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:8px 0;font-size:22px;font-weight:650}
.pad button:active{background:var(--s3)}
.save{margin-top:8px;width:100%;border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:800;background:var(--grad);color:var(--on);box-shadow:0 10px 26px -8px rgba(212,175,106,.6)}
.save:disabled{opacity:.4;box-shadow:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:14px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it .b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;background:var(--c);flex:none}
.it .m{flex:1;min-width:0}.it .t1{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t2{font-size:12px;color:var(--muted)}
.it .a{font-weight:800;font-variant-numeric:tabular-nums}.it .x{border:0;background:none;color:var(--faint);font-size:18px;padding:4px 6px}
.it.sent{opacity:.5}
.send{display:flex;align-items:center;gap:10px}
.send .btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--grad);color:var(--on)}
.btn2{border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:10px 14px;font-weight:700}
.muted{color:var(--muted)}.inc{color:var(--inc)}.exp{color:var(--exp)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%);background:#2a2318;border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:50;transition:opacity .3s}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:40}
.sheet>div{background:#16130e;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(var(--safe-b) + 18px);width:100%;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:19px}
.sheet p{color:var(--muted);font-size:14px;margin:6px 0 12px}
.sheet .btn2{width:100%;margin-top:8px;text-align:left}
</style>
</head>

function fileText(list) { return list.slice().sort((a, b) => a.ts - b.ts).map(i => [i.when, i.kind === 'income' ? 'Entrata' : 'Spesa', (i.cents / 100).toFixed(2).replace('.', ','), i.cat, i.acc, (i.note || '').replace(/[;\r\n]/g, ' ')].join(';')).join('\n') + '\n'; }
async function sendList(list) {
  if (!list.length) return;
  const text = fileText(list); const name = 'MBlife-movimenti.txt';
  const file = new File([text], name, {type:'text/plain'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'MBlife'}); }
    else { const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); }
    list.forEach(i => { i.sent = true; }); save(); ui.sheet = null; render(); toast('Mandato ✓ Apri MBlife sul Mac');
  } catch (e) { if (e && e.name === 'AbortError') return; toast('Invio non riuscito: riprova'); }
}
function importCfg(text) {
  try {
    const o = JSON.parse(text); if (!o || o.kind !== 'mblife-phone-config') throw 0;
    const map = k => (o.categories[k] || []).map(c => ({name:c.name, icon:ICONS[c.icon] ? c.icon : 'tags', color:c.color || '#94A3B8', subs:Array.isArray(c.subs) ? c.subs : []}));
    S.cats = {expense:map('expense'), income:map('income')}; if (Array.isArray(o.accounts) && o.accounts.length) S.accounts = o.accounts;
    if (o.cash && S.accounts.includes(o.cash)) S.lastAcc = S.lastAcc || o.cash;
    save(); ui.sheet = null; ui.cat = null; render(); toast(`Caricate ${S.cats.expense.length + S.cats.income.length} categorie ✓`);
  } catch { toast('Questo non è il file di MBlife per l\'iPhone'); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'close' && e.target.closest('[data-stop]') && !e.target.closest('button[data-a=close]')) return;
  const a = el.dataset.a;
  if (a === 'kind') { ui.kind = el.dataset.k; ui.cat = null; ui.sub = null; }
  else if (a === 'cat') { ui.cat = ui.cat === el.dataset.n ? null : el.dataset.n; ui.sub = null; }
  else if (a === 'sub') ui.sub = ui.sub === el.dataset.n ? null : el.dataset.n;
  else if (a === 'acc') ui.acc = el.dataset.n;
  else if (a === 'key') { const k = el.dataset.k; let v = ui.amt;
    if (k === '⌫') v = v.slice(0, -1);
    else if (k === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
    else { if (v.includes(',') && v.split(',')[1].length >= 2) return; if (v === '0') v = ''; if (v.replace(',', '').length >= 8) return; v += k; }
    ui.amt = v; }
  else if (a === 'save') { const cents = amtCents(); if (!cents || !ui.cat) return;
    const it = {id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts:Date.now(), when:nowStr(), kind:ui.kind, cents, cat:ui.sub ? `${ui.cat} › ${ui.sub}` : ui.cat, acc:ui.acc, note:(ui.note || '').trim(), sent:false};
    S.items.push(it); S.use[ui.kind + '|' + ui.cat] = (S.use[ui.kind + '|' + ui.cat] || 0) + 1; S.lastAcc = ui.acc; save();
    ui.amt = ''; ui.note = ''; ui.cat = null; ui.sub = null; toast(`Segnato ${fmt(cents)} ✓`); if (navigator.vibrate) navigator.vibrate(15); }
  else if (a === 'del') { if (!confirm('Eliminare questo movimento?')) return; S.items = S.items.filter(i => i.id !== el.dataset.id); save(); }
  else if (a === 'send') { sendList(S.items.filter(i => !i.sent)); return; }
  else if (a === 'resend') { const lim = Date.now() - 7 * 864e5; sendList(S.items.filter(i => i.ts > lim)); return; }
  else if (a === 'clearsent') { if (!confirm('Cancellare dal telefono i movimenti già mandati al Mac?')) return; S.items = S.items.filter(i => !i.sent); save(); toast('Fatto ✓'); }
  else if (a === 'settings') ui.sheet = 'settings';
  else if (a === 'close') ui.sheet = null;
  render();
});
load(); render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
